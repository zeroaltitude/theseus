[package]
name = "theseus-store"
description = "The durable keel: append-only WAL with checksummed atomic frames and torn-tail recovery, a rebuildable redb index, checkpoints, and the Store contract the kernel writes through."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
crc32fast = "1"
redb.workspace = true
# `blocking`: an append's wait holds no runtime worker (theseus-vni9).
tokio.workspace = true
# `pressure`: SCHED_IDLE for a thread that answers no one (theseus-tood).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
rand = "0.9"
# `pressure`'s waits on tokio's paused clock.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
