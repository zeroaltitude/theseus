[package]
name = "theseus-core"
description = "The Theseus kernel: config and secrets, sessions, turn runner, provider, advancer, store."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
theseus-protocol.workspace = true
theseus-store.workspace = true
theseus-kernel.workspace = true
theseus-tools.workspace = true
theseus-sandbox.workspace = true
# AWS (row 29, C1 = 14a): one caller for every operation, and its catalog.
theseus-aws = { path = "../theseus-aws" }
# AWS (row 30, C2 = 14b): the guard list both enforcers read.
theseus-aws-guard = { path = "../theseus-aws-guard" }
# Recall's science: the filters, the rank, and the pack (M6 step 30a).
theseus-memory = { path = "../theseus-memory" }
# The ontology (row 26, 21b): its records, the snapshot, and the compile walk.
theseus-ontology = { path = "../theseus-ontology" }
# The language-server client (L1), which the board and the lsp.* tools drive (L2).
theseus-lsp = { path = "../theseus-lsp" }
anyhow.workspace = true
base64.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
futures-util.workspace = true
reqwest.workspace = true
tracing.workspace = true
zeroize.workspace = true
uuid = { workspace = true, features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
# A rename's diff (L2), as text.diff makes one.
similar = "3.2.0"
# A wake's time in the daemon's time zone (`localtime_r`; DD8).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# The paused clock for tests that prove a wait never happens (theseus-ksfu);
# theseus-aws and theseus-voice enable it already, so the workspace's test
# build is unchanged.
tokio = { workspace = true, features = ["test-util"] }
proptest.workspace = true
# The conformance tests read the exporter's OTLP JSON back through OTLP's own
# types (theseus-hee). Messages and serde only: no tonic, and nothing in the
# shipped build.
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "with-serde", "trace", "metrics"] }
# The reader rule's registry test (theseus-wjy) reads the sources as Rust
# tokens, so a string or a comment that names a variant is never taken for its
# sender or its reader. Already in the build, under syn, with these features.
proc-macro2 = "1"

[lints]
workspace = true
