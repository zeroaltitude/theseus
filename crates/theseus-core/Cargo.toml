[package]
name = "theseus-core"
description = "The Theseus kernel: config and secrets, sessions, turn runner, provider, advancer, store."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
theseus-protocol.workspace = true
theseus-store.workspace = true
theseus-kernel.workspace = true
theseus-tools.workspace = true
anyhow.workspace = true
base64.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
futures-util.workspace = true
reqwest.workspace = true
tracing.workspace = true
zeroize.workspace = true
uuid.workspace = true
sha2 = "0.10"
hex = "0.4"
shellexpand.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }

[features]
# OTLP/HTTP export of each turn's trace and metrics (spec §3.20). Off by
# default: without it `[telemetry]` still parses and nothing is exported.
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp"]

[dev-dependencies]
tempfile = "3"
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
