[package]
name = "theseus-core"
description = "The Theseus kernel: config and secrets, sessions, turn runner, provider, advancer, store."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
theseus-protocol.workspace = true
theseus-store.workspace = true
theseus-kernel.workspace = true
theseus-tools.workspace = true
anyhow.workspace = true
base64.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
futures-util.workspace = true
reqwest.workspace = true
tracing.workspace = true
zeroize.workspace = true
uuid = { workspace = true, features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
shellexpand.workspace = true

[dev-dependencies]
tempfile = "3"
# The conformance tests read the exporter's OTLP JSON back through OTLP's own
# types (theseus-hee). Messages and serde only: no tonic, and nothing in the
# shipped build.
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "with-serde", "trace", "metrics"] }

[lints]
workspace = true
