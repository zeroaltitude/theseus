# The Ship of Theseus — configuration template
#
# Every parameter Theseus reads appears here exactly once: either set to the
# value this deployment runs with (the built-in default is noted where the two
# differ), or commented out with its default shown. Nothing here is decorative:
# a key that the code does not read cannot appear (the loader rejects unknown
# keys), and a test un-comments every line and parses the result, so this file
# cannot drift from the code.
#
# Where it lives: --config, else THESEUS_CONFIG, else the file
# ~/.theseus/theseus.toml if it exists, else /etc/theseus/theseus.toml
# (scripts/setup.sh writes that one from this template, every secret an op://
# reference). Or keep it in 1Password, as a Secure Note, so a deployment is
# reconstructible from the vault, and point --config or THESEUS_CONFIG at it:
#   export THESEUS_CONFIG='op://<your vault>/<config note>/notesPlain'
# A config needs only what differs from the defaults: every key has one, so a
# note of only [secrets] loads. Keep yours that way rather than as a copy of
# this file, and a new key or a changed default reaches it with the next
# build. `theseusd config --sparse` prints a config cut to what differs (its
# secrets' references, every value that differs, and nothing else), which
# loads to the same config; `theseusd config` prints a config whole.
# Precedence for the few things that also have flags (socket, state dir):
#   command-line flag > environment variable > this file > built-in default.
#
# Secrets never appear as values. The recommended source is 1Password: each
# secret is an op:// reference, read through the service account, and a
# reference may end in `#label` to select one `label: value` line of a
# multi-line note. Where there is no vault (a container, CI), a secret may come
# from the daemon's environment or a private file instead ([secrets] below).
# Secrets resolve in the background while the daemon serves: each consumer
# waits for its own, and fails closed if it did not resolve, and a failed one
# is fetched again. A config kept in the vault cannot start without vault
# access; a config file can, and then only its op:// secrets fail.

# The Narrative: a web UI tab narrating every session, turn, loop, and model call (default false: no tab, no lines).
narrative = true

# ---------------------------------------------------------------- model
# The defaults every profile inherits: a profile that leaves a setting out takes
# this section's (provider, max_output_tokens, system, effort, thinking_display,
# max_loops, on_max_loops, refusal_fallbacks; cache_ttl and keep_warm_hours come from
# the cache section's ttl and keep_warm_hours), and the implicit "default" profile is built from it. `live` names the
# profile that is live at startup; a runtime switch (`theseus profile use`)
# persists in the store and wins over this value on restart.
[model]
live = "sonnet"
provider = "anthropic"                  # a key of [providers], or the implicit "anthropic"
model = "claude-sonnet-5-5"
# Output cap per call (the Messages API's max_tokens). NOT an input limit: input is
# whatever the compiler assembles, bounded by the model's context window. Omitted,
# it defaults to the model's ceiling from the catalog (Sonnet 5/5.5, Opus 5/5.5,
# Fable 5.1: 128k; Haiku 4.5: 64k; GLM-5.x: 128k). You pay only for tokens generated.
# max_output_tokens = 128000
# system = "You are Theseus."           # appended to the built-in persona, the assembly note, the precedence line, and the tools note
# effort = "high"                       # low | medium | high | xhigh | max (models that take effort)
thinking_display = "summarized"         # summarized | omitted | updates (Fable 5.x, Opus 5.5)
max_loops = 40                          # tool loops per turn before a notice (or, with "end", the turn's end)
# What reaching max_loops does (theseus-usei; the owner's decision, 2026-10-07:
# for tasks and tokens, notify, not restrict). "notify" posts one notice to the
# session's place at max_loops, and one at each multiple of it, and the turn
# goes on until the model stops calling tools or you stop it (`theseus stop`,
# `/stop`, the cockpit's Stop). "end" ends the turn there, as before. Each
# profile may set its own; this is the default every profile inherits.
on_max_loops = "notify"               # notify | end
refusal_fallbacks = true                # server-side refusal fallbacks where the model supports them
end_note = true                         # a turn ending beside new command outputs, or after edits no command ran since, is told so once
api_base = "https://api.anthropic.com"  # the implicit anthropic provider's endpoint
api_key_secret = "anthropic_api_key"    # name of the [secrets] entry holding its key

# Provider call timeouts. Each failure is classified (timeout with its phase,
# network, rate_limited, overloaded, server, auth, invalid_request, stream,
# truncated); a failed turn is retried by its session's driver, with a
# backoff for the classes that pass with time.
[model.timeouts]
connect_secs = 10                       # TCP + TLS
first_byte_secs = 60                    # request sent → response headers
stream_idle_secs = 60                   # longest silence between stream events
total_secs = 600                        # a call before its stream begins; a live stream may run to 3x this

# A call that fails with a class that passes with time (timeout, network,
# rate_limited, overloaded, server, stream, truncated) can be made again
# inside its turn, after a wait that doubles each time: a 429 or a 503 is asked
# again before the turn gives up. Set it to 0 to leave every retry to the
# driver, whose retry, with its notice, serves a daemon you talk to. A
# headless run (`theseus --spawn theseusd ask`) ends with its turn, so it
# gets no later retry; the bench profile sets it.
[model.retries]
transient = 2                           # retries inside a turn; 0: none
backoff_ms = 2000                       # the wait before the first one
backoff_max_ms = 30000                  # the longest one wait
# A request the model refuses is made once more on its catalog entry's
# refusal_fallback_model (Sonnet 5.5's: Sonnet 5), by the same provider; the
# fallback answers that request and the next goes back to the model, and the reply
# says so. A refusal there ends the turn.
refusal = true                          # false: a refusal ends its turn
# The turn stays on the fallback from a refusal of one of these categories, or
# from the third refusal in a row; a refusal of any other category goes back.
hard_decline_categories = ["cyber", "bio", "general_harms"]

# ---------------------------------------------------------------- profiles
# A profile is provider + model + output limit + system prompt. Exactly one is
# live. `theseus ask -P <name>` runs one turn under another profile.
[profiles.sonnet]
provider = "anthropic"
model = "claude-sonnet-5-5"
# max_output_tokens = 64000             # omitted: the catalog ceiling (128000 for Sonnet 5.5)
# system = ""
# effort = "xhigh"                      # the recommended level for coding and agentic work
# effort_fixed = false                  # true: effort stands whatever route.v9 answers ([routing])
thinking_display = "summarized"
max_loops = 40
refusal_fallbacks = true
# How long the provider keeps this profile's cached prompt prefixes: 5m (the default)
# or 1h. A 1-hour entry costs 2x input to write instead of 1.25x, and pays when a
# conversation pauses 5 to 60 minutes after most of its prefix is written: then the
# next call reads the prefix instead of writing it again. It applies to every cache
# breakpoint, the conversation's included; a task's own conversation stays 5m. A profile
# that says none takes [cache]'s ttl; one that must stay at 5 minutes under a 1-hour [cache]
# says cache_ttl = "5m". Its keep_warm_hours overrides [cache]'s the same way.
# cache_ttl = "1h"
# keep_warm_hours = 24                  # none: [cache]'s

[profiles.glm]
provider = "zai"
model = "glm-5.3-flash"
# max_output_tokens = 64000             # omitted: the catalog ceiling (131072 for GLM-5.3 Flash)
thinking_display = "summarized"
max_loops = 40
refusal_fallbacks = true

# The profiles [routing] names by default (M5 25e): hard reasoning on Opus 5.5 or
# Fable 5.1; acknowledgements and quick questions on Haiku 5.5 for their turn alone,
# and routine programming on Haiku 5.5 at high effort (theseus-3okf).
[profiles.opus]
provider = "anthropic"
model = "claude-opus-5-5"
thinking_display = "summarized"
max_loops = 40

[profiles.fable]
provider = "anthropic"
model = "claude-fable-5-1"
thinking_display = "summarized"
max_loops = 40

# Opus 5.5 at high effort: a review's first profile (theseus-p8dy), so a check of
# something already made runs where careful reading is the strength.
[profiles.opushi]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"
thinking_display = "summarized"
max_loops = 40

# Sonnet 5.5 at high effort: the last profile of sophisticated and review (theseus-tqomi), and
# deep_coding's first reviewer when its China-origin draft is turned on (see the routing classes below).
[profiles.sonnethi]
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "high"
thinking_display = "summarized"

# In no class list: GLM-5.3 costs more per coding task than Sonnet 5.5 ($0.34-0.47 against $0.30 a trial).
[profiles.glm53]
provider = "zai"
model = "glm-5.3"
max_loops = 40

# DeepSeek, a China-origin model: it drafts routine code, and a Claude profile always
# reviews and fixes the draft. Add its key first (the commented deepseek_api_key under
# the secrets table), then un-comment this block and the deepseek provider. It thinks
# without being asked and takes three effort levels: low, high and max.
# [profiles.dsflash]                    # drafts routine code; a Claude profile always reviews it
# provider = "deepseek"
# model = "deepseek-flash"              # a floating alias: DeepSeek-V4.1-Flash-1017 since 2026-10-17
# effort = "high"
#
# [profiles.dsflashmax]                 # a draft at max effort, for deep_coding's draft when the operator turns it on
# provider = "deepseek"
# model = "deepseek-flash"
# effort = "max"
#
# [profiles.dspro]                      # catalogued; in no class list
# provider = "deepseek"
# model = "deepseek-v4-pro"
# effort = "high"

# Kimi (Moonshot AI), a China-origin model like the two above: it gets only open work, and a
# Claude profile reviews what it drafts. Add its key first (the commented moonshot_api_key under
# the secrets table), then un-comment these and the moonshot provider. It always thinks and takes
# three effort levels: low, high and max. It is in no class list and no route pack: a draft
# share waits on a measured comparison against the models above.
# [profiles.kimi]
# provider = "moonshot"
# model = "kimi-k3.1-pro"               # 1M context; the faster kimi-k3.1-pro-highspeed costs double
# effort = "high"
#
# [profiles.kimimax]
# provider = "moonshot"
# model = "kimi-k3.1-pro"
# effort = "max"

# Claude Haiku 5.5: $0.10 in and $0.50 out per million tokens up to a 100,000-token
# prompt, 5x above it (`theseus catalog` lists both). At its default effort it thinks
# before a short answer (text began 3 to 4.5 s in, the lane's probe of 2026-10-07); at
# "low" it began in 0.4 s and streamed about 165 tokens a second, faster than Sonnet 5.5.
[profiles.haiku]
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"
cache_ttl = "1h"
max_loops = 40

[profiles.haikuhi]
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "high"
thinking_display = "summarized"
cache_ttl = "1h"
max_loops = 40

# ---------------------------------------------------------------- the prompt cache
# A long conversation's prompt is mostly its cached prefix. On a 1-hour profile, after a
# conversation a person talks in (the CLI, the TUI, the web UI, the owner's DM; never a
# task, a job, the judge or Jev) goes quiet, the daemon reads its prefix once every
# keep_warm_every_minutes, with the smallest answer the provider allows and nothing stored but
# its keep_warm ledger row, so the next message reads the cache (0.025x of input on Fable
# 5.1) instead of writing it again (2x). Each read is a model call under the spend limit
# and the daily ceiling; a refused or failed one stops that session's reads until its
# next message. A prefix under keep_warm_min_tokens is not kept warm. A profile may override
# ttl and keep_warm_hours with cache_ttl and keep_warm_hours of its own ([profiles.<name>]);
# one that says none takes these.
[cache]
# ttl = "1h"                            # how long the provider keeps cached prefixes: 5m (the default) | 1h; a 1-hour entry costs 2x input to write instead of 1.25x
# A conversation whose profile caches for 1h is kept warm this many hours after its last message
# (a new message starts the window again); 0 turns it off.
keep_warm_hours = 24
keep_warm_every_minutes = 55            # under the 1-hour cache's life by a margin; 0 < it < 60
threads_keep_warm_hours = 4             # a thread's own window: an active thread whose owner wrote within this is read at the same interval; 0: no thread is kept warm; the profile's own keep_warm_hours still bounds it
keep_warm_min_tokens = 20000            # the smallest prefix kept warm, estimated
# When a request will write the cache anyway (the session's last call is older than its
# TTL, and no keep-warm kept it), an attachment's text over stub_min_tokens from before
# the last stub_after_turns turns is sent as a one-line stub: its name, its size, and
# file.read to read it again. The stored history is unchanged; 0 turns it off.
stub_min_tokens = 20000
stub_after_turns = 3

# ---------------------------------------------------------------- context files
# Files (~/ or absolute paths) compiled into every session's system block, after the
# built-in persona, the assembly note (how a request is built), the precedence line (which
# sources to trust first), the tools note, and the profile's system, each under a header
# that names it and its level. Two levels: the system level, which every session gets,
# then the files of the persona in play. A turn stats each file and rereads it only when
# it changed, and an edit recompiles the next turn once. No tool reads them, so nothing
# waits for approval. A missing file is noted in the block and warned once per daemon run;
# a file over 64 KB is cut.
[context]
files = []                              # the system level, e.g. ["~/.openclaw/workspace/USER.md"]
# The most tokens one persona's soul file may be (200 to 8000; estimated at 3 bytes a token).
# A soul over it is refused when it is written, never cut; a hand edit or a migrated file over
# it is carried whole and flagged in `theseus census`, health and a note (it sits in every
# DM's cached persona layer).
# persona_max_tokens = 2000
# The persona in play: a key of [personas], read once like them (the ontology's default persona is
# `theseus persona default KEY` now; Jev's `none` engages it).
# default_persona = "theseus"
# The working window: the most tokens a request may take, below the model's own window.
# Omitted: the model's full window from the catalog. Past half of it, a long turn's old
# tool results become stubs; past it, the turn compacts its earlier loops.
# working_window_tokens = 200000
# Each session's render, kept across turns so a turn renders only what was written since:
# at most this many MiB across the sessions, the least recently used going first; 0 keeps
# none, and every turn renders its session whole.
# kept_mb = 64

# Personas are the ontology's now (theseus-utfnl): a `persona:<key>` category each, its soul
# one small file. `theseus persona add KEY` makes one (and asks you for its soul), `persona soul
# KEY` writes the soul, `persona set KEY --emoji ..` sets its short fields, `persona default KEY`
# marks the one Jev's `none` engages, `persona retire KEY` takes one away; the cockpit's
# /ontology does the same. A [personas.<name>] table and [context] default_persona in an older
# config are read once, at the first start that has them, and ignored after: delete them.
# Nothing binds a persona to a place but the bindings file's `persona = "<name>"`.

# Legacy form, read once (theseus-utfnl). A [personas.<name>] table below is read by the first start
# of this version that has one: each becomes a persona of the ontology (its first file the soul, the
# others not carried), and the tables are ignored from then on. The keys are what they always were.
# A persona's soul file (a table entry with readers = "public" lets a shared place carry it).
# The persona is data (theseus-slvl.2). Every key but the files is optional. With no persona
# configured, or none whose file reads, the header carries the built-in default
# (crates/theseus-core/persona/default.md: who Theseus is, a line of voice per surface, and
# values with candour first); a persona file of your own replaces it whole, never merged.
# A bindings place may say persona = "<name>" to speak as one there; a session may choose one
# when it opens (session.open); a task takes its parent's. Order: session, place,
# default_persona, the built-in. A persona file that replaces the default should keep its
# one line about follow-ups: a promise to act later is scheduled in the same turn (wake.at,
# a task or a watch). A reply that promises one with nothing scheduled is a promise.unkept
# row, and `theseus persona` shows the week's promises kept (theseus-slvl.9).
# [personas.theseus]
# files = ["~/.openclaw/workspace/contexts/theseus-persona-draft.md", { path = "~/projects/some-public-repo/README.md", readers = "public" }]
# name = "Theseus"                      # shown on replies, the bot's nickname, the voice greeting; omitted: the key, capitalised
# emoji = "⚓"
# card = "Careful systems engineer; prefers a plain answer to a clever one."   # about 60 tokens of specialization and background
# tts_voice = "aura-2-thalia-en"        # overrides [voice] tts_voice while this persona is in play
# avatar = "~/avatars/theseus.png"      # a path or URL, for Discord
# shareable = false                     # true: a shared place may be answered by this persona too (only its own, by default)
# initiative = "normal"                 # quiet | normal | chatty: how readily it speaks first. quiet pings only what needs you and what you asked for; normal adds finished work, promised follow-ups and one morning note; chatty adds observations (see [initiative])

# ---------------------------------------------------------------- providers
# Any endpoint that speaks the Anthropic Messages API. The implicit "anthropic"
# provider comes from [model] unless a [providers.anthropic] entry overrides it.
[providers.zai]
api_base = "https://api.z.ai/api/anthropic"
api_key_secret = "zai_api_key"
kind = "anthropic_messages"             # the only wire protocol today
# [providers.zai.timeouts]              # per-provider override of [model.timeouts]
# connect_secs = 10
# first_byte_secs = 60
# stream_idle_secs = 60
# total_secs = 600                      # a call before its stream begins; a live stream may run to 3x this

# DeepSeek's Anthropic-compatible endpoint. Add its key to the secrets table before un-commenting.
# [providers.deepseek]
# api_base = "https://api.deepseek.com/anthropic"
# api_key_secret = "deepseek_api_key"
# kind = "anthropic_messages"
# origin = "cn"                         # a China-origin host is "cn" whatever is written here; for an unknown host, the operator's word

# Moonshot AI's Kimi, on its Anthropic-compatible endpoint. Add its key to the secrets table before un-commenting.
# [providers.moonshot]
# api_base = "https://api.moonshot.ai/anthropic"
# api_key_secret = "moonshot_api_key"
# kind = "anthropic_messages"
# origin = "cn"                         # a China-origin host is "cn" whatever is written here; for an unknown host, the operator's word

# ---------------------------------------------------------------- secrets
# name → where its value comes from. The vault is the recommended source.
# Each placeholder below names what to put there: make one item per secret in
# a vault your service account can read (a Secure Note or a password item),
# and write its reference as op://<vault>/<item>/<field>, the field being
# notesPlain for a note's text. A reference may end in #label to take one
# `label: value` line of a note (the AWS key pair below shares one note). An
# item whose title another shares is named by its id instead
# (`op item list --vault <vault>` shows ids). Remove a line you don't use,
# and the key that names it (the Discord bot token, web.search's key).
#
# Outside the vault, where there is none (a container, CI, a machine without
# 1Password), an entry may instead be
#   env:NAME    the daemon's own environment variable NAME, or
#   file:PATH   a file only its owner can read (mode 600, the token file's
#               rule), at an absolute path or one under ~ or a $VARIABLE.
# Either is read at once, trimmed, with no `op` call. Prefer the vault: such
# a value lives in a process's environment or on disk, where the vault keeps
# it in one place you can rotate. `theseusd check` and `theseus health` name
# every secret from outside the vault, with its source. With a config file
# and no vault access, the daemon starts anyway, and each op:// entry fails
# with the reason.
[secrets]
anthropic_api_key = "op://<your vault>/<Anthropic API key item>/notesPlain"
zai_api_key = "op://<your vault>/<Z.ai API key item>/notesPlain"
# deepseek_api_key = "op://<your vault>/<DeepSeek API key item>/notesPlain"   # the deepseek provider's key: add the item first
# moonshot_api_key = "op://<your vault>/<Moonshot API key item>/notesPlain"   # the moonshot provider's key: add the item first
jev_api_key = "op://<your vault>/<Jev API key item>/notesPlain"
github_token = "op://<your vault>/<GitHub token item>/notesPlain"
aws_access_key_id = "op://<your vault>/<AWS key item>/notesPlain#AWS_ACCESS_KEY_ID"
aws_secret_access_key = "op://<your vault>/<AWS key item>/notesPlain#AWS_SECRET_ACCESS_KEY"
discord_bot_token = "op://<your vault>/<Discord bot item>/notesPlain"
brave_api_key = "op://<your vault>/<Brave Search API key item>/notesPlain"   # web.search's key
# deepgram_api_key = "op://<your vault>/<Deepgram API key item>/notesPlain"   # voice's key ([voice])
# google_client = "op://<your vault>/<Google client item>/notesPlain"   # [google]'s client: two lines, `client_id: …` and `client_secret: …` (or the console's JSON)
# google_refresh_token = "op://<your vault>/<Google token item>/refresh_token"   # minted by `theseus google auth`; or "file:~/.config/theseus/google-refresh-token"
# ci_runner_key = "env:CI_RUNNER_KEY"                 # from outside the vault: the environment
# ci_deploy_key = "file:~/.config/theseus/deploy-key"  # from outside the vault: a mode-600 file
# docs_mcp_token = "op://<your vault>/<docs MCP key item>/notesPlain"   # an MCP server's key ([mcp.servers])
# mcp_server_key = "op://<your vault>/<MCP server key item>/password"   # the MCP server's key ([mcp_server])

# ---------------------------------------------------------------- broker
# What a job can get, plainly: only a secret a program's grant in this
# section names, at its start, nothing else, at L0 and in L1, the sandbox,
# alike. The AWS keys and the providers' keys are never given to a job: only
# Theseus's own tools and model calls read them, unless you name one here,
# which `theseusd check` and health then say aloud (they name the
# harness-only keys). A job in L1 sends what it holds only to the hosts in
# the sandbox section's egress list.
# The secret broker (theseus-dcy): a program a job runs gets a [secrets] value
# in an environment variable, from the values resolved at startup, so it needs
# no `op` call and no approval for one. Empty until you add a grant, and a
# secret with no grant is never handed out.
# A grant applies only when a job runs the program by its own argv (gh itself
# as argv[0], found as exec finds it on the daemon's PATH), never through
# `sh -c "gh ..."`: a shell would hand the variable to every program it runs,
# and the tool result says so.
# Nor does a program the call could make run another: a call that sets its own
# environment gets no grant; gh gets it only for its own commands (api, pr,
# repo, ...), never an alias, an extension, or --web's browser; git only for
# clone, fetch, ls-remote, pull, push, and remote, never an alias, -c, or a
# program an option or a URL names; cargo only for login, logout, owner,
# search, yank, and publish --no-verify, which build nothing; and npm only for
# its registry commands (publish --ignore-scripts, view, whoami, owner, ...),
# which run no package's scripts.
# A grant to a launcher fails to load: a shell, an interpreter, a program that
# runs the command it is given (env, sudo, xargs, timeout, ...), or a runner of
# a project's scripts (make, just, npx, pip, ...) would hand the variable to
# whatever the call names. That list can't be finished (find -exec, an
# editor), so grant only to a program whose commands run nothing you didn't
# choose. A granted git, and the git a granted gh runs, runs no hooks and no
# fsmonitor program (both pinned off over every config file; git 2.31 or
# later), so your own hooks don't run for them either. What else a granted
# program runs on its own account (a credential helper or core.sshCommand its
# config names, ssh's own config) still gets the variable, so the secret's
# posture is your control.
# web.search is granted its key ([tools.web] search_key_secret) the same way,
# so each search runs at no looser a posture than that secret's.
# [broker.programs.gh]
# env = { GH_TOKEN = "github_token" }   # variable = [secrets] name, never a value
# A program that calls AWS gets a short-lived job session for an account at
# its start, never the key (AWS design §3.5): AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, and AWS_REGION, with no ~/.aws
# profile read. The session carries the guards, so AWS itself refuses what the
# floor would ask about, and any write to a stack. Before the account's
# owner_role is named, the program gets nothing, and the result says why.
# In L1 it gets the same session at its start, and that is the only AWS
# credential the job holds: ~/.aws is in no L1 view, and the metadata service
# is out of its reach. It reaches AWS only through its egress list, as an L1
# job reaches any host: list the endpoints its commands use under the sandbox
# section's egress ("sts.us-west-2.amazonaws.com:443", or "*.amazonaws.com:443"
# for all of AWS), or let a call name its own, which then waits for you.
# [broker.programs.aws]
# aws_account = "111122223333"          # an [aws.accounts] id
# A secret's posture, notify by default: a call given the secret runs at no
# looser a posture, so "approve" makes each call that gets it wait for you
# before its job starts, in L1 too (an L1 call otherwise runs at notify).
# [broker.secrets.github_token]
# posture = "notify"

# ---------------------------------------------------------------- server
[server]
state_dir = "~/.theseus"                # store (redb) and spool; flag: --state-dir / THESEUS_STATE_DIR
drafts_dir = "~/.cache/theseus/drafts"  # a draft review's git worktrees; outside state_dir and the approve list, so the review's test runs ask nothing
socket = "~/.theseus/theseus.sock"      # protocol socket, mode 0600; flag: --socket / THESEUS_SOCKET
store_engine = "redb"                   # index engine behind the WAL; redb is the only one
stop_grace_ms = 50                      # a clean stop waits up to this long, from its start, for posts already sent to settle
# Free space on the filesystem that holds state_dir (theseus-102). Health
# shows it, and says "low" below disk_warn_mb; below disk_floor_mb a job is
# refused, with its reason, so the store keeps room to write. Health sees only
# the filesystem Linux reports: under WSL that is the virtual disk, a file on
# the Windows drive (C:), which can fill first, so check C: itself there.
disk_warn_mb = 5120                     # health says the disk is low below this many MB free (0: never)
disk_floor_mb = 1024                    # a job is refused below this many MB free (0: never)
# Socket connections (theseus-7vtp). The daemon raises its soft open-files limit toward the
# hard one at start (at most 65536, which its jobs inherit); past max_connections a new
# connection is told why in one protocol error and closed, so the store, jobs and terminals
# always have descriptors left.
# 0 derives it from the limit in effect: the limit less 256 (half of it under 512), at most 8192.
max_connections = 0

# ---------------------------------------------------------------- kernel
# The durable kernel (M2): one execution per session, actions with correlation
# ids, completions through the spool at <state_dir>/spool, and a spend limit in
# dollars per session, priced from the catalog. What reaching the limit does is
# spend_limit_mode (theseus-usei; the owner's decision, 2026-10-07: for tasks
# and tokens, notify, not restrict; AWS budgets still restrict). "notify": the
# session's place hears one notice at the limit, and one at each multiple of it
# (2x, 3x, ...), saying the spend so far and how to stop the work, and its
# model calls go on; a call's reservation is still priced and recorded, never
# refused for the limit. "ask": at the limit the session waits and asks you
# (Discord, web UI, or `theseus answer`) whether to reset its spend to $0 and
# go on. A limit a place's ceiling or an MCP client names still asks, and so
# does an AWS hands group. The session's lifetime cost keeps counting either way.
# spend_limit_hard_multiple bounds a limit that notifies (theseus-jse4): at that
# many times the limit a session's model call is not made (its reservation would
# pass it) and the turn ends, saying why; a higher spend_limit_usd or multiple
# lets it go on from the next start. 0 never stops.
# daily_spend_ceiling_usd is a backstop, not a budget (theseus-kp20): every
# model call the daemon makes in a local day (turns, tasks, the judge,
# consolidation, compaction, learning runs, speech) counts toward it, and it
# sits above every limit here. Its mode (theseus-9e02) says what reaching it
# does: "notify", the default, warns and refuses nothing (the owner's DM, the
# push, health's first line, and the cockpit's Money view say what was spent,
# that the work goes on, and where it stops), at the ceiling and again at each
# daily_notice_step_usd after it, once each a day; the day stops only at
# daily_runaway_usd ($2,000 by default; 0 never), and a stop then holds every
# later call until local midnight. "stop" refuses every call past the
# ceiling until local midnight. runaway_usd_per_10min is a burn-rate brake
# on each session: one whose settled spend in the last ten minutes reaches it
# pauses and asks you to resume (Discord, web UI, or `theseus answer`); 0
# never. AWS spend is managed apart and still stops at its lines.
[kernel]
admission_ceiling = 8                   # executions that may hold a turn at once (§3.2a)
admission_stuck_secs = 600              # a waiting turn fails only when no turn was admitted for this long: a queue that moves fails none
spend_limit_usd = 100.0                 # each session's spend limit in US dollars (theseus-0sg)
spend_limit_mode = "notify"             # notify | ask: what reaching it does
spend_limit_hard_multiple = 10          # under notify, calls stop at this many times the limit (0: never)
daily_spend_ceiling_usd = 200.0         # the whole daemon's model spend per local day: past it, a warning (notify) or no call until midnight (stop)
daily_spend_ceiling_mode = "notify"     # notify | stop: what reaching it does
daily_runaway_usd = 2000.0              # under notify, the day's model calls stop here until midnight (0: never)
daily_notice_step_usd = 200.0           # under notify, one warning at the ceiling and one each this much after it (0: at the ceiling alone)
runaway_usd_per_10min = 200.0           # a session whose settled spend in ten minutes reaches this pauses and asks you to resume (0: never)
heartbeat_secs = 60                     # reconciler cadence: due wakes, overdue actions, spool drain
default_deadline_secs = 600             # deadline for an action whose tool declares none
confirm_ttl_secs = 900                  # how long a call waits for your answer before you are told, quietly, and again each further span: it stays pending, never cancelled
min_repeat_minutes = 5                  # the shortest span a repeating wake (wake.at with `every`) may take; at least 1
task_lease_minutes = 30                 # a task claim's lease (task.claim): the holder's edits renew it, and past it the task is free; at least 1
max_wake_ahead_days = 365               # the furthest ahead a wake, a reminder or a deferred task may be set; at least 1
max_wakes = 20                          # check-ins (wake.at) one conversation may hold at once; at least 1
max_reminders = 100                     # reminders the whole daemon may hold at once, in every conversation; at least 1
max_watches = 20                        # watches the daemon may hold (see [watch_for])
steer_queued = true                     # a message sent while a turn runs interrupts its waits (job_wait, a command, a terminal) and joins the turn at its next loop; false: it waits for the turn to end
task_depth = 10                         # levels of tasks below a conversation: a task may start tasks down to this depth (1 to 32); each child's brief names the root goal and its chain, and a brief that repeats an ancestor's is refused as a cycle

# ---------------------------------------------------------------- tools
# Toollets (fs.*, text.diff, git.diff/log, proc.run). The workspace is
# projects_dir plus any more roots, and a path is judged after `..` and
# symlinks resolve. There is no built-in workspace: without projects_dir (or
# roots) every path is outside it. A read or a program run outside the
# workspace, or any path on approve_paths (even inside it), waits for your
# approval. A write outside it takes the tool's posture, whichever tool makes
# it (fs.write, or a script through proc.run, which the gate can't read), so
# approve_paths, the floor, and the posture guard writes, not the workspace.
[tools]
enabled = true
projects_dir = "/home/zeroaltitude/projects"   # the operator's projects directory: the workspace, and where relative paths resolve
# roots = ["/home/zeroaltitude/reports"]   # more workspace roots beside projects_dir (default none)
# cwd = "/home/zeroaltitude/projects/theseus"   # where relative paths resolve and programs run (default: projects_dir)
approve_paths = ["~/.ssh", "~/.gnupg", "~/.aws", "~/.config/op", "~/.openclaw-1password-service-token", "~/.theseus"]
result_max_chars = 30000                # characters of a result the model sees (head and tail kept; fs_read has its own 100,000, a contiguous head)
max_read_bytes = 262144                 # cap on one fs.read
max_attachment_bytes = 33554432         # the largest attached file kept whole (a PDF is read for the model; 32 MiB)
transcribe_max_minutes = 60             # the most of one recording file_read hears (Deepgram, about $0.26 an hour)
max_entries = 500                       # cap on fs.list / fs.glob / fs.grep entries
proc_sync_secs = 60                     # a turn waits this long for proc.run, then it continues in the background
job_wait_max_secs = 1800                # the longest one job_wait waits (at least proc_sync_secs, at most 3600); it still returns at once when the job ends or a message arrives
job_wait_beat_secs = 600               # a job_wait on a job that has printed nothing for this long returns with what it saw (0 is off; at most 3600; one past job_wait_max_secs never fires); a job that prints keeps its wait
job_wait_status = true                  # at each beat, one status line to the session's place (no model call)
fan_out_wait_secs = 900                 # what task_wait waits when the call names no time; it returns at once when its tasks have ended, a message arrives, or the turn is stopped
fan_out_max_wait_secs = 1800            # the longest one task_wait waits, however long the model asks
helper_floor_usd = 1.00                 # the least a task_fan_out helper's share may be, in dollars (never less than twice the worst case one of its calls reserves); a call asking for more helpers than the carve affords at this is refused
helper_max_output_tokens = 16000        # the most output one call of a task_fan_out helper may ask for
fan_in_chars = 36000                    # the most characters of task reports one task_wait writes into the turn (about 9K tokens); the room before the clearing line caps it lower
parallel_runs = 16                      # the most programs of one response that run at once, each its own job (the rest wait for a slot); one response's programs run together unless they share a terminal, an MCP server, a file name in their argvs, or an operand (a service, container, host, port, directory)
parallel_reads = 32                     # the most reads of one response that run at once (the rest wait for a slot, the results in order)
parallel_writes = 16                    # the most writes, to different paths, of one response that run at once
proc_timeout_secs = 3600                # default proc.run limit on silence, when a call names none: a job that has printed nothing this long is stopped, and one still printing is let run on (and told) until 24 times it
proc_timeout_max_secs = 3600            # ceiling a call may ask for (its silence limit; the run's own ceiling is 24 times it)
proc_env = ["PATH", "HOME", "USER", "LANG", "LC_ALL", "TERM", "TZ", "CARGO_HOME", "RUSTUP_HOME"]  # the ONLY variables a job sees
job_output_max_bytes = 67108864         # a job's raw output file keeps at most this much (64 MiB); past it the job runs on, and its result says how much was dropped
job_pids_max = 4096                     # the most processes and threads one L0 job may have at once, where the daemon's cgroup is delegated (its unit's Delegate=yes); past it a fork fails, and its result says so; 0: no cap
# A result the cap cuts (result_max_chars) keeps its whole output, scrubbed, in
# <state>/outputs/<session>/<call>.out, and its cut line names the file and
# the lines left out, which fs_read reads: a proc_run's (to its job file's
# job_output_max_bytes) and a term_read's. A copy goes when its session retires,
# or past either line below.
outputs_keep_days = 7                   # a kept output is deleted after this many days
outputs_max_bytes = 2147483648          # past this many bytes in all (2 GiB), the oldest kept outputs are deleted first

# The web tools (DD5): http.fetch GETs a URL, follows up to 5 redirects, and
# returns an HTML page as text (text, JSON, and XML as they are; other types
# are named with their size, not read); web.search asks the Brave Search API.
# A loopback or private address, or localhost, waits for your approval, and a
# public name that resolves to one is refused at connect. What they return is
# marked as external text.
[tools.web]
timeout_secs = 30                       # a fetch's or a search's whole time, redirects included (at most 110)
max_bytes = 2097152                     # the most of a body a fetch reads; a call may ask for fewer
search_key_secret = "brave_api_key"     # the [secrets] entry that holds the Brave Search API key; without a [secrets] entry of this name, web.search is not offered

# The terminals (term.open, term.send, term.read, term.close): a program on a
# pty the model drives with keys and reads as a screen. A close at a session's
# end or at the daemon's stop ends the terminal's program and its foreground
# process group; with keep_background, what it started in the background
# (`nohup app &`, a `setsid` child, a server that daemonizes) keeps running,
# as with proc.run, and health lists it. term.close, a cancel and /stop end
# everything a terminal started.
[tools.term]
keep_background = true                  # false: every close ends everything the terminal started

# Which tool families a request loads. Every model call reads the whole tool set, so a
# family a place does not need is declared deferred (Anthropic's API: the model finds
# it with its tool search) or left out with a `tools_find` tool to ask for it (any
# other model). The set per place kind starts from the built-in defaults and is learned
# from the ledger's use; it changes only where the conversation recompiles anyway, so
# the prompt cache holds. `theseus tools` lists what each place loads, with its misses.
[tools.defer]
enabled = true                          # false: every offered tool loads
always_loaded = ["files", "commands"]   # families that load in every place
load_share = 0.10                       # a family used in this share of a place kind's turns loads
window_days = 14                        # ... over this many days
hide_after_days = 14                    # a family loaded by default and unused this long hides
admit_ceiling = 2.0                     # a family named or judged relevant loads past the place's budget, to this multiple of it (1.0: the cap); an ordinary prompt's
admit_ceiling_small = 1.0               # ... a small prompt's (the route pack's trivial)
admit_ceiling_deep = 3.0                # ... a deep prompt's (sophisticated, deep_coding, review); the three alike: one ceiling for all
judge_families = true                   # Jev judges each hidden family against the prompt, once a prompt (false: named families only)
judge_wait_ms = 200                     # the most a turn waits for that judgment, from the message's arrival

# ---------------------------------------------------------------- aws
# The AWS accounts Theseus owns, each by its id, with its key (the root of
# trust) as two [secrets] entries. After serving, the key is checked once:
# sts:GetCallerIdentity must name the account. Until that passes, no call of
# the account signs, and health says why. Then aws.call makes any operation of
# any service: a read, a write, or a run, by its posture in [policy.aws]. A
# guardrail (public ingress, the audit trail, the budget, long-lived
# credentials) asks at the floor, deleting a stateful resource or a stack asks,
# and durable infrastructure is made only through stacks: aws.stack.plan,
# .apply, .status, and .delete. aws.describe looks AWS's API up in the local
# catalog, aws.whoami asks AWS who Theseus is, aws.s3.list lists buckets and
# prefixes, aws.s3.get and .put read and write objects, aws.logs.query and
# .tail read CloudWatch Logs, aws.trail reads CloudTrail's event history,
# aws.inventory lists what Theseus made (tagged theseus:owner = theseus) and
# what the reaper would reap (it only reports), and
# aws.cost reads the month's spend. A call that returns a secret
# holds it for Theseus under a handle (aws-secret:…), never in the context. `theseus aws bootstrap` makes the account's
# foundation and posture stacks; then name its owner role here, and every call
# signs in a role session named by its execution. With no table, no AWS tool
# exists, and nothing AWS runs.
# [aws.accounts.111122223333]           # the account's id (12 digits), which STS must name
# credentials = { access_key_id = "aws_access_key_id", secret_access_key = "aws_secret_access_key" }   # its key's [secrets] entries (these, by default)
# region = "us-west-2"                  # where a call goes unless it names a region
# regions = ["us-west-2", "us-east-1"]  # the regions a call may name (default: region alone)
# owner_role = "theseus-owner"          # after `theseus aws bootstrap`: calls sign in role sessions under the guards, and the key signs only STS
# deployment = "theseus-desktop"        # every session's source identity: which Theseus this is (default "theseus")
# monthly_budget_usd = 50               # the month's budget: the bootstrap's, and reconciled into its stack after serving
# monthly_warn_usd = 25                 # Theseus warns once a month when AWS's actual spend passes this (default half of monthly_budget_usd); it warns only, and the month's stop stays where it is
# daily_budget_usd = 10                 # the day's budget, which only alerts: reconciled into the foundation stack's DailyBudgetUsd as the month's is
# hourly_alert_usd = 1.0                # the hour's line: past what AWS actions reserved and spent this hour, Theseus alerts once that hour (default 1.0)
# runaway_factor = 10.0                 # "let the budget notify be the authority unless 'runaway train' mode is triggered, which is,
#                                       #  observationally, spend is 10x over the limit": at this many times the hour's or the day's
#                                       #  line, new AWS actions that reserve are refused until the hour or day turns (default 10, at least 2)
# durability = true                    # ship the store off the machine (default false; needs owner_role): WAL segments and blobs to the foundation's bucket, index rows to its table, under durability/<deployment>/
# endpoint = "http://127.0.0.1:4566"    # tests and scratch daemons only: a stand-in for AWS on this machine
# [aws.accounts.111122223333.hands_network]   # an existing VPC for Fargate hands (default none: the hands network stack makes its own VPC)
# vpc = "vpc-0123456789abcdef0"         # Theseus uses it and never changes it; its subnets route out through its own NAT
# subnets = ["subnet-0123456789abcdef0", "subnet-0fedcba9876543210"]   # the private subnets the hands run in
# security_group = "sg-0123456789abcdef0"   # optional: a group there for the hands (default: the stack makes one, with no ingress)

# ---------------------------------------------------------------- google
# Google Workspace as a native capability, on the terms of AWS: Theseus holds
# the credential and makes every call itself, and no token reaches the model.
# `theseus google auth` is the one-time consent, from your own shell: it opens
# Google's sign-in (a loopback page, or a pasted address if the page cannot be
# reached), checks that the account is the one named here, and stores the
# refresh token in the [secrets] entry named below (an op:// item or a mode-600
# file; never an env: entry). The access token lives in memory only. Every
# Google result raises a `confidential` label on its session (a result of a
# sensitive calendar raises `personal`) at the moment it is written, with no
# model call: the label is the one in `[content_based_security]` below, shown to
# you with its Remove button, and it keeps a model of restricted origin off the
# session until you remove it. Mail, shared files and invited events are also
# marked as outside text, which holds nothing. Every send, delete, share,
# permission change and invitation asks you, at every posture. With no
# account, no Google tool exists, and nothing Google runs. `theseus google
# status` shows the scopes granted and the tools on; `theseus google revoke`
# ends it.
# [google]
# account = "owner@example.test"        # the address the consent is for; a token for any other is refused
# services = ["gmail", "drive", "sheets", "slides", "docs", "calendar"]   # the tools on, and the scopes the consent asks for (all six by default)
# max_sends_per_day = 25                # sends per local day, a runaway brake (0: no sends)
# trusted_senders = ["dana@example.test"]   # whose mail may start a task through a mail watch (then: task), only when Gmail authenticated the sender (DMARC pass, or DKIM aligned with the From); else the watch only notices; empty: a mail watch only notices
# credentials = { client = "google_client", refresh_token = "google_refresh_token" }   # [secrets] names (these, by default)
# endpoint = "http://127.0.0.1:7499"    # tests and scratch daemons only: a stand-in for Google on this machine
# calendars = ["primary", { id = "team.cal@example.test", label = "Team", color = "#5fa08d", sensitive = true }]   # the calendars read (default: every calendar the account's list holds, read again with the list; set, it narrows); colour: Google's own, else a palette; sensitive: a read of it raises `personal` instead of `confidential`, and its events never reach a shared place or the ledger
# sensitive_domains = ["corp.example.test"]   # the domains whose calendars (by id or owner) are sensitive with no config (default: every Google Workspace domain, that is any but the consumer ones and Google's own calendar ids)

# ---------------------------------------------------------------- policy
# The gate (spec §3.9) decides per tool, from the finite list of tools (and,
# when MCP lands, of MCP servers); it never guesses what a command does. Every
# tool and every MCP inherits one posture, `enforcement`; the exceptions are
# named under [policy.tools] and [policy.mcp]:
#   open      run
#   notify    run, and post a notice (Discord, web UI, CLI, and a `tool.notified` ledger row)
#   approve   wait for your Approve (Discord, web UI, or `theseus answer`)
# approve is the strongest: nothing is turned away without asking you.
# Before any posture, in this order:
#   1. the floor always waits for your approval, at every posture, even open,
#      and says so: Theseus's own binary, store, spool, and bindings file; the
#      1Password CLI, its credentials, and the token file this daemon was given;
#   2. your approve lists wait for your approval: approve_argv,
#      [tools].approve_paths, and a read or a working directory outside the
#      workspace roots (a write there takes the tool's posture);
#   3. your allow list runs: allow_argv. An entry is a prefix: ["ls"] also runs
#      `ls -la src`, so keep entries narrow.
[policy]
enforcement = "notify"                  # open | notify | approve: what every tool and MCP inherits (built-in default: open)
allow_argv = [["ls"], ["pwd"]]          # proc.run runs these (open) when every path argument is inside the roots (no git: its config can run programs; use git.diff / git.log)
approve_argv = [["sudo"], ["su"], ["doas"], ["rm", "-rf", "/"], ["mkfs"], ["dd"], ["shutdown"], ["reboot"]]  # proc.run waits for your approval on these (op and theseusd are on the floor)
# A program that hosts an agent. `theseus answer` from a process under one, or
# from a process with no controlling terminal, is recorded and shown as that
# agent's answer ("answered by an agent (claude)"), never as yours, and an
# agent never answers a question that spends money or changes AWS: those wait
# for your own terminal or your Discord press. Add the agents you run. A light
# guard, not a boundary: an agent can hide its ancestry behind a pty.
agent_processes = ["claude", "codex", "gemini", "aider", "opencode", "openclaw"]   # program names, matched by file name
# A URL whose host is this machine or a private address (localhost, 10.x, a
# link-local address) waits for your approval, which alone lets http.fetch
# reach it. "open" judges it as any other address, redirects and DNS answers
# included: only for a run with no one to approve, such as the bench profile.
# private_addresses = "ask"             # ask | open

# Per-tool postures, one line for every tool (keep it that way as tools are
# added). A set line overrides enforcement; a commented one inherits it.
[policy.tools]
# read-only tools: safe to leave open, so reads never prompt or notify
"fs.read"   = "open"
"fs.glob"   = "open"
"fs.grep"   = "open"
"fs.list"   = "open"
"git.diff"  = "open"
"git.log"   = "open"
"text.diff" = "open"
"memory.lookup" = "open"  # the owner's memory, in a private place only (never offered in a shared one)
# writers: inherit enforcement; raise or lower per taste
# "fs.edit"  = "notify"
# "fs.write" = "notify"
# "fs.patch" = "notify"
# the universal shell: the one worth pinning stricter than enforcement
# "proc.run" = "approve"
# the web: inherit enforcement, so each fetch or search is a notice with its
# URL (a GET's URL can carry data out); web.search also takes its key's posture
# "http.fetch" = "notify"
# "web.search" = "notify"
# a background task (DD7): inherits enforcement, so each start is a notice; the
# task's own calls are gated as usual, and it spends from this session's limit
# "task.create" = "notify"
# the task graph (39a): edits of its plan inherit enforcement; a change to a
# task's objective or acceptance, or abandoning one, always waits for your yes
# "task.update" = "notify"
# "task.split" = "notify"
# "task.close" = "notify"
# "task.claim" = "notify"
# waiting in this turn for the tasks you started (theseus-z9mze.2): a read of their reports, which the next turn would read
# "task.wait" = "notify"
# helpers that each read one area and report in this turn (theseus-z9mze.3): inherits enforcement, so each start is a notice
# "task.fan_out" = "notify"
# a wake into this conversation later (DD8): inherits enforcement, so each one
# set is a notice with its time; its turn spends from this session's limit
# "wake.at" = "notify"
# the model changing a wake it set (its own, from a private place): move it, or cancel it
# "wake.move" = "notify"
# "watch" = "notify"            # a watch that runs a command asks first, whatever this says
# "wake.cancel" = "notify"
# recurring work (routines): setting one up always waits for your yes on a card, at every posture
# "routine.create" = "approve"
# long-term work (projects): attaching a conversation to a project
# "project.attach" = "notify"
# gliding (38b): a post into another bound place, and a read of one's recent
# conversation. Both inherit enforcement; the place rule decides the rest:
# into a private place a glide keeps its posture, and what a read brings from
# a shared place is outside text; out of a private place, or between two
# shared places, it waits for your approval, as /publish does
# "channel.post" = "notify"
# "channel.read" = "notify"
# terminals (a program on a pty: a REPL, an editor, a pager): term.open is
# judged as proc.run is, by its program and arguments, and term.send as a run
# of its terminal's program, so the floor and the approve and allow lists
# apply to both. term.read and term.close are reads.
# "term.open" = "notify"
# "term.send" = "notify"
"term.read" = "open"
"term.close" = "open"
# a job proc_run left in the background (theseus-n8gk): job.read shows its
# latest output and job.wait its end, reads of this session's own job;
# job.stop is judged as a run of the job's own program, as term.send is
"job.read" = "open"
"job.wait" = "open"
# "job.stop" = "notify"
# a proposed extension (M7 43a): its directory frozen, started in L1, and tested;
# nothing loads until you ack its card. Inherits enforcement, so each proposal is
# a notice
# "extend.propose" = "notify"
# a self branch (theseus-pw1q.8), only while [self] mode = "act" and only in a self
# session: Theseus's own source changed in a tree of its own, gated, reported and
# pushed to self/*. Inherits enforcement, so each call is a notice
# "self.propose_change" = "notify"
# AWS, when an [aws.accounts] table binds an account: aws.describe reads the
# local catalog; the others call AWS, and [policy.aws] gives each call its
# posture unless a line here sets the tool's
"aws.describe" = "open"
# "aws.call" = "approve"
# "aws.whoami" = "approve"
# "aws.s3.list" = "approve"
# "aws.stack.plan" = "approve"
# "aws.stack.apply" = "approve"
# "aws.stack.status" = "approve"
# "aws.stack.delete" = "approve"
# "aws.cost" = "approve"
# "aws.s3.get" = "approve"
# "aws.s3.put" = "approve"
# "aws.logs.query" = "approve"
# "aws.logs.tail" = "approve"
# "aws.trail" = "approve"
# "aws.inventory" = "approve"
# "aws.hands.run" = "approve"            # a group of hands in AWS (unset: [policy.aws] run)
# Google Workspace, when [google] names an account. Every tool is deferred. A
# read inherits enforcement, and a call that sends, deletes, shares, changes a
# permission or invites asks at every posture, whatever a line here says.
# google.call makes any method of the granted services, classified by its verb
# and path
# "google.call" = "notify"
# gw-mail: the gmail.* lines
# "gmail.search" = "notify"      # reads take [policy] enforcement; "open" reads mail unasked
# "gmail.read" = "notify"        # saving attachments writes files, so that asks like a write
# "gmail.draft" = "notify"       # a draft reaches no one until it is sent
# "gmail.send" = "approve"       # sends an existing draft, and asks the owner every time whatever this line says
# "gmail.label" = "notify"       # trash asks whatever this line says
#
# gw-drive: the drive.* lines
# drive.find and drive.read inherit enforcement; drive.write keeps Drive's own
# revisions, so it notifies; drive.share (a permission change, a trash) asks at
# every posture, whatever a line here says
# "drive.find" = "notify"
# "drive.read" = "notify"
# "drive.write" = "notify"
# "drive.share" = "approve"
#
# gw-sheets-slides: the sheets.* and slides.* lines
# "sheets.read" = "notify"     # a read inherits enforcement unless a line says otherwise
# "sheets.write" = "notify"    # Drive keeps the revisions, so a write can be undone
# "slides.write" = "notify"
#
# gw-calendar: the calendar.* lines
# calendar.events reads, and takes enforcement's posture. calendar.put asks at every
# posture, whatever this says, when it invites attendees, cancels, or notifies the
# attendees of a change
# "calendar.events" = "notify"
# "calendar.put" = "notify"
# The language servers' tools, when [lsp] is on: the reads inherit enforcement
# (the first call for a project starts its server, judged as proc.run is);
# a rename's plan writes nothing, and its apply is a write of every file it names
# "lsp.definition" = "open"
# "lsp.references" = "open"
# "lsp.hover" = "open"
# "lsp.symbols" = "open"
# "lsp.diagnostics" = "open"
# "lsp.rename.plan" = "open"
# "lsp.rename" = "notify"

# Per-MCP postures, for when MCP servers land (M7): "server" covers every tool
# from that server, "server/tool" one tool. An MCP tool's posture comes from
# its [policy.tools] line, then "server/tool", then "server", then enforcement.
# [policy.mcp]
# "some-server" = "notify"              # every tool from this MCP server
# "some-server/read-only-tool" = "open"
# "some-server/dangerous-tool" = "approve"

# AWS calls, when an [aws.accounts] table binds an account: a call whose tool
# has no [policy.tools] line takes its operation's line here, then its
# service's, then its class's, then enforcement. A guardrail asks at the floor,
# and deleting a stateful resource or a stack asks, whatever these say.
[policy.aws]
read = "open"                           # a Describe, List, or Get: safe to leave open (unset: enforcement)
write = "notify"                        # a call that changes something: a notice each (unset: enforcement)
run = "notify"                          # a call that starts code: a task, a function, a command (unset: enforcement)
# "ec2" = "notify"                      # every call to one service
# "s3:ListBuckets" = "approve"          # one operation

# ---------------------------------------------------------------- catalog
# Every model's window, output cap, and prices are the code's: `theseus catalog`
# lists them, in US dollars per million tokens, and names what a config
# changes. Budgets count in dollars at these prices (theseus-0sg): a call
# reserves its output cap at the output price plus its input estimate at the
# input price, and settles at its real cost, with input, output, cache reads,
# and cache writes (5-minute and 1-hour TTLs) each at its own price.
# A [catalog."<model>"] table changes the code's figures on purpose: over a
# built-in model it replaces only the fields it names (output_per_mtok alone,
# say), and every priced ledger row then names the catalog version `+config:N`.
# Name only what you mean to change: a table that repeats the code's figures
# changes nothing today, but it would hold them past the code's next fix.
# A model the built-in table lacks needs every figure a call uses:
# [catalog."some-new-model"]
# provider = "anthropic"                # a key of [providers], or the implicit "anthropic"
# context_window = 200000
# max_output_tokens = 64000
# input_per_mtok = 3.0
# output_per_mtok = 15.0
# cache_read_per_mtok = 0.3
# cache_write_per_mtok = 3.75           # 5-minute TTL writes
# cache_write_1h_per_mtok = 6.0         # 1-hour TTL writes; omitted: 2x input
# caches = true                         # the provider reads repeated prefixes and reports
#                                       # it; false sends no cache breakpoints. Omitted: true
# thinking = "adaptive"                 # none | adaptive | always | budget
# effort = true
# refusal_fallbacks = false             # the provider's own fallback on a refusal (server-side)
# refusal_fallback_model = "claude-sonnet-5"  # else a refusal goes once to this model ([model.retries] refusal)
# cache_min_tokens = 1024               # a shorter prefix gets no breakpoint of its own
# vision = true
# source = "config"

# ---------------------------------------------------------------- discord
# The Discord binding (M3): one guild, direct messages and one text channel. It is
# a protocol client of the kernel like the web UI and the CLI, so every turn it
# starts, and every continuation after a restart, runs the same path. It connects
# only when the token secret resolves and the bindings file exists (print one with
# `theseusd example-bindings`); otherwise health says "unconfigured". Only the
# socket daemon binds; `--stdio` servers never do. A daemon answers messages and
# commands only in the places its bindings file names, so two daemons may share
# one bot token when their bindings name different places.
[discord]
enabled = true
token_secret = "discord_bot_token"      # name of the [secrets] entry holding the bot token
bindings_file = "bindings.toml"         # the guild, channel, and who may drive it; relative = in the state dir
edit_interval_ms = 1200                 # how often a streaming reply is edited (Discord rate-limits edits)
notice_embeds = false                   # an embed per notified call; off, its line in the tool message says 🔔 notified
silent = []                             # categories of message that post without a ping; today's pings by default,
                                        # and silence is per category, per place (a [[channel]] or [[dm]] in the
                                        # bindings file may give its own list). Any of "cards", "failures" (a
                                        # failed turn or task, disk below the floor), "answer" (the first part of
                                        # the reply to your message), "later_parts" (its later parts and footer, a
                                        # reply to anyone else), "woken" (a turn a wake or a task's report
                                        # started), "tool_lines" (and notice embeds), "reports" (a task's end, a
                                        # hands line), "notices" (a bind, budgets, Jev, glides), "ops" (a restart,
                                        # MCP, low disk). A closed card, the task board and a loop's thinking alone
                                        # never ping, and the two AWS spend-safety alerts (a runaway account, an
                                        # hour past its line) always ping: no category reaches them
ping_window_secs = 0                    # at most one ping per place in this many seconds (a place may set its own); 0 is off
live_board = true                       # the task board: one pinned message that follows your tasks, edited and never posted anew (so it never pings); false, or a bot that cannot send Components V2, keeps the plain-text board
task_channels = true                    # a private text channel for each task of 2+ plan steps, or started `expect = long`, or still working after the minutes below, in a category the bot makes (`⚙️ Theseus tasks`); you steer the task there. Needs exactly one `private = true` guild in the bindings file and the bot's Manage Channels and Manage Roles (the bot says so in your DM when it lacks them); without them tasks go on as threads and the Follow mirror
task_channel_after_minutes = 10         # a task still working this long after it began gets its channel
task_channel_cap = 25                   # at most this many task channels open at once; past it a task goes on as before
task_channel_keep_days = 14             # a finished task's channel moves to `⚙️ Theseus tasks · done`, read-only, and is deleted this many days after it ended
status_line = true                      # the bot's status reads counts only, `🔴 1 needs you · ⚙️ 3 running`, and is cleared when nothing works or waits; everyone who can see the bot sees it
app_emojis = true                       # task states drawn with the bot's own animated emojis (uploaded once to the application); false, or while Discord refuses them, the plain ones
digest_at = ["08:00", "18:00"]          # local times a digest of what happened is posted to your DM, only when something did, and not within [notify] unprompted_pace_secs of another unprompted post; [] is none
# A turn's reply, a confirm card and how it closed, and the notices you must see
# are posts in the outbox, written when they happen and sent once when Discord
# can take them, in order per place; health shows what waits. For tests and
# scratch daemons only, both sides can point at local stand-ins, so nothing
# reaches Discord:
# rest_proxy = "127.0.0.1:9447"         # REST at http://<this>/api/v10
# gateway_proxy = "ws://127.0.0.1:9448" # the gateway's websocket
# One private forum in your guild is the home of every task, a post each (the complete index of
# your tasks): a task from the DM or a private channel works in its post, and any other task's
# post is a card linking where it works, with its state as a tag. It acts only when the bindings
# file trusts exactly one guild (`private = true`). It is found by the id it was made with, else
# by `forum_channel` (an id, or a name), else made, visible to you and the bot alone; the bot
# needs Manage Channels and Manage Roles there. A refusal turns it off for the run, said once.
forum = true
forum_channel = "theseus"               # a forum's Discord id (15-21 digits), or its name
# One private text channel, yours and the bot's alone, is the dashboard of your tasks: the pinned
# live board, every task's report, and one quiet line a task pointing at its forum post. A task
# started from the DM or a voice channel reports there; the DM keeps the conversation and the
# pings that need you. Found by the id it was made with, else by this name (or id), else made in
# the trusted guild (same rule as the forum). "" turns it off: the board and the reports stay in
# the DM as they were.
task_home = "theseus-tasks"
# A channel the bindings file names (private) can run as a thread's place: its
# messages go to that thread's session, as /thread bind does from Discord.
# [[discord.thread]]
# channel = "123456789012345678"
# thread = "my-thread"
# The guild's Events tab as a calendar (horizon HZ11): the next days of reminders, routine
# runs and milestones as scheduled events, each settled as it passes. Off by default. It goes
# only in a guild the bindings file trusts (`private = true`); an event is named for its
# title only when the item speaks in a private place, else `Theseus · reminder`, and never
# holds a dollar figure.
[discord.calendar]
enabled = false
# guild = "123456789012345678"          # the trusted guild's id; required when enabled
days = 7                                # how many days ahead
max_events = 10                         # at most this many events stand at once (1 to 50)

# ---------------------------------------------------------------- voice
# Voice in a Discord voice channel. Bind the voice channel in the bindings
# file as a channel with voice = true (its text chat is the place's text: the
# transcript, the replies, the cards), then invite Theseus with /join from a
# private place; /leave ends the call, and the conversation goes on in text.
# Only the place's users are heard. Deepgram does both directions on one key:
# speech to text per utterance, synthesis per sentence. Each call is priced in
# code (by the minute heard, by the thousand characters spoken) and counts
# against its session's spend. Off unless enabled; the key's line in the
# secrets section is commented out too.
# [voice]
# enabled = true
# key_secret = "deepgram_api_key"       # the [secrets] entry holding the Deepgram key; only Theseus reads it
# stt_model = "flux-general-en"         # speech to text: "flux-general-en" (the default: Deepgram Flux, English; its model decides
#                                       # where your turn ends and it streams your voice for the call; pause_ms and merge_ms do not
#                                       # apply; if its socket cannot be opened the call uses nova-3 and the pause rules), or
#                                       # "nova-3" (the fallback by config: a pause of yours ends your turn: pause_ms, merge_ms;
#                                       # any language). Voice notes and file transcripts always use nova-3. Priced by the minute
#                                       # streamed
# eot_threshold = 0.7                   # Flux only: how sure it must be that your turn ended (0.5 to 0.9); higher: fewer early ends
# eager_eot_threshold = 0.5             # Flux only: start a reply on an early end of turn (0.3 to 0.9) and take it back if you go on;
#                                       # unset: off, only the end of turn starts a reply
# eot_timeout_ms = 5000                 # Flux only: force a turn's end after this much silence (500 to 10000)
# language = "en-US"
# tts_voice = "aura-2-andromeda-en"     # the voice: an Aura model; a persona's own tts_voice wins while it is in play
#                                       # (`theseus persona voice` shows the one in play, `theseus persona voice audition` lets you hear several)
# api_base = "https://api.deepgram.com" # tests and scratch daemons: a local stand-in
# deaf_after_secs = 10                  # a call that hears no listed speaker this long after joining rejoins once
# greeting = "{name} here. Go ahead."   # said first when /join succeeds, in the persona's voice ({name} is its name); "" says nothing
# status = true                         # while in a call, the voice channel's status reads the task counts
#                                       # ("🎧 Theseus · ⚙️ 3 tasks · 🔴 1 needs you"), counts alone, cleared at leave;
#                                       # a bound voice channel may say voice_status = false. Needs the bot to have
#                                       # the Set Voice Channel Status permission (a 403 is said once in health)
# join_guard = true                     # a short or unclear sound before the greeting finished is no turn (the join's chime heard back), and one or two
#                                       # words of the greeting's head heard back are its echo; false restores the old reading
# echo_cancel = true                    # while Theseus speaks, a barge-in is judged on what you send once its own voice, as it sent it, is
#                                       # taken out (your speakers' echo never stops it, your voice over it does); false judges the raw stream
# judge_unclear = true                  # a short (3 words or fewer) or low-confidence transcript that would be a turn, heard over
#                                       # Theseus's speech, just after it or at the join, is asked of Jev (heard.v1) first: speech to
#                                       # answer, Theseus's own echo, or noise; at Jev's act band it decides, else the rules do.
#                                       # false: the rules alone, as before
# judge_ms = 250                        # how long such a transcript waits for Jev (1 to 2000); past it the rules decide
# pause_ms = 1200                       # nova-3 only (Flux ends turns itself): how long you are quiet before your sentence is a turn (300 to 3000); longer: fewer chopped
#                                       # sentences, each reply a little later (1200 adds about 0.5 s over the old 700)
# lead_in_ms = 600                      # silence sent before Theseus's first sound after quiet (0 to 1000; 0 is off); longer: a whole
#                                       # first word, a later first sound. Between a reply's sentences silence keeps playing (0.7 s).
# gap_lead_in_ms = 200                  # silence before a later sentence when nothing kept the line warm between (0 to 1000; 0 is off)
# merge_ms = 1500                       # nova-3 only: a sentence of yours with no ., ? or ! at its end waits this long (0 to 5000; 0 is off) for the
#                                       # next thing you say, and the two are one turn; a finished sentence never waits
# speak_tasks = true                    # in a call in a private place, a task's new question and its end are said once at the next
#                                       # pause (a title and a sentence or two), and "approve", "the second one" or "stop it"
#                                       # answers the question as you (the core judges it as it judges a button)

# ---------------------------------------------------------------- web
# The localhost web UI, the cockpit, at /. Loopback only; a non-loopback
# bind is refused. It serves only its own page and address, and only
# processes of the user that runs the daemon.
[web]
enabled = true
bind = "127.0.0.1"
port = 7433
# For UI development only: the cockpit's Vite dev page (`npm run dev` in
# cockpit/), which opens /ws straight, with no proxy. While set, /ws also
# serves that one origin, and each use is counted in health and ledgered
# (web.dev_origin). Off by default. Unset it when you are done: the dev
# server's port is open to every local user.
# dev_origin = "http://127.0.0.1:5174"

# ---------------------------------------------------------------- tui
# How the terminal clients (theseus-tui; `theseus status --watch` has its own
# --notify, off by default) ping you when a task needs you or finishes:
# "auto" (a Windows toast through powershell.exe under WSL, OSC 9 in a
# terminal that has it, else the bell), "toast", "bell", "osc9", "osc777", or
# "off". The TUI's --notify flag overrides it.
[tui]
notify = "auto"

# ---------------------------------------------------------------- mcp_server
# Theseus's own MCP server: an MCP client on this machine (Claude Code,
# another agent) opens a Theseus conversation, sends it text, and reads the
# reply, over streamable HTTP at http://127.0.0.1:<port>/mcp, with the key as
# `Authorization: Bearer <key>`. Loopback only; it serves only processes of
# the user that runs the daemon, refuses a page's Origin that is not on this
# machine, and never takes an approval: an acting call in a session it opened
# waits for you, from the CLI, the web UI, or your DM. Each session it opens
# is labelled `mcp <client>`, has its own spend limit, and is a private place
# (its words go to the client, a process of yours). Off unless enabled; the
# key's line in the secrets section is commented out too.
# [mcp_server]
# enabled = true
# port = 7434                           # on 127.0.0.1 only
# key_secret = "mcp_server_key"         # the [secrets] entry holding the key (16 bytes or more); only Theseus reads it
# posture_floor = "approve"             # an MCP-opened session's acting calls take at least this posture
# spend_limit_usd = 5.0                 # each MCP-opened session's spend limit
# requests_per_minute = 60              # over every client; past it, 429
# memory = false                        # true: the memory_search and memory_get tools read your private memory (never a shared place's), no model call; each call is a memory.read row

# ---------------------------------------------------------------- index
# The index tender (M6): `theseus-index`, installed beside theseusd. It starts
# once the socket answers, never before; follows the store's log, read-only,
# into a search index in <state_dir>/index (BM25 and exact entities, and
# vectors once the model's files are in weights_dir); and answers `theseus
# index search`. Whenever it exits it starts again, after 1 s, the wait
# doubling to 60 s while it keeps failing. A stop never waits for it. Without
# its binary, or with this off, nothing else changes, and health says why.
[index]
enabled = true
weights_dir = "~/.cache/theseus/models"   # the embedding model's files; nothing is fetched, and without them BM25 and entities answer alone
threads = 1                               # the embedding model's threads
query_threads = 0                         # a recall query's embedding's own pool, ahead of the backfill; 0: four (never more than the cores), and one thread, one query at a time, while the machine is busy
idle_unload_mins = 10.0                   # the model unloads after this long unused (about 500 MB), and loads again on the next use

# ---------------------------------------------------------------- memory
# Recall (M6 step 30a): on a turn's first loop, ask the index what past nodes
# bear on what the turn brings, filter them (the place rule first: a shared
# place draws only on its own sessions, a private place only on private ones),
# and pack what would be admitted. On by default (theseus-is8t): mode "live"
# on the baseline arm, which needs no Jev. With no index built, a recall
# answers nothing and costs nothing, and it never holds a turn past
# recall_deadline_ms. mode = "off" turns it off, and a config that sets mode
# keeps its value. In shadow, each recall is a
# recall.shadow row, a span, and a narrative line, and nothing reaches the
# model: its request is the same byte for byte. See it with
# `theseus memory recalled <session>` and `theseus memory search "<query>"`.
# An older binary refuses a [memory] table: install first, then paste.
# Canary and live (step 30b) put recall in front of the model: a note after
# the turn's new message, testimony with each source's date, a Recall node
# that references its sources (`theseus reach` counts each copy), a
# recall.ran row, and a "🧠 N recalled" footer on Discord. Label a node
# with `theseus memory label <node> wrong` to keep it out.
# [memory]
# mode = "live"                           # live (the default) | canary | shadow | off
# arm = "baseline"                        # the arm canary and live sessions get: none | bm25 | baseline | +retention (FSRS-6 in the rank) | +activation (spreading activation as one more ranked source; its adjacency projection is built after serving) | +synthesis (consolidation's checked syntheses as candidates)
# canary_fraction = 0.5                   # canary: the share of sessions on the arm, sticky by a hash of session and experiment; the rest run none, with baseline in shadow
# experiment = "m6-1"                     # names the plan; seeds each session's arm
# session_recall_cap_tokens = 64000       # the recall notes a session's tail may hold; past it, recall pauses until the next recompile
# recall_budget_tokens = 3000             # the pack's tokens
# recall_max_items = 8                    # the pack's items, at most 40; both are an ordinary prompt's (a trivial detour's request carries none)
# deep_recall_tokens = 8000               # a deep prompt's pack (the route pack's sophisticated, deep_coding, review), in tokens
# deep_recall_items = 16                  # ... and items, at most 40; at the ordinary pack's numbers, every prompt packs alike
# recall_deadline_ms = 250                # how long recall waits for the index; the turn never waits past its model call and this
# recall_vector_tokens = 32               # the most word pieces of a turn's new text the vector search embeds (the words' search reads the whole query), at most 500; 0: uncut
# rerank_wait_ms = 200                    # how long a recall in front of the model waits for Jev's rerank (rerank.v1 live), 1 to 600; past it, recall's own order stands
# recall_floor = 0.0                      # the relevance floor: a candidate whose fused score is under this share (0 to 1) of the best its answering sources allow is not admitted, and a pack of none brings no Recall node; 0 admits all
# recall_subject_bar = 0.0                # the share (0 to 1) of that best a candidate about another subject of the question's kind must reach (a host, path or crate the question did not name); 0: no bar
# include_external = false                # whether fetched text may be recalled
# Compaction (step 30c): where the ring would drop a session's leading turns to fit
# the model's window, this profile summarizes them instead, and the request carries
# the summary, then the turns kept. "session" (the default) is the turn's own
# profile, provider and model, so the range goes nowhere the session's turns
# don't. A key of [profiles] sends it to that profile's provider, which may not be
# the session's. "off" keeps the ring. A call that fails, or a summary that would
# not fit, rings as before, and the row says why.
# summary_profile = "session"             # "session", a key of [profiles], or "off"; "haikuhi" (Haiku 5.5
#                                         # at high effort, 1M window) is the recommended choice, which
#                                         # sends the range to Anthropic whatever the session's provider
# assembled_budget_tokens = 4000          # the recall section a task's first compile and a compaction carry (canary and live)
# Consolidation (step 31b): off every turn, nodes recall admits together in
# three or more turns become one short synthesis per cluster, every sentence
# citing its sources, checked by Jev (citation.v1) and kept as a Synthesis node.
# Never shown in shadow: only arm "+synthesis" puts a checked one before a model.
# "session" (the default) writes it with the profile every source's session
# last used, so no second provider reads a session's text; sources whose
# sessions disagree wait. A key of [profiles] is the operator's choice.
# synth_profile = "session"               # "session", or a key of [profiles]; "haikuhi" (Haiku 5.5 at
#                                         # high effort) is the recommended choice: about 18x the clusters
#                                         # of Sonnet 5.5 for the day's limit, each still checked by citation.v1
# synth_limit_usd_per_day = 0.50          # what consolidation may spend in a local day, read from its rows
# consolidate_hour = 4                    # the local hour of the nightly run (0 to 23); never within 10 minutes of a start
# Tiering (step 33): decoded nodes stay in a cache shared across turns, so a
# turn decodes only what no reader decoded before it; past the bound, the
# coldest go first (the science's decay hints, then the least recently read).
# It is the store's read path: it serves with mode = "off" too.
# node_cache_mb = 64                      # MB of the nodes' records it keeps; 0 turns it off

# ---------------------------------------------------------------- lsp
# Language servers (L2): the lsp tools ask a project's language server where a
# symbol is defined, who uses it, what it is, a file's outline, its errors, and
# a rename's edit. Off by default. A server starts at the first call for a file
# of its language in a project, never before: one per server and project root
# (the nearest Cargo.toml with [workspace], else the topmost; tsconfig.json,
# jsconfig.json, or package.json; pyproject.toml, setup.py, or requirements.txt),
# with the job environment, its stderr in <state_dir>/lsp/. That first start is
# a program run, judged at proc.run's posture for its command. A server stops
# when idle, at the daemon's stop, or when a request goes unanswered, and the
# next call starts it again. Health's lsp line shows each server, its time to
# ready, and its memory (rust-analyzer can take gigabytes on a large workspace).
# A file's server is the first installed of: rust-analyzer; ty, pyright,
# basedpyright; tsgo (TypeScript 7's tsc --lsp), typescript-language-server.
# An edit (fs.write, fs.edit, fs.patch, lsp.rename) whose file has a server up
# for its root waits up to edit_wait_ms for that server's errors, and its result
# shows them under "Errors after this edit:"; a file the wait beats is pending,
# and what arrives rides on the session's next edit or lsp result. Never in a
# shared place. A server with start_on_edit is started by an edit too, as a
# call would start it (ty and tsgo take tens of milliseconds and 40 to 50 MB).
# An older binary refuses an [lsp] table: install first, then paste.
# [lsp]
# enabled = true                          # off by default
# idle_stop_mins = 10.0                   # a server unused this long stops
# request_timeout_secs = 30               # a request unanswered this long is cancelled, and its server stopped
# edit_diagnostics = true                 # an edit's result carries its files' errors
# edit_wait_ms = 1500                     # how long an edit waits for them, 1 to 30000
# [lsp.servers.rust-analyzer]             # start_on_edit: an edit starts this server too; on for ty, tsgo, and
# start_on_edit = false                   #   rust-analyzer, off for the other presets and your own servers unless set
# [lsp.servers.pyright]                   # change a preset: command, extensions, roots (its markers), settings, enabled
# settings = { python = { analysis = { diagnosticMode = "openFilesOnly" } } }
# start_on_edit = true
# [lsp.servers.some-server]               # or add one: a command and its extensions
# command = ["some-server", "--stdio"]
# extensions = ["some"]

# ---------------------------------------------------------------- sessions
# A session's state, which the cockpit's Ship filters by (Live by default):
# live has a turn within live_window_hours, or runs, or waits on you; quiet has
# none; retired was superseded (its place moved to a newer session), retired
# by hand (theseus sessions retire), or never took a turn and is past
# empty_grace_minutes. Nothing is deleted: a retired session stays readable
# and searchable, and theseus sessions reopen brings it back. The first prompt
# with substance among a session's first retitle_within_turns becomes its
# title, once, and the old one is kept beside it (0 turns that off).
# [sessions]
# live_window_hours = 24.0                # a turn within this long reads live
# empty_grace_minutes = 60.0              # a session never used reads retired this long after it opened
# retitle_within_turns = 3                # 0: titles stay the first prompt's

# ---------------------------------------------------------------- threads
# A thread is a durable record of one line of work, bound to a virtual place
# `thread:<slug>` and so to a chain of sessions of its own (`theseus thread
# new`, then `theseus ask --thread <slug>`). Two threads are two executions and
# run at once; a thread is private always, and a shared place never lists or
# addresses one. max_live bounds the active and paused threads together.
# A message in a private place that names no thread finds its own (theseus-rha2)
# when the place has two or more live threads: by the place, a "#slug" or
# "/t slug", a reply to a thread's reply, then what it is about (the threads'
# working sets, the place's last thread, and Jev's classify.v2); it asks one
# line only when it cannot tell. One-offs run in the place's own conversation.
# [threads]
# enabled = true                          # false: no thread is made or addressed (the records stay)
# max_live = 50                           # active and paused threads at once
# discord_channel = "123456789012345678"  # a channel (text or forum) in your guild: each active thread gets a Discord thread there, made at its first message; unset: none
# import_day_usd = 2.0                    # what the cards of `theseus thread import --apply` may spend a local day (one Haiku call a thread, cited to its episodes); past it a thread is made without a card
# import_profile = "haiku"                # the profile whose model writes those cards
# cross_recall_penalty = 0.35             # in a threaded session, the share of its score a recalled note from another thread pays
# cross_recall_bar = 0.75                 # ...and it is admitted only above this share of the query's best score, unless the message names that thread (slug, title, or a working-set entity)
# cross_recall_beats_own = true           # ...and, once it has paid its penalty, only when it still outranks the asking thread's own best hit of the query (false: the bar alone decides)
# cross_recall_needs_entity = true        # ...and a recalled note from another thread whose chunk holds entities (a path, a ticket, a host) the message names none of is dropped: a question's shape alone pulls no other stream's note
# base_distance = true                    # a note from no thread (the place's own conversation) is another stream's to a threaded session: it pays the same distance, and a name never waives it (false: it recalls as before)
# own_top_admissible = true              # ...and the asking thread's own best hit it must outrank is one not already in context (false: in context or not)
# cross_recall_judge = true              # the notes of another thread the distance dropped near the bar go to Jev, who reads whether each is about the message's subject, not only the same kind of fact; a yes is admitted with the penalty and labelled (false: the drops stand)
# cross_recall_judge_k = 3                # at most this many notes a request (1 to 10)
# place_digest = true                     # a message in a thread that Jev reads as asking across everything going on gets, for that turn, one labelled line for each other live thread of the place (a sealed one only counted; false: none, and no turn waits for the answer)
# place_digest_line_chars = 200           # the longest a digest's line is, in characters
# sticky_half_life_secs = 600             # a place's last thread stays the likely one for its next message, halving every this many seconds
# route_wait_ms = 400                     # at most this long an unaddressed message waits for Jev's choice of thread; on timeout the router's own pick stands, tagged a guess
# ask_wait_secs = 900                     # how long a message waits for your answer to "which thread?" before it runs in the place's own conversation
# sticky_alone_asks = true               # a thread that stands only on being the place's last one (no entity of its named) cannot overrule Jev's other pick: the message is asked about, offering a new thread when it names two or more entities no thread holds (false: as before)
# ask_every_thread = true                # "which thread?" lists every live, unsealed thread (past four, the best three and "another thread"), and any thread's slug answers it (false: the best two)
# working_set_grows = true               # after a turn in a thread, the files its calls touched (and their first directory) and the entities its message named join the thread's working set, but for what another live thread holds (false: only your edits, splits and merges change it)
# bench_clock = false                    # a test hook for the threadbench: a turn.submit carrying route_at_ms is routed at that clock, even from `ask -s` (false: such a submit is refused); never on in a real config
# single_offers_new = true               # with one live thread, a message it does not clearly hold that names two or more entities no thread holds is asked about: that thread, a new one, or home (false: it runs at home unasked)
# A thread's next message after its cache window (the profile's cache_ttl since
# its last call) finds the provider's cache gone, so the request is rewritten
# whole anyway: the rewrite is made small. The thread's fresh card, the
# compaction summary and the newest resume_keep_turns turns; a big old result
# is a stub that says how to read it again.
# resume_keep_turns = 20                  # the newest turns a cold resume keeps whole
# working_percent = 40                   # what a thread's request stays within after a cold resume (its newest turn aside), as a share (1-100) of the serving model's context window
# working_tokens = 60000                 # the same in tokens, when you set it; it wins over working_percent (unset by default)
# home_warn_percent = 50                 # a place's home past this share (1-100) of the serving model's context window tells the owner's DM, once per home; large sessions are otherwise fine
# Keep-warm for threads is [cache] threads_keep_warm_hours: an active thread whose owner last
# wrote within it has its session read at the [cache] interval, as a long conversation's is,
# so its next message reads the cache instead of rewriting it. A paused or done thread is never
# read, and pausing stops it at once. `theseus health` has a threads line, and `theseus thread
# show` the thread's own numbers.
# With two or more [personas], each message is answered by the one it calls for: named at its start
# ("Birch, ..."), `@birch`, or `/as birch` always; else Jev's pick (route.v5's persona question),
# which `shadow` only records and `act` engages (silently from 0.90, with a visible why from 0.60).
# persona_engage = "shadow"               # shadow | act
# seal_recommend = false                  # true: Jev's route.v5 `seal` question, answered yes at 0.60 or above in a thread, proposes sealing it (a card to your DM; Jev recommends, you seal)
# link_proposals = true                   # Jev admits another live, unsealed thread's notes into a thread's recall twice: one sentence to your DM offers `theseus thread link` (once a pair; it links nothing itself; false: nothing is counted or posted)
# claim_home_turns = true                 # a turn run at home whose written files all fall in one live, unsealed thread's working set becomes that thread's memory (`theseus thread unclaim ID` undoes one; false: nothing is claimed)

# ---------------------------------------------------------------- initiative
# What Theseus says first, in its persona's voice (theseus-slvl.9). How readily
# it speaks is the persona's `initiative` (`quiet`: only what needs you and what
# you asked for; `normal`: also promised follow-ups, finished work and one
# morning note on days something happened; `chatty`: also observations it is
# confident are useful). A wake's result and a task's report are turns and
# speak as the session's persona already; a message the daemon starts on its
# own (the morning note, a consolidation finding) is one short model call that
# carries the persona's file and your standing orders, off every turn's path.
# A 👍 or 👎 on such a message (`theseus persona rate`) is recorded, and
# `theseus persona` shows the week's promises kept and verdicts.
# [initiative]
# profile = "haiku"                       # the profile whose model writes them (a cheap one); unset: the live profile
# day_usd = 0.50                          # what those calls may spend a local day; past it a message goes out as its template (which reads the persona's name and emoji)
# morning_hour = 8                        # the local hour from which the day's one morning note may go

# The owner's other agents come over as personas (theseus-a8n7): `theseus persona
# import --from <workspace> --name <persona>` copies the files below byte for
# byte into <state>/personas/<persona>/ and points [personas.<persona>] at them.
# [persona_import]
# import_files = ["SOUL.md", "IDENTITY.md", "USER.md", "AGENTS.md", "MEMORY.md", "memory"]   # a name ending .md is a file in the workspace's top folder; any other name is a folder of curated notes (carried, not compiled)
# own_boost = 1.2                         # while a persona is engaged, its own agent's imported episodes rank this much higher at equal relevance in recall (1.0 off, at most 2.0)

# ---------------------------------------------------------------- cockpit
# Each reply's footer links to its turn in the cockpit (`<public_url>/session/
# <session>/turn/<turn>`): the flame graph, each loop's request and thinking,
# each tool call. The address follows [web] port on localhost. Set public_url
# where a relay forwards another port to the daemon's web port. The link
# carries no key or token.
# [cockpit]
# public_url = "http://localhost:7433"    # the address a browser reaches the cockpit at; left out, http://localhost:<[web] port>

# ---------------------------------------------------------------- routines
# A routine is recurring work that is its own execution: a schedule (`weekdays
# 08:00`, `every 30m`, `monthly 09:00`, or cron such as `0 8 * * 1-5`, in the
# daemon's zone) and a brief, and every run is a fresh task whose context starts
# empty. Each run carves its budget from the routine's month, which resets on
# the 1st of the local month; a spent month skips its runs and says so once.
# `theseus routine add "weekdays 08:00" "Summarize ..." --budget 0.50 --to dm`.
# A routine's runs use the tools in its grant (`--grant gmail.search,web.fetch`)
# without asking; any other call asks, and a
# question nobody answers by the run's deadline ends the run blocked, naming the
# tool, in one notice. `theseus routine try <id>` runs it once while you watch.
# [routines]
# default_run_usd = 0.50                  # the most one run may spend, when a routine names none
# default_month_usd = 10                  # a routine's month, reset on the 1st (local), when it names none
# max_routines = 50                       # live routines at once
# run_deadline_secs = 900                 # how long a run's question outside its grant waits before the call is dropped and the run goes on without it

# ---------------------------------------------------------------- watches
# Waiting on the world with no model (theseus-f2r2b): `theseus watch-for add "PR 123
# merged" --run 'gh pr view 123 --json state -q .state' --until 'equals MERGED'`, or
# the model's `watch` tool. A check (a command in L1, a fetch, a file) runs on a
# timer until its condition holds, then the owner is told (or the conversation gets
# a turn, or a task starts). An unchanged value writes nothing: three days at 5
# minutes is hundreds of checks and a handful of frames, at no model cost. The most
# watches the daemon holds is [kernel] max_watches.
# [watch_for]
# default_every = "5m"                    # how often a watch checks when it does not say
# min_every = "1m"                        # the most often one may check (a minute at the least)
# max_days = 30                           # the longest one waits before it gives up, and the default

# ---------------------------------------------------------------- route
# Your own benchmark (own-benchmark, theseus-pw1q.12). Nightly, paced by
# pressure, a few of your recent turns per (model, effort) cell are rebuilt
# byte for byte, sent one rung down the routing table (`[routing.classes.*]`),
# and judged by compare.v1 against the reply they got; `theseus model bench`
# says per cell what matched and what moving it would have saved. Never a
# shared place's turn, and never one that would send a sealed thread's, a
# veiled recall's or an attachment's bytes to another provider. It moves no
# routing: a pack that would climbs the ladder on its frozen holdout.
# [route_bench]
# replay_day_usd = 1.0                    # the most the replays and their judgments may cost in a local day; 0 turns the sampler off
# whole_loops = 24                        # a whole-turn replay (`theseus model replay --whole`) makes at most this many model calls
# whole_seconds = 300                     # ... runs at most this long
# whole_usd = 0.5                         # ... spends at most this much on the model
# whole_tree_mb = 256                     # ... copies at most this much of the turn's directory to scratch
# whole_label_bar = 0.9                   # a judged whole-turn match this sure becomes a machine label for routing's learning (train split only); 0 writes none

# ---------------------------------------------------------------- prefix
# The prefix library (theseus-rr15): the third layer of a request (the project:
# the system-level context files, then the session's topics' guidance) is kept
# by digest and reused byte for byte across sessions and threads, so the
# provider's prompt cache serves it. Picked only where a request is rewritten
# anyway (a new session, a cold resume, a forced or system-changed recompile),
# never under a warm session. A header that covers at least confirm of the fresh
# layer is reused and what it lacks goes after the cached prefix; below confirm
# a new header is minted only when its expected reuse pays for rewriting the
# warm coarser one. `theseus model prefix` shows the picks and false fits.
# [prefix]
# enabled = true                          # false: every session renders its own layers, as before the library
# max_bytes = 10485760                    # the library's resident size; past it the header read least recently retires
# act = 0.9                               # a reuse at or above this fit is quiet
# confirm = 0.6                           # a reuse below act is watched for a false fit; below confirm, mint or the coarser header
# candidates = 16                         # the nearest headers by sketch a pick scores

# ---------------------------------------------------------------- notify
# A question for the owner (an approval, a budget's, an `owner_ask`) shows at
# once, silently, on every Theseus screen and on the owner's DM board. If it is
# still open after escalate_after_secs and no Theseus screen is open, or after
# escalate_with_screen_secs and one is, the core posts one "needs you" to the
# owner's DM, which pings; answering the question anywhere settles it.
# [notify]
# escalate_after_secs = 60                # no screen open: the DM pings after this long
# escalate_with_screen_secs = 300         # a screen open: after this long
# unprompted_pace_secs = 1800            # at most one unprompted DM post (a needs-you now; the digest and nudges later) in this long, what is due meanwhile going out together; 0: no rule
# dm_cards = true                       # a question that reaches your DM is its own card with Approve, Decline and Details (a batch, one card each), in plain words, and a reply to it answers it; false: the one-line post of before

# ---------------------------------------------------------------- projects
# A project is long-term work on the task graph: a goal, dated milestones that
# remind you (a notice in your Home on the day, and one overdue notice, no
# sound, a day after), a weekly review (a routine made with the project, whose
# run log is its history), and a slice of it in every conversation attached to
# it (`theseus project attach`), which survives every compaction.
# `theseus projects`, `theseus project show <id>`.
# [projects]
# review_schedule = "mon 08:00"           # the weekly review, in a routine's words, when none is named
# review_run_usd = 0.75                   # the most one review run may spend
# review_month_usd = 6                    # a review routine's month
# overdue_after_minutes = 1440            # how long after its date an open milestone is overdue
# max_milestones = 32                     # the most milestones one task_create makes

# ---------------------------------------------------------------- standing
# What the owner's words become (theseus-slvl.5). `directive.v1` reads the
# owner's own messages in a private place (the CLI, the web UI, a DM), in the
# request the other inbound packs ride: what it is sure of (a preference, a
# fact, a correction) is kept as a standing record with a notice and an undo;
# what it is unsure of, and every order, is asked; and a message that says a
# live record again is counted (`theseus standing` shows the week's count).
# `theseus packs rollback directive.v1` puts the pack back in shadow.
# [standing]
# capture = true                          # false: nothing is captured, asked or counted

# ---------------------------------------------------------------- people
# People proposed from text (theseus-wy7y): a cheap profile reads a session's
# human-facing text and returns candidate people through a tool schema; Jev
# (people.v1) judges each; code decides. Proposals only: the owner accepts them
# (`theseus ontology proposals`, `theseus ontology accept --kind person`).
# Never proposed: the owner (his handles, his DM person and each word of its
# name), the personas, the agents (a session's, every imported episode's agent,
# and each agent's name in its imported IDENTITY.md), the house's names
# (theseus, jev, openclaw, claude, the profiles and their models), a bot's or a
# UI's name, and not_people (theseus-0p1r); a role line that judges the person
# or carries their pay, money, health, leave or HR matters is dropped. A name
# the store cannot know (the owner's full name, an agent never imported) goes
# in not_people. `theseus import people TAG --propose` runs it over an import.
# Live, Jev gates the extractor (people_seen.v1, theseus-u5n8): at each due
# exchange end one Jev call asks which held people the exchange involves (each
# at `confirm` or above is proposed for the session) and whether a person not
# held is; only at `gate` or above does the extractor read the exchange.
# [people]
# extract_profile = "haiku"               # the profile that extracts the candidates
# not_people = []                         # names never proposed, e.g. ["Gullbot"], or
#                                         # the owner's other names: ["Sable Thorn", "S. Thorn"]
# act = 0.9                               # the least probability that proposes in the act band
# confirm = 0.6                           # ... in the confirm band; under it, dropped
# live = true                             # people.v1 at a private conversation's exchange end
# gate = 0.6                              # live: Jev's "a person not held is involved" at or above
#                                         # this runs the extractor; under it, no model call
# sweep_usd_per_day = 2.0                 # the nightly sweep at [judge] learning_hour: an extraction
#                                         # and people.v1 per private session with human text that
#                                         # day that no extraction read (the gate shut), under this
#                                         # many dollars a local day; 0 turns it off; off with live

# ---------------------------------------------------------------- card
# The owner card, proposed from the imported history (theseus-slvl.6). A job
# (`theseus card propose`, and nightly at [judge] learning_hour at most every
# every_days until `theseus card done`) reads the archive's feedback and SOP
# notes, USER-style files and decision_or_preference episodes, clusters the
# near-duplicates, and asks a cheap model to state each cluster as one short
# fact or preference about the owner, citing the episodes it rests on. Each is
# a question the owner keeps, edits or drops (`theseus card`); nothing is added
# by itself. A partner-confidential episode is never read; a statement that
# repeats a live standing record, or one already answered, is not asked again.
# [card]
# profile = "haiku"                       # the profile that states the clusters
# day_usd = 2.0                           # the job's spend a local day; 0 turns it off
# max_open = 30                           # the most proposals waiting at once
# ask_days = 14                           # an unanswered proposal becomes "Not this" after this long
# every_days = 7                          # the nightly run at most this often; 0: only `theseus card propose`
# observe = true                          # live learning: what you say about your own setup, kept privately and asked about nightly; off also when day_usd = 0
# live_per_night = 5                      # the most live questions one nightly pass proposes (0 to 50)
# stale_per_night = 2                     # of those, the most "is this still true?" questions (0 to live_per_night)
# pattern_sessions = 3                    # the conversations a preference must recur in before it is asked (2 to 20)
# dm_per_day = 3                          # the most live questions posted to your DM a day (0 to 10; 0: the CLI only)

# ---------------------------------------------------------------- ontology
# Jev files each message's session into the ontology (`onto.v1`, in the inbound batch
# beside `classify.v4` and `role.v1`): which topic, project, event, resource, capability
# and expertise it is about, and whether a new one is called for. From `act` Theseus
# writes the membership (origin `jev`) and mints a new category, and tells you in the
# reply's footer (`filed: topic > theseus > ontology (new)`); a mint sends one card to
# your DM with an undo button. From `confirm` it asks you in a card and writes nothing.
# Below that the answer is only a record. `theseus ontology undo` takes a write back.
# [ontology]
# judge = true                            # the rollback: off, onto.v1 is not asked and nothing is written
# act = 0.80                              # at and above this, Jev's answer is written
# confirm = 0.55                          # from this, you are asked
# name_profile = "haiku"                  # names a new category when no mined name fits; once a session, kind and day
# request = "batch"                       # "own": onto.v1 in a request of its own, never waited on (if the batch slows)
# recall_boost = 0.25                    # a note from a session sharing a category with this one gains up to this in recall's rank (0 off)
# private_mark = false                    # on: a picture or message Jev judges to disclose a private matter, or to show
#                                         # people or identifiers, at `act` marks its node private (undoable). Off until
#                                         # you say on: the mark changes what later requests may send to models outside
#                                         # the US allowlist (theseus-und4g).
# sweep = true                            # nightly: a machine's membership unconfirmed for 30 days decays, and a duplicate category a machine wrote merges into its twin (each undoable; no model, no spend); false is the rollback
# sweep_usd_per_day = 1.0                 # the sweep's model calls a local day (theseus-nzzz4): Jev judges two categories that look alike (same_thing.v1: merged at 0.85), a category of 12 sessions or more (two_things.v1: split in two at 0.85), a category whose name has gone stale (name_it.v1: renamed to a name mined from its sessions at 0.85), and names the `other` answers mined (same_kind.v1: joined into one kind; name_it.v1: the minted kind's name); a call that would pass what is left of the day's cap is not begun; 0 turns the model's part off and the deterministic sweep still runs
# dream_guidance = true                   # nightly, after consolidation: a machine's category that 5 private sessions hold and that has no guidance gets its first, under [memory] synth_limit_usd_per_day; false is the rollback
# not_topics = []                         # topic names Jev never proposes (a "new topic" or an existing one), matched on name with case and spacing ignored, as [people] not_people does for people; the cockpit's Never button keeps its own list in the store (undo it there), this is the part you keep here

# ---------------------------------------------------------------- import
# The nightly OpenClaw sync (`theseus import sync`, run by a systemd user timer that
# `scripts/user-service.sh sync-timer install` installs): OpenClaw's own session stores
# read (read only) for what changed since the last run, a session that grew appended to
# its imported session, and the people in its new messages proposed. Off while state_dir
# is unset. A deployment's own values go in its own config, never here.
# [import.openclaw]
# state_dir = "/home/me/.openclaw"        # OpenClaw's state directory (holds agents/)
# owner_ids = []                          # your sender ids in OpenClaw's channels: a message from
#                                         # one is yours (operator); any other sender's is outside text
# agents = []                             # the agents to read; none is every agent under agents/

# ---------------------------------------------------------------- self
# Self-improvement: Theseus building its own code, yardsticks and backlog, joining
# what passes every gate and telling you after. Off by default: with mode = "off"
# nothing self-directed runs. With mode = "act", self steps run only while the kill
# switch is released, and a store that has never seen your resume is halted, so
# "act" alone starts nothing: `theseus self resume` from your own shell, the web UI,
# or "resume self" from your own account on Discord, does; nobody else's resume
# counts. Anyone who may speak to the daemon can halt it at once:
# `theseus self halt [why]`, or "halt self" on Discord. `theseus self log` shows
# every change Theseus made to itself, with its numbers and its undo; while mode =
# "act" and digest = "weekly", the week's digest goes to your DM once a week. Read
# at the start: a change takes a restart.
# [self]
# mode = "off"                            # "off" or "act"
# digest = "weekly"                       # "weekly" or "off"
# backlog_starts = 1                      # top backlog items started a night (unset: the pipeline's free build slots; 0: file and rank only)
# backlog_max_open = 20                   # open backlog items kept; the lowest-ranked past it are dropped
# repo = "/home/me/projects/theseus"     # Theseus's own checkout, self branches cut from its
#                                         # origin/main; unset: no self branches
# remote = "origin"                       # where self/* branches are pushed, with the credential
#                                         # that remote already has; unset: they stay local
# exams_day_max = 10                      # the most exam items written a night from your corrections, wrong labels, failed tasks and over-budget turns
# graduate_min_calls = 20                 # calls with no failure that graduate a loaded extension into a self item to port it into core
# graduate_window_days = 14               # the days those calls are counted over
# reviewer_profile = "fable"              # the self-join's independent reviewer: a profile whose model is
#                                         # not the branch builder's (the same model is refused)
# join_lock = "~/.theseus/self/join.lock" # unset: <state>/self/join.lock. A mkdir lock every self-join
#                                         # holds; point it at the outer loop's so their joins never overlap
# install = false                         # true: a joined merge is built and installed on this machine, and
#                                         # the daemon restarts onto it (the owner's standing OK)
# narrow_every_days = 7                   # a hand role's policy is looked at for narrowing at most this often
# narrow_days = 14                        # the days of CloudTrail a narrowing reads (1 to 90)
# narrow_read_pages = 400                 # the most CloudTrail pages (50 events each) one narrowing reads
# revert_window_hours = 24                # hours after a self-join in which a red it caused reverts it on its
#                                         # own, with a notice; 0 watches nothing (the owner's veto always works)
# pipeline_builds = 1                     # self builds at once: the pipeline starts another only while fewer
#                                         # build and fewer self trees are open
# min_free_gb = 40                        # free GB the build trees' filesystem keeps, or no build starts
# [self.budget]                           # one spend account for all self-improvement (the owner's to raise)
# branch_usd = 10.0                       # one self branch, all its loops together
# day_usd = 30.0                          # all self-improvement, per local day
# [self.mint]                             # the pattern miner (nightly, no model): recurring tool-call work found in the ledger and the bench
# mine = false                            # true: with [self] mode = "act", mine the window each night and file the motifs on the backlog
# bench_dirs = []                         # directories of bench trials (Harbor jobs) mined too; absolute or ~/…
# window_days = 14                        # the mining window
# min_occurrences = 5                     # a motif needs this many runs ...
# min_sessions = 3                        # ... in this many sessions ...
# min_days = 2                            # ... on this many days, in one repository
# per_night = 1                           # read by the mint step: motifs started a night
# max_live = 10                           # read by the deploy step: minted tools live at once
# usd = 2.0                               # read by the mint step: dollars one motif may spend, on the self budget
# replay_turns = 5                        # read by the mint step: check-half turns replayed with a model
# retire_after_days = 30                  # read by the retire step: days unused before a minted tool retires
# hint = false                            # read by the deploy step: a one-line hint in a result that matches a minted tool's motif
# kinds = ["flow"]                        # read by the mint step: the kinds it may mint (flow, mcp, rust)
# [self.sealed]                           # sealed holdout sets: exams kept out of Theseus's reach (the owner's)
# dir = "/srv/theseus-sealed"             # unset: no sealed set. Where the sets live, out of Theseus's reach:
#                                         # an absolute path outside every workspace root, the state dir, the
#                                         # repository and [sandbox] ro_paths (refused at load otherwise). No
#                                         # tool, job, extension or hand can open it; the daemon writes items
#                                         # in and gets scores back, never an item. Seeded by you; changing a
#                                         # set or the scorer is the owner's call. (It was [self] sealed_dir.)
# every_branch = false                    # true: the self-join scores each behaviour-path branch against the sets
# item_usd = 0.25                         # what one item's run may spend, metered by the model relay
# drift_every_days = 7                    # main is scored again this often, to tell drift from a candidate

# ---------------------------------------------------------------- sandbox
# L1, the sandbox (M4): a proc.run job in namespaces of its own, as your own
# uid with no capabilities, over a view built from an empty root: the system's
# directories and ro_paths read-only; the workspace read-only, with what the
# job writes there kept apart in scratch and discarded afterwards (its result
# lists it); an empty HOME and /tmp; no network but the egress below; and
# never Theseus's own state, socket, or token, the approve_paths, or cargo's
# credentials files.
# A job runs in L1 when the model asks for it (sandbox: true), when l1_argv
# names its program, or when default is "l1", and nothing turns L1 back to
# L0. An L1 job runs with a notice instead of waiting for approval, since
# what the floor and the approve lists guard is not in its view. It still
# waits where you said so about proc.run itself (its line under policy.tools
# above, or a "should have asked"), and in a session that has read web text,
# as any call that acts does. A program in L1 gets its broker grant at its
# start, as at L0, and no other secret. When L1 cannot run here, the call
# fails and says why: it never runs at L0 instead. A daemon that runs as root
# runs no L1 job: Linux exempts root from the process limit below.
# Health's sandbox line says how the last L1 job's launch went, and
# `theseusd check` runs L1's self-test. An L1 job's memory has no limit, as an
# L0 job's has none (memory_mb is retired: a config that still sets it loads,
# with a warning, and it is ignored).
[sandbox]
default = "l0"                          # l0 | l1: the class of every proc.run (built-in l0; "l1" runs every job in the sandbox)
# l1_argv = [["npm", "install"], ["cargo", "build"], ["cargo", "test"]]   # programs that always run in L1, matched as allow_argv matches (default none)
ro_paths = ["~/.cargo", "~/.rustup"]    # more read-only paths, each at its own path: here Rust's toolchain and its offline registry (default none: the system's alone); one that does not exist is skipped
pids = 512                              # an L1 job's processes
scratch_mb = 1024                       # what an L1 job may write to scratch, and to each of its /tmp and HOME
output_mb = 64                          # the largest file an L1 job may write; what it prints is capped by [tools] job_output_max_bytes
# Egress: the hosts every L1 job may reach, each "host:port", where a * in the
# host matches any run of characters (*.crates.io is every name under
# crates.io, not crates.io itself) and the port is exact. None by default: an
# L1 job has no network. A job reaches them through a proxy of its own, which
# refuses any other host, and any name that resolves to this machine, your
# network, or a cloud's metadata service; health's sandbox line counts its
# connections and refusals. A call may name more hosts (proc.run's sandbox:
# { egress: [...] }): it then runs with a notice that names them, and the job
# reaches those hosts and no other. Two things to know before you list any:
#   - what a job brings back from a host listed here is not outside text: you
#     chose the host. A job that reached a host its call named beyond this list
#     brings back outside text: its result carries the `external` marker, which
#     holds nothing, and is classified like any item;
#   - every host listed is a way out for anything the job can read: the
#     workspace, ro_paths, and what the call gives it.
# Rust's registry and GitHub, for builds that fetch their dependencies:
# egress = ["crates.io:443", "index.crates.io:443", "static.crates.io:443", "github.com:443", "api.github.com:443", "codeload.github.com:443", "objects.githubusercontent.com:443"]

# ---------------------------------------------------------------- judge
# Jev's judgments (M5): typed questions about the session's work, asked of
# TypeSafe's Jev. On when the Jev key resolves, off without it (below). On, every pack this build wires in judges in
# shadow but three: each judgment is made, priced, and recorded in the ledger, and
# nothing acts on one but the route pack's model and effort for a message ([routing], below), rerank.v1's
# order of a recall in front of the model, and security.v3's notices (below). A judgment sends its state (your messages, the assistant's final
# text, and its tool calls, trimmed and scrubbed of secrets) to TypeSafe. It
# runs beside the turn and the turn never waits for it: a slow or failing Jev
# changes no turn. Today eight packs judge: loop.v1, at each turn that ends
# with no tool calls (where does the work on the ask stand?); security.v3, at
# each call that acts once the gate has decided (how risky is it?); classify.v4 and role.v1, in one request, at each message a person sends
# (what kind of message is it, and which working role does its reply need?),
# but not at a slash command, a wake's turn, a report's turn, or a task's first
# turn; continue.v1, at a compile that appends although one of CONTINUE's
# candidate signals fired (append, or recompile, and how?); categorize.v1, at
# the end of an exchange in a private conversation, once ten of your messages
# came since its last judgment or after 30 minutes' quiet (which of your
# topics is it about? Jev only proposes: `theseus ontology proposals` lists
# them, and you accept or reject each); and rerank.v1, after a turn's recall:
# which of recall's top 20 notes would help answer the message? Its state is
# the message and those notes, only ones the place rule and your labels let
# the turn draw on. The arms rule: memory's mode decides what reaches the
# model, rerank's whether Jev orders it. rerank.v1 is live by default, so a
# recall in front of the model (a canary's treatment; every session when
# memory's mode is "live") waits for Jev's order at most the memory table's
# rerank_wait_ms (200), and keeps its own order past it, or when rerank's own
# breaker is open or the day's limit is spent; the answer, when it comes, is
# still recorded. A recall that reaches no model (memory in shadow, a
# canary's control) is reranked in shadow. Its spend is the judge's day
# budget's. `theseus memory recalled <session>` says whose order each recall
# used.
# `theseus judge log` lists the judgments, and health's judge: line counts
# them and their spend.
#
# On when the Jev key resolves (theseus-is8t): with no `enabled` line, the
# judge is on exactly when the key_secret entry under [secrets] resolves at
# the start (an env: variable that is set, a file: that reads, or an op://
# reference, which the vault answers after serving), and off without it:
# no entry, an unset variable, or a placeholder. `theseusd check` and health
# say which and why. `enabled = false` turns it off whatever the key; `true`
# with no entry refuses to start. Each pack keeps its own mode: routing and
# rerank act (and security.v3's notices, as above), and every other pack
# judges in shadow unless a pack line below says otherwise.
[judge]
# enabled = false                       # unset: on when the key resolves, off without it; false: off; true: on, and the key_secret entry must exist
key_secret = "jev_api_key"              # the [secrets] entry holding the Jev key, read after serving
max_mode = "live"                       # a ceiling on every pack: "shadow" acts on nothing, "off" calls nothing
shadow_limit_usd_per_day = 1.0          # what shadow judgments may spend in a local day; at it, shadow pauses until midnight
max_in_flight = 8                       # Jev calls at once; a shadow judgment with none free is skipped and counted
connect_secs = 2
total_secs = 5                          # a whole call, connect included
learning_hour = 3                       # the local hour of the nightly learning report (labels, calibration, holdouts); a missed night runs 10 minutes after the next start
replay_limit_usd = 0.5                  # what one `theseus judge replay` (or backfill) may spend; a run whose estimate passes it is refused
audit_limit_usd = 5.0                   # what one `theseus judge audit` may spend on its model; the run stops before it would pass it
backfill_consent = false                # true is the owner's consent that `theseus judge backfill` sends recorded history to Jev; agents can't write it
holdout_days = 14                       # the holdout's days before the report's midnight; the learning loop's split from 200 labeled in it
stop_nudge = true                       # a private turn whose last message says more work follows (loop.v1, live) goes on once more; false keeps loop.v1 in shadow; `theseus nudge off` for one session
# api_base = "https://api.typesafe.ai"  # Jev's endpoint (tests point it at a fake)
# A pack's own lines, by its name. The config can lower a pack's mode, never raise it.
# [judge.packs."loop.v1"]
# rung = "off"                          # off | shadow: "off" stops this pack alone
# sample = 0.5                          # the share of its events judged in shadow (default the pack's own, 1.0)
# [judge.packs."rerank.v1"]            # recall's +rerank arm, live (M6 32d): its own 600 ms deadline and breaker
# rung = "off"                          # "shadow" keeps Jev's order out of every request; "off" reranks nothing
# security.v3 is live as notices: when it is at least 90% sure an open call
# (one that ran without asking) was risky, your DM gets a notice after the call,
# which never waits, with right / wrong / noise buttons. More than 30 in a day,
# or 3 labeled noise, pauses them until tomorrow; v3 still judges in shadow.
# [judge.packs."security.v3"]
# notices = true                        # false keeps security.v3 in shadow (only this pack takes the key)
# The learning loop (M5 25f): nightly, after the report, a pack version with
# min_errors new wrong-labels of yours (on its train split, never the holdout) has
# its wording rewritten by writer_profile, as a new version (classify.v101, …) that
# keeps every id, option and threshold; a replay checks it, thresholds are re-fit
# in code, and the numbers place it: live, canary, in shadow, or (security) your
# card; else held, with why. `theseus judge learn <pack>` runs it now.
[judge.learn]
enabled = true                          # on with the judge; false proposes nothing
writer_profile = "opus"                 # the [profiles] key that writes the next version's text
writer_limit_usd_per_day = 2.0          # what the writer may spend in a local day; a proposal past it is skipped and reported
min_errors = 10                         # new train errors a version needs before it is rewritten
min_holdout = 5                         # labeled holdout judgments it needs too: nothing moves on no held-out evidence
max_errors = 40                         # the most the writer reads, newest first
margin = 0.02                           # at the minimum sample, precision and recall each up by this on every deciding question
# CONTINUE's candidate signals, which every compile computes, judge on or off, and
# context.compiled carries. One that fires at a compile that appends asks continue.v1.
# [judge.signals]
# dormancy_minutes = 360                # a new input more than this long after the node before it
# tail_band = 0.5                       # the tail passing this share of the window, then each further quarter

# ---------------------------------------------------------------- routing
# Jev's model per task class (M5 25e). While [judge] is on, route.v9 asks at each
# message you send which task class it needs (beside classify.v4 and role.v1), and
# the turn runs on that class's first usable profile: configured, its key settled, its
# model priced, and able to read the turn's images; else the next; else the session's
# own. "cheapest" is the usable profile cheapest for a short turn at catalog prices. A
# trivial or quick message is a detour: that turn alone runs on its profile, with the last
# trivial_context_turns exchanges, and the session stays where it was. Any other class
# moves the session: at once under cold_switch_tokens of context, above it only when two
# messages in a row agree (a switch leaves the cache cold). A turn whose profile, provider
# or model you chose (`theseus ask -P/-p/-m`, the cockpit's picker) is never routed, and
# a place's profile (its ceiling) is its cap: nothing routes to a dearer model there.
# In the same request route.v9 asks the effort the reply needs (low, medium, high, xhigh,
# max), and the turn's model runs at it when its catalog row takes effort, over the
# profile's own effort unless the profile sets effort_fixed = true, and clamped to
# effort_bounds. An answer below its confirm bar still applies at effort_confidence or
# more (the row says applied_unsure): an effort level costs less than a model switch.
# Under it, when Jev finds it unclear, on a pinned turn, in shadow, and for a late
# verdict, the profile's own effort stands. An answer of xhigh or max applies only when
# its confidence is above high_effort_confidence; at or below, the turn runs at high
# (the row says held_high, or held_high_unsure when the answer was under its confirm
# bar), before the bounds clamp it. An answer of xhigh also needs a sure answer (above its
# confirm bar): an unsure xhigh runs high as held_high_unsure at any confidence, while
# max keeps the confidence bar alone.
[routing]
enabled = true                          # acts only while [judge] is on
rung = "live"                           # "shadow" records each verdict and routes nothing
max_wait_ms = 200                       # the most the first call waits for the verdict after its compile
trivial_context_turns = 2               # the exchanges a detour (trivial, quick) carries
cold_switch_tokens = 30000              # at this much context, a switch waits for a second agreeing message
switch_confidence = 0.6                 # a verdict routes only at this confidence or more
effort_bounds = ["low", "max"]          # the lowest and highest effort Jev's answer may set
high_effort_confidence = 0.40           # an xhigh or max answer applies only above this confidence; else the turn runs high
effort_confidence = 0.35                # an effort answer under its confirm bar applies at this confidence or more (at most high_effort_confidence)
dear_tier_max_tokens = 200000           # over this much context, sophisticated and review skip a profile dearer (per input token) than the next usable one
# Jev chooses which coding turns a China-origin draft is made for (theseus-kqeih; off). With a class's
# cn_draft and final named below, a turn of that class drafts whenever it is eligible. Turned on,
# route.v9 asks Jev one more question, `draft`, whose words are the owner's standing orders: the cheaper
# model's strong points (repo-level fixes, mechanical and automation edits, tests, long mechanical
# work), what it is not for (terminal-driven multi-step work, programs from scratch, anything that
# needs judgement or review), that a first pass there is not the default for code, and that a
# failed draft is cheap to redo only where the whole context is not sent again. Only a sure `cheap`
# drafts; the labels and the rest of the draft rule still apply, and the route row says what Jev
# answered (`draft_choice`) and, when it did not draft, why (`draft_skip`: jev_declined, jev_unsure,
# jev_unasked). It needs a class with a cn_draft. The benchmarks after 1.0.4 tune the words.
# draft_by_jev = true
# A running task's model ranges (theseus-ypnxt.9). A task you started with no profile asks
# route.v9 about its recent state at a loop boundary when it fails, stalls, changes phase or
# is about to report, and moves up to the class's profile (only Jev elevates) or back down
# to its own base after two agreeing verdicts, never below it. A task started with a profile
# is pinned. One verdict per min_loops_between loops; at most max_switches moves, and a step
# back down to the base is allowed past it. enabled = false turns it off; 0 is not "off".
[routing.task_checkpoints]
enabled = true
failing_streak = 3                      # loops in a row that each had a failed tool result
quiet_loops = 8                         # loops in a row with no progress signal
min_loops_between = 4                   # at most one verdict per this many loops
max_switches = 2                        # moves per task, up or down
# The coding floor (theseus-mn5dr; off, and it stays off until a benchmark arm shows it earns its
# cost): a routine_coding or deep_coding verdict under its bar normally routes nothing, so the turn
# runs on the session's own profile at that profile's effort. With a profile named here such a
# verdict holds that profile instead, at its own effort, and the route row says `floor`. A floor
# only lifts a session (a base as dear as it is left alone), stays inside the place's cap, never
# takes a profile of restricted origin, and keeps the cache rule for a switch. On the owner's
# benchmark trials the failing ones sat on the base profile 48% of the time against 9% of the
# solving ones, an association the hard tasks confound: the A/B is owed to the benchmarks after
# 1.0.4, and it flips the default only if the floor arm solves at least two more trials than its
# control across caffe-cifar-10, mteb-leaderboard and compile-compcert (k=3 each) at no more than
# one and a half times the cost per trial.
# [routing.coding_floor]
# profile = "sonnethi"                  # unset: off
# min_confidence = 0.30                 # the lowest verdict that holds it; the floor holds a coding verdict in [min_confidence, its class's bar), so with the default bars a 30% sure verdict lifts the session; above 0 and under a coding class's bar
# No China-origin model is named for chat, quick, sophisticated or review: Haiku 5.5 is two to
# three times cheaper per short turn and has no forced thinking, and review and judgment stay on
# Claude. A first-pass bug review by DeepSeek Flash is a later key (theseus-a1wvq.17), not yet here.
# Each task class's profiles, in order: the first usable wins. Empty: the session's own. A
# class's switch_confidence is its own bar; unset, it is the one above, except trivial's,
# 0.4: a wrong trivial call is cheap, since its detour carries a few exchanges for one turn.
# A verdict that comes after the wait applies to the next message alone, and a detour's (trivial,
# quick, run_tool, commentary) to none. A profile a class names that this config lacks is passed over. A
# session Jev moved up from its own profile goes back to it after two verdicts in a row
# whose class is its own profile or cheaper (chat, routine_coding); you moving it is yours.
# [routing.classes.trivial]
# profiles = ["haiku", "cheapest"]
# China-origin profiles, only for a request that carries open content; trivial only
# GLM-5.3 Flash serves here only as Haiku's fallback, for a request that carries open content
# cn_profiles = ["glm"]
# cn_after = "haiku"
# switch_confidence = 0.4
# [routing.classes.quick]                 # a quick question a short, direct answer settles
# profiles = ["haiku"]
# route.v9's two kinds (not the acting pack yet; the tables are read the day it is): both are
# detours, so a command run or a remark never moves the session's profile. A run_tool turn
# carries the place's real tools; a commentary one carries tools_find alone, as trivial does.
# No China-origin model is named for either: a run_tool turn reads tool output, which waits on
# the content screen (theseus-ouqru).
# [routing.classes.run_tool]              # a command, script or tool to run, its result reported
# profiles = ["haiku", "sonnet"]
# [routing.classes.commentary]            # a remark or aside that asks for nothing
# profiles = ["haiku"]
# [routing.classes.chat]                  # conversation building on the work: the session's own
# profiles = []
# [routing.classes.sophisticated]         # hard reasoning, and an open-ended comparison or "is it any good?" (route.v9)
# profiles = ["opushi", "opus", "sonnethi"]
# [routing.classes.deep_coding]
# profiles = ["opus", "sonnet"]
# Debugging with an unknown cause, and design, stay on Claude: vendor Terminal-Bench 4.0 has
# deepseek-flash at 42.3 against Sonnet 5.5's 70.6. The pair below is off by default and goes on
# together: `final` without `cn_draft` fails the load. It needs the DeepSeek key and a session
# directory that is a git tree; the draft runs no programs.
# cn_draft = "dsflashmax"               # a China-origin draft at max effort, in its own tree
# final = ["sonnethi", "opus"]          # a Claude profile reviews and fixes it before anything is applied
# [routing.classes.routine_coding]
# profiles = ["haikuhi", "sonnet"]
# DeepSeek Flash drafts routine coding, tests, mechanical refactors and planned features at about
# a sixth of Sonnet's cost per trial; Sonnet always reviews and fixes the draft before anything is
# applied. It needs the DeepSeek key and a session directory that is a git tree, and a session
# whose labels (`[content_based_security]` below) allow a China-origin model. The draft runs no programs; its
# reviewer runs the tests.
# cn_draft = "dsflash"                  # one China-origin profile, only on routine_coding and deep_coding
# final = ["sonnet"]                    # a Claude profile; the first usable one reviews
# first_pass = "dsflashmax"            # optional: a restricted-origin profile reads the draft's diff for bugs first; its findings go to the Claude review only
# [routing.classes.review]                # verification: "check this", a pre-merge review, "is this right?"
# profiles = ["opus", "sonnethi"]
# Your corrections (theseus-q31l): in a private place, "that should have been on fable",
# "use opus for that", "that needed more effort" or "rerun that on opus" labels the last
# turn's route judgment as yours and moves the session there at once; so does a reaction
# on a reply (Discord's ⬆️ and ⬇️) or the cockpit's control, and `theseus judge correct`.
# A later message close to a corrected one (its content words in common) runs where you
# said, ahead of the verdict, until another version of the route pack acts.
# [routing.corrections]
# enabled = true                        # off: words are messages, and the layer steers nothing
# similarity = 0.5                      # the share of content words a close message has in common
# max_entries = 64                      # the layer's bound, the oldest out
# Sensitive names (theseus-oejh3, theseus-gyjyo.4): organisations, clients, projects and people
# that mark your employer's work. An item that holds one (a message you send, a tool result, a
# file read, a page fetched) raises a `confidential` label on its session at the moment it
# enters, with the word as the label's source and no model call. That is all it does: the label
# is the one in `[content_based_security]` below, shown to you with its Remove button, read by
# `cn_models` like any other, and gone when you remove it. Nothing refuses a request for a name,
# so removing the label is the whole of your say. Jev's content pack is told the list too, as its
# private names. Matching is case-insensitive and on
# whole words, a name of several words as a run of them: `examplecorp` matches "ExampleCorp's
# plan" and "examplecorp-internal" and not "examplecorpse" or "examplecorpinc" (so `examplecorpinc`
# is listed for examplecorpinc.com), and `example-repo` matches as a unit, never the word
# "example". List each spelling you mean, `ExampleCo` and `Example Co` separately. This is the
# owner's own list of company and repository names (the owner, 2026-10-17): no pack's text may
# name one (theseus-judge's `the_pack_text_names_no_organisation` reads this line). A person's
# name goes in your own config only, never in the repository.
# [privacy]
# sensitive_names = ["examplecorp", "examplecorpinc", "example-repo"]
# open_source_paths = ["~/projects/example-open-source"]  # directories whose work is public; the classifier
#                                       # is told an item from there is (absolute or ~/ paths; an item
#                                       # that names paths counts only if every one is under a listed
#                                       # tree). NOT [places] public_paths below, which opens trees to
#                                       # a shared place's file tools. This one only tells the classifier
# redact_outbound = true                # the vault's values (and their base64, percent-encoded and
#                                       # JSON-escaped forms) are replaced by [redacted:<name>] on the
#                                       # copies that leave for a model, Discord or Jev: a request, a
#                                       # post, the Jev state, a push line. What is stored is never
#                                       # rewritten. false sends them as written; `theseus inspect`
#                                       # names the secrets a request carried either way

# Content-based security (theseus-9ymz0, theseus-gyjyo.2; this table was `[content]`, and the old
# name is an error that says where each key went): every item that enters a session — each
# message you send, each tool result, each page fetched and each file read — is classified once
# by Jev, and what it finds becomes a label on the session that survives compaction and restart.
# `secret`, `confidential` and `personal` disqualify a model of restricted origin for that
# session; `injection` means something tried to steer the assistant, and its session's calls
# that act are refused until you clear the label (`theseus content remove <session> injection`,
# or the button on the message). The injection question is never asked of your own messages. The
# sensitive-names list above and a Google result (`[google]`) raise `confidential` the same way, with no
# model call.
# Reading outside text holds nothing any more: `[policy] external_text` and `external_programs` were
# retired with the external-text hold, and a config that names either fails to load, naming this table.
# [content_based_security]
# session_flags = true                  # off: nothing is classified and no label is raised. A model
#                                       # of restricted origin then has no labels to follow, so
#                                       # cn_models must say what it does: "follow_flags" with this
#                                       # off refuses to start. Write "never" to keep those models
#                                       # off, or "always" to send to them without labels
# cn_models = "follow_flags"            # a request to a model of restricted origin: "always" sends it
#                                       # whatever the session carries, "follow_flags" refuses it
#                                       # when the session's labels disqualify it, "never" refuses
#                                       # it and routing skips such a profile altogether
# injection = "refuse"                  # or "notify": the label is raised and told, nothing is
#                                       # refused. A benchmark daemon sets this, so a trial
#                                       # never waits for you to tap a button
# wait_ms = 4000                        # how long a turn bound for a model of restricted origin
#                                       # waits for this session's outstanding content asks to
#                                       # land, so a label its own items earn is read before the
#                                       # request goes. It goes either way when the wait is up; a
#                                       # Claude turn never waits. 0 never waits
# max_pieces = 20                       # a long item is split at 6,000 characters a piece; this
#                                       # bounds how many are read. 20 fits the largest item that
#                                       # can exist (a 100,000-character file read) whole. Past the
#                                       # bound an item is read from the start and says `truncated`
# context = ""                          # one paragraph on what the assistant is and which of its
#                                       # work is public, given to the classifier as written (cut at
#                                       # 800 characters); empty says nothing

# ---------------------------------------------------------------- mcp
# MCP servers (M7 36b): only a server named here is started or reached, and
# its tools are offered to the model as mcp__<server>__<tool>, after the
# built-in tools, in private places only (a shared place never sees one).
# The gate names each tool mcp:<server>/<tool>, and its posture comes from
# the policy.mcp lines, then enforcement. A tool is run-class and never
# repeated unless you list it in read; a server's own hints are shown, and
# never loosen anything. Results are marked as outside text (external = false
# only for a server whose output is your own). A server starts after the
# daemon serves, never before; a restart offers the tools it listed last time
# at once, and a call waits for its own server alone. A crash restarts after
# 1 s, 5 s, then 30 s; a third crash within 10 minutes leaves it failed until
# `theseus mcp restart <name>`. `theseus mcp` lists the servers and tools.
# A changed tool (its name, schema, or description) is ledgered and noticed.
# [mcp.servers.github]                  # a server Theseus starts, over stdio
# command = ["github-mcp-server", "stdio"]   # its argv, run with no shell, in its own process group; stderr to <state>/mcp/github.log
# env = { GITHUB_PERSONAL_ACCESS_TOKEN = "github_token" }   # variable = [secrets] name; each call then runs at no looser a posture than the secret's
# read = ["get_issue", "list_pull_requests"]   # the tools you call read-class (default none)
# sandbox = "l0"                        # where it runs: l0 (default), or l1: below the sandbox's init, in the view a job gets
# external = true                       # its results are marked as outside text (default true)
# enabled = true                        # false keeps it configured and unstarted
# start_timeout_secs = 30               # the longest a start, and a call waiting for one, waits
# call_timeout_secs = 110               # the longest one call waits (at most 115, under the 120 s in-process deadline)
# [mcp.servers.wordcount]               # a server in L1: the workspace read-only, its writes scratch, no network unless listed
# command = ["wc-mcp", "--stdio"]
# sandbox = "l1"
# egress = ["api.wordlist.invalid:443"] # an L1 server's hosts, through its egress proxy, as [sandbox] egress for a job (default none)
# [mcp.servers.docs]                    # a remote server, over streamable HTTP
# url = "https://mcp.docs.invalid/mcp"
# auth_secret = "docs_mcp_token"        # a [secrets] name, sent as a bearer token

# ---------------------------------------------------------------- places
# Confidentiality: every place a session speaks in is private or shared (the place rule).
# Private: the CLI, the web UI, a DM with you, and a guild channel the bindings file binds
# with private = true. It gets everything. Shared: every other guild channel. It gets its own
# conversation, the tools whose results are public by nature (web_search, http_fetch,
# wake_at, task_create), the file tools only under public_paths, no proc_run and no AWS, and
# only the context files marked readers = "public". A task takes its parent's class. To put
# something of yours in a shared place, publish it there yourself: `theseus publish`, or
# /publish in a private place. Approvals follow the same rule: an answer to a call that waits,
# or to a budget question, counts only from a private place, by you; a shared place's cards
# go to your DM. The section's name before the place rule, labels, still reads.
# [places]
# owner = ["discord:271828182845904523"]   # who you are on Discord, beside the CLI and the web UI (default: the person of each DM the bindings file binds)
# public_paths = ["~/projects/some-public-repo"]   # trees a shared place's file tools reach (default none: no file tools there)

# ---------------------------------------------------------------- github
# The GitHub token is checked at startup: login, expiry, days left. Never fatal.
[github]
token_secret = "github_token"           # name of the [secrets] entry
warn_days = 30                          # warn when the token expires within this many days

# ---------------------------------------------------------------- telemetry
# OpenTelemetry export, in every build: nothing leaves the process until
# otlp_endpoint is set and the headers secret (if any) has resolved. It speaks OTLP/HTTP with the JSON encoding, which
# the OpenTelemetry Collector and most vendors accept. Each turn's trace becomes
# one OTel trace with the recorded timestamps, sent when the turn ends; the turn
# never waits for it. Metrics, cumulative, every metrics_interval_secs:
# theseus.turns, theseus.tokens, theseus.provider.errors, theseus.cost.usd,
# theseus.tool.calls, theseus.turn.duration_ms, theseus.provider.call.duration_ms,
# theseus.provider.first_token_ms. A failed export is retried once, then dropped
# and counted: `theseus health` says what was sent and dropped, and the last error.
[telemetry]
# otlp_endpoint = "http://127.0.0.1:4318"   # OTLP/HTTP base URL; /v1/traces and /v1/metrics are appended
# headers_secret = "otlp_headers"           # a [secrets] entry of "Header: value" lines, or "k=v,k2=v2" (e.g. x-honeycomb-team)
service_name = "theseus"
metrics_interval_secs = 15                  # how often the metrics are exported
export_timeout_secs = 10                    # each export's HTTP timeout
