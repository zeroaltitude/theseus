[package]
name = "theseus-sim"
description = "The simulator: a crash-and-recover harness for the store (real SIGKILL against a worker process, torn-tail injection, full-disk), the redb-vs-fjall benchmark, and the deterministic kernel simulator (virtual clock, seeded fault injection, crash inside every startup step)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "theseus-sim"
path = "src/main.rs"

[dependencies]
theseus-store.workspace = true
theseus-kernel.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rand = "0.9"
tempfile = "3"
crc32fast = "1"
