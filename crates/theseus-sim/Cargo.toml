[package]
name = "theseus-sim"
description = "The simulator: a crash-and-recover harness for the store (real SIGKILL against a worker process, torn-tail injection, full-disk) and the deterministic kernel simulator (virtual clock, seeded fault injection, crash inside every startup step)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The reader rule (theseus-wjy): its reader, or the roadmap re-cut's row that wires it in.
[package.metadata.theseus]
tool = "installed beside theseusd and theseus: the gate's lifecycle bench, the crash test, kernel-sim, and the fake Discord"

[[bin]]
name = "theseus-sim"
path = "src/main.rs"

[dependencies]
theseus-store.workspace = true
theseus-kernel.workspace = true
theseus-core.workspace = true
theseus-protocol.workspace = true
toml.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rand = "0.9"
tempfile = "3"
crc32fast = "1"
libc = "0.2"
# The gateway stand-in's WebSocket (theseus-6g62): the version, and the one
# feature, the web server's axum already builds.
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[dev-dependencies]
# The fakes' payloads are checked against the binding's own model types.
twilight-model = "0.17.1"

[lints]
workspace = true
