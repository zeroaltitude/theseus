# The reader rule (theseus-wjy): its reader, or the roadmap re-cut's row that wires it in.
[package.metadata.theseus]
reserved_for = "row 26 (21b), M4: the ontology's records, its snapshot, and the compile walk in theseus-core"

[dependencies]
hex = "0.4"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true

