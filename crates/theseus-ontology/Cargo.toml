[package]
name = "theseus-ontology"
description = "The fungible ontology's first slice (spec §4.1a): the kinds table and its validation, categories, guidance, memberships, and the compile walk's composition. Pure: no store, no labels, no policy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
