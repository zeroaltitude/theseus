# route.v10's test set (theseus-h66v4, design §4): the labelled cases `theseus judge replay --pack-file
# route.v10.toml --cases route.v10.cases.toml` asks the pack, and compares its `model`, `effort` and
# `context` answers to. 58 cases here; the design's sixty are these and W39 and W40, which are daemon tests
# (crates/theseusd/tests/route_owner.rs: a pin is not asked of Jev).
#
# L1 to L20 come from the owner's labels of 2026-10-26 (07:19 to 08:11), by the design's mapping rule (§4.1):
# `trivial` and `commentary` are haiku, low, short; `quick` is haiku, the label's effort, short; `run_tool` is
# haiku, low, full (a tool run needs the task's context); `chat` and `other` are sonnet, the label's effort,
# full; `routine_coding` is sonnet, the label's effort, full, but a one-line known edit is haiku;
# `sophisticated` and `review` are opus; `deep_coding` is sonnet; `leave` is `default`. Twenty of the
# thirty-eight are kept: the rest repeat a kind already covered. A person's name or a private detail in a
# label's message is left out of the message here, and the label is unchanged. W1 to W38 are written, each
# with the rule it tests.
#
# A case's state is what the daemon puts beside the message: `place` (`dm` or `channel`, which makes the state's
# `place_kind` `discord_dm` or `discord_channel`; a case may name `place_kind` itself: `job`, `task_brief`,
# `task_checkpoint`), `restricted_models` (`allowed` or `not_allowed`), `price_period` (`peak` or `off_peak`),
# `est_tokens`, `last_reply_model`, and `task_models` (every model that has written in the task). A field a
# case does not name takes the default below. `must` marks a case the pack must pass on every run.
#
# Fourteen cases are `must` (W1, W8, W9, W11, W14 to W18, W22, W26, W30, W31, W40); W40 is a daemon test, so
# thirteen are here. W26 and W27 (cyber and biology topics, Sonnet) rest on the ordinary rule only: the Fable
# block does not name them, by the owner's edit of 2026-10-29 22:46. A miss on either is a finding about the
# table's text, never a reason to edit the case.
pack = "route.v10"
derivation = "design §4.1 (L1 to L20, the owner's 2026-10-26 labels by the mapping rule) and §4.2 (W1 to W38)"

[defaults]
place = "dm"
restricted_models = "allowed"
price_period = "off_peak"
est_tokens = 40000
last_reply_model = "claude-sonnet-5-5"

