# split.v1 (SPLIT, theseus-z9mze.5): whether the work a message asks for divides
# by area. At `inbound`, in the batch beside classify and role (the one `inbound`
# state, so it rides their request and costs no call of its own), in shadow: it
# decides nothing and acts on nothing. The static fan-out cue (theseus-z9mze.4,
# `turn/route_step/fan_out_cue.rs`) still decides whether a turn is told it may
# fan out; this answer is logged beside that decision, a judgment row and a
# `fan_out.cue` row sharing the turn, so the two can be read against each other
# (the table in the row's report). It is promoted to replace the cue's word list
# only if that reading shows it beats the list in both directions at once, and
# that is a separate decision with its own owner ack.
#
# A pack of its own and not a question of the route pack: the route pack is
# versioned as one thing, adopted as one thing, and another row (theseus-gezlj)
# already holds `route.v9` for different wording. A question of a route version
# would have tied this measurement to that adoption, and asked in the route's
# own request would have answered after the verdict instead of with the batch.
#
# The instructions say "split" and not "divide": the loader refuses the word, as a request to
# compute (pack.rs, COMPUTATION), though it means no arithmetic here.
#
# Deliberately not in the question: any mention of helpers, tasks, cost or how
# many areas. Jev is asked a property of the work, not a recommendation about
# Theseus's machinery: a question that asks "should this fan out" bakes today's
# tool into a pack that outlives it.
id = "split"
version = 1
jev_model = "jev-1.13.0"
point = "inbound"
state = "inbound"
state_cap_tokens = 3000
sample = 1.0
baseline = "none"
action = "none"
description = "SPLIT: whether the work a message asks for divides cleanly into areas that several readers could each take on their own."

[questions.split]
type = "choice"
decides = false
instructions = "Would the work the person's new message asks for split cleanly into areas that several readers could each take on their own, at the same time, without needing each other's findings?"
act = 0.90
confirm = 0.60
no_match = "unclear"
options = [
  { id = "splits_by_area", means = "Yes: the work covers several parts that can be examined independently, such as several crates, directories, modules or concerns, and a reader given one part would need nothing from the others to do it. Auditing, reviewing or sweeping a whole codebase for a class of problem is the clearest case." },
  { id = "one_area", means = "No: the work is one thread, such as one file, one function, one bug whose cause is unknown, or one question, or its parts depend on each other so that splitting them would need the findings of one before another could start." },
  { id = "unclear", means = "The message gives too little to tell whether the work splits, such as a bare instruction that points at nothing." },
]
