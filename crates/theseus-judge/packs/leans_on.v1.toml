# leans_on.v1 (issue 44, the design's step 3b; `docs/design/release-card.md`): whether the owner's message in
# a place where he is NOT alone leans on something that was not said in that place. At `inbound`: asked off the
# turn's path, in a task of its own, after the turn's presence is known; the turn never waits on it and nothing it
# sends changes (`theseus-core`'s `judge/leans_on.rs`).
#
# WHAT IT READS, AND WHY SO LITTLE. Only what that place may already see: his message, whole, and the last lines
# said in that place's own conversation (who said each, as the place shows it). Nothing from any other place,
# nothing private, no memory, no recall: the question is asked FROM the place's point of view, so its state can
# hold nothing the place's own model is not already shown. Who wrote the message is not in the state either: the
# daemon asks only of messages the owner's mark proves are his, and another person's message is never asked.
#
# A NEW PACK, IN SHADOW. Not a version of an existing pack, and not live: `judge::WIRED` names it `Shadow`, the
# ladder's line for a new acting question (the design's §6: "a new acting question is promoted the way the build
# already requires, a frozen holdout of 200 labelled judgments, or the owner's forced promotion"). In shadow it is
# asked and recorded, a `judge.call` row scoped `judge:leans_on`, and nothing acts on its answer. Its labelled
# cases are `leans_on.v1.cases.toml`.
#
# The design's own words for the answers (§6, the owner's idea): nothing / what was just said / something earlier /
# a named thing / unclear. Here "something earlier" and "a named thing" are asked as one question about THIS
# place: is what it leans on said here, or not.
id = "leans_on"
version = 1
jev_model = "jev-1.13.0"
point = "inbound"
state = "leans_on"
state_cap_tokens = 3000
sample = 1.0
baseline = "none"
action = "none"
description = "LEANS ON: whether a message in a conversation leans on something that was not said in that conversation."

[questions.leans_on]
type = "choice"
instructions = "`message` is a person's new message in a conversation that other people can see. `here` is what was said in that conversation just before it, oldest first, each line with who said it. Read the message with only what is in `here`. Does the message lean on something it expects the reader to know, and if it does, was that thing said in `here`?"
act = 0.90
confirm = 0.60
no_match = "unclear"
options = [
  { id = "stands_alone", means = "The message needs nothing said before it to be understood: a general question, a greeting, a full request that names everything it is about, or a statement complete in itself." },
  { id = "said_here", means = "The message refers to something, such as \"that\", \"the plan\", \"what you said\" or a name, and the thing it refers to is in `here`: a reader of `here` alone knows what is meant." },
  { id = "not_said_here", means = "The message refers to something it expects the reader to know, such as \"what I told you\", \"the plan from earlier\", \"as we discussed\" or a name, and nothing in `here` is that thing: it must have been said somewhere else, or long ago." },
  { id = "unclear", means = "It cannot be told from the message and `here` whether the message refers to something earlier at all." },
]
