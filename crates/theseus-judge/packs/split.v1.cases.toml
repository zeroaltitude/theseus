# split.v1's test set (theseus-h66v4.6): the labelled cases `theseus judge replay --pack-file split.v1.toml
# --cases split.v1.cases.toml` asks the pack, and compares its `split` answer to. The labels are WRITTEN by the
# builder of theseus-h66v4.6, from the option wording, before the pack was run over them; none was changed after a
# run. S1 to S40 are the forty labelled asks of the fan-out cue's own test (`fan_out_cue.rs`, deleted with its word
# list in this row), kept verbatim as the set's core so the label that replaces the list is measured on the asks
# the list was: "splits_by_area" where the list fired, "one_area" where it stayed silent. Eight cases are
# route.v10.cases.toml's (the ids L12, W14, W8, W9, W7, W26, W28, L9), carried byte for byte, and S41 to S54 are new:
# four more that split, two single threads, and eight asks that name nothing (`unclear`).

pack = "split.v1"

[defaults]
place = "dm"
restricted_models = "allowed"
price_period = "off_peak"
est_tokens = 40000
last_reply_model = "claude-sonnet-5-5"
