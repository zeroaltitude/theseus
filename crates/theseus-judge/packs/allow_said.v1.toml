# allow_said.v1 (chat-acts-are-tools, S43-1): does the owner's latest message say to run the held
# call as it was first proposed?
#
# WHAT THIS IS, AND WHAT IT IS NOT. It is NOT the gate on the override. The gate is the model: the
# owner, 2026-11-13 23:32, "ultimately i'm ok with the model deciding once it has been guided about
# this -- even without it, openclaw has been very safe as has claude code. i'm cool with adding an
# additional layer of special case jev classification that would defense-in-depth this". So the tool
# `chat.allow_held_call` is offered only while a hold is open, its description states the held call
# and says the decision is the owner's, and the model calls it when his reply says to run it. This
# pack is the SECOND layer behind that choice, and it is asked after the model has already chosen.
#
# WHY IT FAILS OPEN. A judge that cannot be reached must not take a capability away from the owner.
# S17-D6 is his standing condition that he can always say "run what was originally suggested"; if an
# unreachable Jev could refuse that, a network fault would silently remove the one route past a
# safety hold. So no answer, a failed call, a skipped call or the pack off all leave the model's call
# STANDING, and the ledger row records that it was not judged. Only an answer BELOW the act band
# refuses, and the refusal is returned to the model as a reason it can read.
#
# WHAT IT READS. The owner's latest message whole, and the held call as he was offered it (its tool,
# its summary, its id), plus the other calls held in the same conversation so that "run the original"
# said while two are held can be seen for what it is. Nothing of the model's reasoning is in the
# state: the question is about the owner's words, and only his words can answer it.
id = "allow_said"
version = 1
jev_model = "jev-1.13.0"
point = "gate"
state = "allow_said"
state_cap_tokens = 1500
sample = 1.0
baseline = "none"
action = "none"
description = "ALLOW SAID: whether the owner's latest message says to run a held call as it was first proposed."

[questions.says_run]
type = "noul"
instructions = "A tool call was held because it could destroy something that nothing holds a copy of, and the assistant has judged that the operator's latest message tells it to run that call as it was first proposed, rather than a reshaped version. `message` is the operator's latest message, whole. `held_tool`, `held_summary` and `held_id` are the call that would run. `others_held` names the other calls held in the same conversation, if any. Does the operator's message say to run THIS held call as it was first proposed?"
act = 0.70
confirm = 0.50
when_true = "The message tells the assistant to go ahead with the call it already proposed: \"run the original\", \"it's OK to run what was originally suggested\", \"yes, do it the way you first said\", or the same instruction naming the tool, the target or the hold. An instruction that names this call among several held, or that names only this one, counts."
when_false = "The message does not say to run this call: it asks a question about it, agrees with something else, approves a different held call, asks for the reshaped version instead, takes the instruction back (\"not that one\", \"wait\", \"hold off\"), says nothing about any held call, or is ambiguous between two held calls so that which one is meant cannot be read from his words."
