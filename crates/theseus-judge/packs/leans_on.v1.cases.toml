# leans_on.v1's labelled cases (issue 44, step 3b). Invented, each a message in a conversation others can see and
# the lines that conversation shows before it. The labels were WRITTEN from the option wording before the pack was
# run over them. The traps the design names are here on purpose: a reference that IS satisfied in the place
# (`said_here`), a general question (`stands_alone`), and a message whose words look like a reference but name
# what they mean (`stands_alone`). "Another person's message" is not a case of the pack: the daemon never asks of a
# message the owner's mark does not prove is his (`theseus-core`'s `judge/leans_on.rs`, and its test).
#
# A test (`leans_on_cases`) reads every case: its label is one of the pack's options, and its state holds the
# message and the place's lines and nothing else. Measuring the pack's answers against the labels is a replay
# against Jev (`jev-probe`), the ladder's step before any promotion.

pack = "leans_on.v1"

[[case]]
id = "L1"
message = "go ahead with what I told you this morning"
here = [["person", "anyone around?"], ["assistant", "I'm here."]]
label = "not_said_here"
why = "names a thing told earlier; nothing in here is it"

[[case]]
id = "L2"
message = "use the plan from earlier"
here = [["person", "we need to fix the login page"], ["assistant", "Here is a plan: first reproduce it, then add a test, then fix the cookie path."], ["person", "sounds good"]]
label = "said_here"
why = "TRAP: the plan is in here, so the reference is satisfied in the place"

[[case]]
id = "L3"
message = "what is the capital of Portugal?"
here = []
label = "stands_alone"
why = "TRAP: a general question needs nothing said before it"

[[case]]
id = "L4"
message = "like we discussed, ship it on Friday"
here = [["person", "lunch?"], ["assistant", "I don't eat, but enjoy."]]
label = "not_said_here"
why = "'as we discussed' with nothing discussed here"

[[case]]
id = "L5"
message = "do that again"
here = [["person", "list the open pull requests"], ["assistant", "There are three open: one for docs, two for the parser."]]
label = "said_here"
why = "TRAP: 'that' is the listing just above"

[[case]]
id = "L6"
message = "send the numbers I gave you yesterday to the group"
here = [["assistant", "Done, the meeting is booked."]]
label = "not_said_here"
why = "the numbers were given somewhere else"

[[case]]
id = "L7"
message = "please summarise the release notes for version 2.0 in three lines"
here = [["person", "hi"]]
label = "stands_alone"
why = "a full request that names everything it is about"

[[case]]
id = "L8"
message = "good morning everyone"
here = []
label = "stands_alone"
why = "a greeting"

[[case]]
id = "L9"
message = "remember what I said about Halcyon? apply it here"
here = [["person", "let's review the budget sheet"], ["assistant", "Opening it now."]]
label = "not_said_here"
why = "a name with no referent in this place"

[[case]]
id = "L10"
message = "the second one"
here = [["assistant", "Two options: a nightly job, or a hook on every push."]]
label = "said_here"
why = "TRAP: 'the second one' points at the line just above"

[[case]]
id = "L11"
message = "and the other thing?"
here = [["person", "thanks for fixing the build"]]
label = "not_said_here"
why = "'the other thing' has no referent here"

[[case]]
id = "L12"
message = "ok"
here = []
label = "unclear"
why = "a bare acknowledgement with nothing before it: whether it answers anything cannot be told"

[[case]]
id = "L13"
message = "can you check whether the plan I mentioned to you privately is still on?"
here = [["person", "team, standup in five"]]
label = "not_said_here"
why = "says outright it was said elsewhere"

[[case]]
id = "L14"
message = "explain what a hash map is"
here = [["person", "the deploy failed again"], ["assistant", "It failed on the migration step."]]
label = "stands_alone"
why = "TRAP: a general question unrelated to the lines above"

[[case]]
id = "L15"
message = "update the Halcyon budget to match"
here = [["person", "Halcyon is the new office project; its budget is in the shared sheet"], ["person", "the vendor quote came in at 40k"]]
label = "said_here"
why = "TRAP: the name and what to match are both in here"

[[case]]
id = "L16"
message = "go with my earlier answer"
here = [["assistant", "Which colour should the banner be?"], ["person", "blue"], ["assistant", "And the font?"]]
label = "said_here"
why = "TRAP: his earlier answer ('blue') is in here"

[[case]]
id = "L17"
message = "\"as I said before, keep it under budget\" - can you hold me to that?"
here = [["person", "starting the quarter plan"]]
label = "stands_alone"
why = "TRAP (review): a quoted reference carries its own words; nothing outside the message is needed"

[[case]]
id = "L18"
message = "go back to what we settled last month about the vendor"
here = [["person", "morning"], ["assistant", "Morning."]]
label = "not_said_here"
why = "KNOWN LIMIT (review): said in this same place, but older than the lines shown, so the pack reads it as elsewhere and the look runs needlessly; a v2 would show the place's own older history or ask apart"
