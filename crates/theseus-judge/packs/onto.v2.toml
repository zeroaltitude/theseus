# onto.v2 (issue 46): onto.v1 with the questions that existed for the restricted-provider rule taken out, and nothing
# else changed. `personal_applies`, `personal`, `elicits`, `shows_people` and `shows_identifiers` fed only the private
# mark (`judge::onto::mark`, gone with them), which said what later requests could send to models outside an
# allowlist; `elicits` and `personal_applies` had no reader at all. Every other question is onto.v1's, field for field,
# and so are the bands, the state and the action. onto.v1 is retired (`packs/retired/onto.v1.toml`), its judgments read
# under its own text. It acts from the day it lands (`judge::onto::ONTO_PACK`, `judge::WIRED`).
# `image_subject` and `shows_screen_or_document` are still asked, unread: whether they become written labels or go is the owner's.
#
# What onto.v1 was, and onto.v2 still is: Jev files the session into the ontology as each message arrives (theseus-s1vkl
# / theseus-xzxqv; docs/design/jev-ontology-growth.md, sections 3.1 and 4.3). Same `inbound` state, so it rides the
# inbound batch and adds no call. A message with a picture carries it (theseus-und4g): the pictures ride in a top-level
# `assets` map and the state names each once, in its `images` field; code re-encodes each (`pic.rs`), and a 400 that
# names an image is retried once without them. For each interpreted kind, one Choice over the candidates code picked,
# `new` and `none`; `<kind>_name`, a Choice over the names code mined and `none`; and one `still_<kind>` Noul per
# membership the session holds. `kind_of_thing` is recorded for the sweep's kind proposals. Its bands are the design's:
# act at 0.80, confirm from 0.55 (`[ontology] act` and `confirm`). Jev never writes a name.
id = "onto"
version = 2
jev_model = "jev-1.13.0"
point = "inbound"
state = "inbound"
state_cap_tokens = 3000
sample = 1.0
baseline = "no_membership"
action = "none"
description = "ONTO: which categories of each interpreted kind (topic, project, event, resource, capability, expertise) a message files its session under, whether a new one is called for, and which mined name it takes."

[questions.topic]
type = "choice"
decides = true
instructions = "Which of the listed topic categories, if any, is the person's new message about?"
act = 0.80
confirm = 0.55
options_from = "topics"
only_when = "topics"
no_match = "none"
options = [
  { id = "none", means = "The message is about no topic that is listed, and names none that is new: it is too general or too brief to file." },
]

[questions.project]
type = "choice"
decides = true
instructions = "Which of the listed project categories, if any, is the person's new message about?"
act = 0.80
confirm = 0.55
options_from = "projects"
only_when = "projects"
no_match = "none"
options = [
  { id = "none", means = "The message is about no project that is listed, and names none that is new: it is too general or too brief to file." },
]

[questions.event]
type = "choice"
decides = true
instructions = "Which of the listed event categories, if any, is the person's new message about?"
act = 0.80
confirm = 0.55
options_from = "events"
only_when = "events"
no_match = "none"
options = [
  { id = "none", means = "The message is about no event that is listed, and names none that is new: it is too general or too brief to file." },
]

[questions.resource]
