[questions.kind_of_thing]
type = "choice"
instructions = "What kind of thing is the person's new message mostly about?"
act = 0.80
confirm = 0.55
options_from = "kinds"
only_when = "kinds"
no_match = "other"
options = [
  { id = "other", means = "It is mostly about something that none of the listed kinds describes." },
]

[questions.image_subject]
type = "choice"
instructions = "What is the picture in the state's `images` field mostly of, or the first one if there are several?"
act = 0.80
confirm = 0.55
only_when = "images"
no_match = "other"
options = [
  { id = "code", means = "A screenshot or photo of source code, a terminal, or a diff." },
  { id = "chart", means = "A chart, graph, plot or diagram of data or a system." },
  { id = "photo", means = "A photograph of a place, object, animal or person." },
  { id = "screenshot", means = "A screenshot of an application, a web page or a chat that is not mainly code." },
  { id = "document", means = "A page of a document, a form, a receipt, a slide or handwriting." },
  { id = "meme", means = "A meme, a joke image, a sticker or a reaction image." },
  { id = "other", means = "None of the other kinds describes it." },
]

[questions.shows_screen_or_document]
type = "noul"
instructions = "Does a picture in the state's `images` field show the contents of a screen or a document, such as a page, a form, a message thread or a dashboard?"
act = 0.80
confirm = 0.55
only_when = "images"
when_true = "It shows a screen's or a page's contents that someone could read."
when_false = "It shows no readable screen or page: it is a photo, a drawing or a plain chart."

