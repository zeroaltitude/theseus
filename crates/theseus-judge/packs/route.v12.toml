# route.v12 (issue 46): route.v11 with what nothing reads taken out, and nothing else changed. The two
# questions asked for the restricted-provider rule and the sealing of threads, `seal` and `personal`, are gone (no
# code read either answer), and so is the `on_path_p95` rollback rule, which no code could feed. The `model`
# question loses its two clauses about models "the state lists as not allowed": the daemon no longer writes
# `restricted_models` into the state, since no model is kept off a session for its origin. The description says
# what the pack still asks. Every other question, option, bar and rule is route.v11's, field for field; route.v11 is
# retired (`packs/retired/route.v11.toml`), its judgments read under its own text. It acts from the day it lands
# (`inbound::ROUTE_PACK`, `judge::WIRED`), the standing rule for a new compiled version in `docs/development.md`.
# The labelled cases are route.v10's file, read for this version (`route_cases::read_as`).
id = "route"
version = 12
jev_model = "jev-1.13.0"
point = "inbound"
state = "route"
state_cap_tokens = 3000
sample = 1.0
baseline = "session_profile"
action = "route"
description = "ROUTE: which model answers the person's new message; which specialist should answer."

[questions.model]
type = "choice"
decides = true
instructions = "Sonnet is the usual answer for most work, hard programming included; choose another model only for a reason its description gives. Quality decides first: a model whose description names the work beats a cheaper one that merely could do it. Among models that fit equally well, the cheaper one at this message's cost wins; when the state says `switch_cost = cheaper_to_stay`, a cheaper model is not cheaper for this message. When it says `cheaper_to_switch`, `cheaper_model` names every model cheaper than staying for this message, cheapest first, and is the only saving the state vouches for: a model it does not name may cost more than staying, however cheap that model is elsewhere. Of the models it names, the one whose description fits the work wins, not the first one listed. A cheaper model is cheaper only for work it should do — a one-line reply on a warm 200,000-token session is no Flash and no Haiku job, a crate-wide mechanical rename may be — so a name is a reason to switch only where that model's own description names this work, and otherwise price is no reason to move at all. When the state's task_models lists a China-origin model, the work is its: a checkpoint report of that work goes to Opus for review, whatever the work is, and a task that keeps failing on it goes to Sonnet. When a checkpoint says a task has stalled, read its loops for why: a stall from bad planning, strategy or tactics is worth a better model, and any other stall — waiting on input, waiting on an external job, a flake — is not, so the task stays on the model it is on. Which model should answer the person's new message?"
act = 0.90
confirm = 0.40
# The declared default is `parent`, and it is what the daemon runs: an answer under the
# 0.40 confirm bar leaves the turn on the model it is already on (theseus-ig13o; the owner,
# 2026-11-07 16:46, asked for exactly one word: "Parent"). It said `sonnet` until then, while
# `model::decide` stood on the turn's own profile, so the table a reviewer reads and the act
# a turn takes were two different rules and the pack's measured accuracy graded under-bar
# answers as Sonnet hits for a daemon that never routed that way.
no_match = "parent"
options = [
  { id = "haiku", means = "Haiku 5.5 (Anthropic, US). The fastest and cheapest: $0.10 in, $0.50 out, $0.01 a cache read per million tokens while the context is under 100K tokens, and five times each above it. Thinks adaptively; takes effort. For a greeting, a thank-you, a remark that asks for nothing, a short factual answer, a summary of what was just said, a tool-call turn — a command or tool to run and report — or a small edit whose cause is known. Mechanical, low-judgement work is Haiku's however long the material it runs over: summarizing or condensing a long stretch of session, reformatting, extracting in a given shape. What rules Haiku out is judgement, not length: not hard reasoning, a bug whose cause is unknown, or work whose point is deciding whether something is right." },
  { id = "sonnet", means = "Sonnet 5.5 (Anthropic, US). The usual choice: $2 in, $10 out, $0.20 a cache read per million. Thinks adaptively; its maker's default effort is high. For conversation about the work, explanations, planning, opinions, and nearly all programming, including hard or novel code and debugging a cause nobody knows. Choose it when unsure." },
  { id = "opus", means = "Opus 5.5 (Anthropic, US). Twice Sonnet's price: $4 in, $20 out, $0.20 a cache read per million. Always thinks; its maker's default effort is medium. For work whose point is judgement: reviewing or checking code, a plan or an argument for mistakes, or saying whether something is right or solid, however briefly or casually it is asked, even aloud; comparing things on their merits; system design, research and analysis with trade-offs; and reviewing work a China-origin model wrote before it is reported. At these the extra care is worth twice Sonnet's price. Not for programming itself, where Sonnet solves nearly as much for far less." },
  { id = "fable", means = "Fable 5.2 (Anthropic, US), the most capable: $8 in, $40 out, $0.20 a cache read per million. Always thinks. Only for the hardest design or reasoning problems, the kind that asks how a whole system should work: novel, spanning many parts, where a mistake would be costly; or where the person asks for the most thorough answer possible or tells it to think as hard as it can. Never for ordinary programming." },
  { id = "deepseek_flash", means = "DeepSeek V4.1 Flash (China-origin). $0.30 in, $1.20 out, $0.006 a cache read per million, and half of each when the state says price_period is off_peak. Thinks by default. Only for a bounded mechanical coding change in an existing repository whose plan is known (renames, repeated edits, writing tests, a fix with a known cause) on a long context, where a failed first pass is cheap to redo; a US model reviews what it writes before it is reported. Never for a program from scratch, terminal step-by-step work, design or review." },
  { id = "parent", means = "None of the models listed is the answer for this message: it stays on the model it is already running on, which for a task is the model its parent runs. The one option that names no model; it is also this question's no-match, so an answer under the bar runs it." },
]

# v5's own, carried through route.v9 word for word. Asked only when two or more personas may
# answer. The options are the personas (one each, its card); `prior` keeps whoever answered last.
# It decides nothing for the pack's promotion until its own holdout fills.
[questions.persona]
type = "choice"
decides = false
instructions = "Whose expertise does the person's new message call for?"
act = 0.90
confirm = 0.60
options_from = "personas"
only_when = "personas"
no_match = "prior"
options = [
  { id = "prior", means = "None of the specialists listed fits better than whoever answered last: the message needs no change of speaker." },
]

[[rollback]]
rule = "labels_per_day"
label = "wrong model"
count = 3

[[rollback]]
rule = "pins_per_day"      # the operator overriding Jev's model often is the clearest signal it chose wrong
count = 5
