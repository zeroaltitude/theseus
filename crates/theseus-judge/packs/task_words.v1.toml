# task_words.v1 (issue 44, the context design's §7 and the owner's decision 6): what does one message of the
# operator's, read alone, ask of the one task it addresses?
#
# WHY IT EXISTS. Decision 6: a change to the operator's task in his own current words applies without his card
# when it only narrows or pauses the task. The first build took the change's kind from the acting model's own
# label (`narrows`), and a review refused that as evidence: "also deploy it to production" sent as a narrowing
# widens the task. This pack is the independent reading the label is checked against. It is never the acting
# model's word, and nothing of the model's proposal is in its state: only the operator's message and the task
# as it stands, so a model that argued itself into a change cannot argue the judge into it too.
#
# WHEN IT IS ASKED. Only when `classify.v4`'s `addressed_task` names exactly one task for the message AND the
# message carries the operator's mark, in person (`theseus-core`'s `task_graph/judged.rs`). One message is asked
# about once.
#
# WHAT IT DECIDES, AND HOW IT STARTS. A new pack starts in shadow (m5-judgment §2.7): its answer is recorded,
# `task_graph/words.rs` records what it WOULD have done (a `task.change_proposed` row's `words.would`), and every
# change still goes to the operator's card. Only an operator's promotion makes it act, and then ONLY NARROWING:
# `restricts` at the act band, inside every other check of `words.rs`. A PAUSE STILL GOES TO THE CARD: `pauses` is
# asked and recorded, but `task.update` offers no pause, and the durable cardless pause path is not built.
# `resumes` is asked so a resume is never mistaken for something else, and it always keeps its card: a resume
# starts spending and acting again. Anything else, and any answer under the band, keeps the card.
id = "task_words"
version = 1
jev_model = "jev-1.13.0"
point = "gate"
state = "task_words"
state_cap_tokens = 1500
sample = 1.0
baseline = "none"
action = "none"
description = "TASK WORDS: whether one of the operator's messages, read alone, restricts, pauses or resumes the one task it addresses, or asks something else of it."

[questions.change]
type = "choice"
decides = true
instructions = "`message` is one message of the operator's, whole, and nothing else he or anyone said. `task_title`, `task_objective`, `task_acceptance` and `task_state` are the one task that message addresses, as it stands now. Read the message alone, as an instruction he is giving now about that task. Which one thing does it ask of the task?"
act = 0.85
confirm = 0.60
no_match = "other"
options = [
  { id = "restricts", means = "It narrows the task's scope and adds nothing: the task is to do less of what its objective already asks, such as only one of the places, files or parts the objective covers, or with a limit the objective already allows. Nothing new is asked, nothing is redirected, and the objective's aim stays the same." },
  { id = "pauses", means = "It tells the task to stop or hold for now, as an instruction he is giving now: \"pause it\", \"stop the deploy task for now\", \"hold off on that\". Not a question about pausing, not a stop he is quoting or forwarding from someone else, and not a request to keep going." },
  { id = "resumes", means = "It tells a held or paused task to carry on again, as an instruction he is giving now." },
  { id = "other", means = "Anything else: it widens the task or adds work to it (even beside a narrowing), redirects or replaces its aim, asks a question about it, quotes or forwards someone else's instruction, says to keep going or not to stop, talks about something other than this task, or is too short or unclear to tell which." },
]
