# work.v1's test set (theseus-h66v4.6): the labelled cases `theseus judge replay --pack-file work.v1.toml
# --cases work.v1.cases.toml` asks the pack, and compares its `work` answer to. The labels are WRITTEN by
# the builder of theseus-h66v4.6, from the option wording alone and BEFORE the pack was ever run over them;
# none was changed after a run (a bar is a finding, never a reason to edit a case). Where a message is one of
# route.v10.cases.toml's (ids L1 to L20, W1 to W43), it is carried from that file byte for byte, so the two
# sets agree about the same message (a test holds them to it); the K-ids are new, written to cover what the
# 61 lack (writing, review, a plain research or design ask, a tool run, a live task). A case whose kind the
# builder could not name with confidence was left out: a set tests the wording, not the ambiguity.
# `work` is what the reply is mostly FOR: coding, research_or_design, writing, conversation, tool_run or review.

pack = "work.v1"

[defaults]
place = "dm"
restricted_models = "allowed"
price_period = "off_peak"
est_tokens = 40000
last_reply_model = "claude-sonnet-5-5"
switch_cost = "cheaper_to_switch"

