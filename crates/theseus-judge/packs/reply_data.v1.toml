# reply_data.v1 (REPLY DATA, theseus-a1wvq.15): route.v7's `data` question, asked of one
# reply Theseus wrote instead of a person's message. In the owner's DM an open run
# (the messages a China-origin model may carry) includes Theseus's own replies
# when Jev judges each one open at the act band, the same test a person's message
# gets (the owner, 2026-10-17, Q5). Asked off the turn's path, after the reply is
# written and only in a session whose open run ends just before it; any other
# answer, a late or missing one, a refused reservation or a failed call ends the
# run. The state is the inbound state (the reply stands in `message`, the
# operator's `data_names` as route.v7 has them); the question's choices are
# route.v7's word for word but for the subject ("the person's new message", "the
# message" -> "this reply"). It decides nothing for the pack's promotion, and no
# rule rolls it back: it only ever keeps a run open on a sure `open`.
id = "reply_data"
version = 1
jev_model = "jev-1.13.0"
point = "inbound"
state = "inbound"
state_cap_tokens = 3000
sample = 1.0
baseline = "none"
action = "none"
description = "REPLY DATA: whether what one of the assistant's own replies carries may be shared with an outside model provider that must never see private matter (open, private or unclear)."

[questions.data]
type = "choice"
decides = false
instructions = "Judged by what this reply of the assistant and its context carry, not by the place it is sent to (a private place says who sees the conversation, not that its matter is private), may it be shared with an outside model provider that must never see private matter?"
act = 0.90
confirm = 0.60
no_match = "unclear"
options = [
  { id = "open", means = "Yes: general knowledge or public matter, such as a general question, a self-contained exercise in programming, mathematics or science, or work on open-source software or on a project the state lists as open, with no sign of anything personal, private, confidential or secret in it." },
  { id = "private", means = "No: it shows private matter: a company's or organisation's non-public plans, people, customers, partners, code or data; anything the state lists as private; a person's own family, health, money or legal matters; anything confidential, under embargo or not yet public, such as an unfixed vulnerability; another person's personal data; or the value of a credential, key, token or password itself." },
  { id = "unclear", means = "The reply gives too little to tell, such as work on files or code whose owner it does not show, or it mixes open and private matter." },
]
