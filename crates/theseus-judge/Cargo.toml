[package]
name = "theseus-judge"
description = "Judgments with TypeSafe Jev (spec §3.7, M5): the typed client, the three-band gate, capped states, batching, the circuit breaker, versioned question packs, the learning math, and a fake Jev. No kernel, store, or core types: the core maps its own onto the plain inputs here."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# A fake Jev on 127.0.0.1 for other crates' tests and the simulator. The
# crate's own unit tests always have it. It also exports `names::OLD` (the old
# names' digests) for other crates' tests.
fake = []
# The retired pack files (`pack::retired`, issue 44), for other crates' tests:
# enabled only through dev-dependencies, never by a crate a release builds.
retired-packs = []
# The `jev-probe` binary: real calls with a key from the environment.
probe = ["fake", "dep:clap"]

[[bin]]
name = "jev-probe"
path = "src/bin/jev-probe.rs"
required-features = ["probe"]

[[bin]]
name = "theseus-judge"
path = "src/bin/theseus-judge.rs"

[dependencies]
gix = { version = "0.88.0", default-features = false, features = ["revision", "sha1"] }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
futures-util.workspace = true
reqwest.workspace = true
zeroize.workspace = true
uuid.workspace = true
sha2 = "0.10"
hex = "0.4"
# Images for onto.v1 (theseus-und4g): decode, rotate upright, resize, re-encode. PNG and JPEG only, no default
# features, so no other codec comes in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64.workspace = true
clap = { workspace = true, optional = true }

[dev-dependencies]
# The builders' cost is timed by this thread's CPU time (builders.rs tests), as theseus-core's tests time theirs.
libc = "0.2"

[lints]
workspace = true
