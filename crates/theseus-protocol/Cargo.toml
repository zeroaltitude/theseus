[package]
name = "theseus-protocol"
description = "Wire types for the Theseus protocol: JSON-RPC 2.0 over newline-delimited JSON. Types only, no runtime."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

# The web apps' protocol types are generated from these (theseus-0g4): `src/ts.rs`.
# A dev-dependency only, so no binary links it.
[dev-dependencies]
ts-rs = { version = "12", features = ["no-serde-warnings"] }

[lints]
workspace = true
