[package]
name = "theseus"
description = "The Theseus CLI: a thin protocol client for shells and pipelines, and its library (client, render), which the TUI shares. Links the protocol crate only."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# What the CLI and the TUI share (theseus-7yx, step 10a): the connection
# (`client`) and the renderers (`render`), used as `theseus_client::…`. A
# library named `theseus`, like the binary, collides with it in `cargo doc
# --bins` (cargo#6313).
[lib]
name = "theseus_client"
path = "src/lib.rs"

[[bin]]
name = "theseus"
path = "src/main.rs"

[dependencies]
theseus-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# SIGPIPE back to its default so `theseus history | head` ends quietly.
libc = "0.2"
# Times on this machine's clock in human output (theseus-0n1v): the zone, read
# when a time is printed. Already in the lock through the TUI and the kernel.
jiff = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
