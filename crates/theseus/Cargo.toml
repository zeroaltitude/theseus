[package]
name = "theseus"
description = "The Theseus CLI: a thin protocol client for shells and pipelines. Links the protocol crate only."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "theseus"
path = "src/main.rs"

[dependencies]
theseus-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
shellexpand.workspace = true
# SIGPIPE back to its default so `theseus history | head` ends quietly.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
