[package]
name = "theseus-tools"
description = "Toollets (spec §3.23): small typed in-process Rust tools behind one contract — fs.*, text.*, git.*, and proc.run's job spec. Typed input, structured output, no shell parsing, no PATH dependence."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
theseus-protocol.workspace = true
anyhow.workspace = true
diffy = "0.5.2"
gix = { version = "0.88.0", default-features = false, features = ["revision", "sha1"] }
globset = "0.4.20"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
regex = "1.13.1"
serde.workspace = true
serde_json.workspace = true
similar = "3.2.0"

[dev-dependencies]
tempfile = "3"
