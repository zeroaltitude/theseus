# Theseus bindings (spec P5, "bindings as a file"): the Discord places Theseus
# lives in, and who may drive it there. One guild; text channels (M3 plans one)
# and direct messages. Ids are Discord snowflakes written as strings (Discord:
# User Settings > Advanced > Developer Mode, then right-click > Copy ID).
#
# Everyone listed acts as the operator: this says who may start turns and press
# Approve, not a separate permission model (that arrives with roles). Messages
# from anyone else are ignored and counted in health. Read at startup; restart
# theseusd after editing. The file's digest is the binding revision.

guild_id = "000000000000000000"
# private = true                   # the whole guild is yours: every [[channel]] below is private unless it
                                   # says private = false, and who can view one is not read. Keep this line
                                   # here, above the first [[channel]]: written below one, it is that one's
                                   # own private, and the guild stays untrusted

[[channel]]
id = "000000000000000000"          # a text channel in that guild
name = "theseus"                   # a label for health, the web UI, and the session
users = ["000000000000000000"]     # who may drive turns and press Approve here
mention_only = true                # answer only when @mentioned or replied to; false for a channel of its own
# private = false                  # true: only you can view it, so it gets everything, as your DM does.
                                   # false (shared): its own conversation, the public tools, files only
                                   # under [places] public_paths, no proc_run or AWS. Absent: the guild's
                                   # word above, so shared unless the guild is private
voice = false                      # true for a voice channel: /join from a private place brings Theseus
                                   # into it ([voice] in the config); only its users are heard, and its
                                   # text chat is this place's text

[[dm]]
user = "000000000000000000"        # who may talk to Theseus in direct messages
name = "eddie"
