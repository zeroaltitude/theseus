[package]
name = "theseus-discord"
description = "The Discord binding: one guild, a DM and one text channel, driven as a protocol client of the core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
theseus-core.workspace = true
theseus-kernel.workspace = true
theseus-protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest.workspace = true
shellexpand.workspace = true
sha2 = "0.10"
hex = "0.4"
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots", "twilight-http"] }
twilight-http = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots"] }
twilight-model = "0.17.1"
twilight-util = { version = "0.17.0", features = ["builder", "permission-calculator"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tempfile = "3"
theseus-sim = { path = "../theseus-sim" }

[lints]
workspace = true
