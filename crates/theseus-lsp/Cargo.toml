[package]
name = "theseus-lsp"
description = "The Language Server Protocol, written by hand: a client over a server's stdin and stdout (framing, routing, document sync, diagnostics pushed and pulled, navigation, rename's edit, the stop), the position helper the tools address by, and a scripted fake server for tests. The protocol alone, with no core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "theseus-lsp-fake"
path = "src/bin/theseus-lsp-fake.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
libc = "0.2"
url = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
