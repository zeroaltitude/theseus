[package]
name = "theseus-exam"
description = "M6's memory exam (steps 34a, 34b): items whose success needs something from an earlier session, a fixture writer that puts their past into a scratch store, the check language that scores an answer, the paired statistics, and the driver over the real recall pipeline: one scratch daemon per arm (`none`, `bm25`, `baseline`), and the oracle's note."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The reader rule (theseus-wjy): a tool, a binary of its own. It is the one tool no install ships (scripts/build.sh's
# `shipped`), so it says why (theseus-g7qp).
[package.metadata.theseus]
tool = "run by hand beside theseusd: M6's memory exam, which starts one scratch daemon per `[memory] arm` and writes the report (step 34b)"
run_from_tree = "the exam is a measurement, not a part of a running Theseus: whoever runs it builds it from a checkout (`cargo run -p theseus-exam`), so an install never copies it"

[[bin]]
name = "theseus-exam"
path = "src/main.rs"

[dependencies]
theseus-core.workspace = true
theseus-kernel.workspace = true
theseus-memory = { path = "../theseus-memory" }
theseus-protocol.workspace = true
theseus-store.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex = "1.13.1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
