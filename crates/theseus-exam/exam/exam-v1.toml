# M6's memory exam, version 1 (step 34a; design §2.9).
#
# Synthetic, modelled on the kinds of knowledge in our refs for Theseus: the
# gotchas a builder must remember. Every fact here is invented for the exam,
# in one consistent world, because every item's past is written into one
# store and a retrieval arm (34b) searches all of it. People: eddie (the
# operator) and rowan (a guild member). Times are MST.
#
# Families (§2.9's categories), four items each, two held out: never used to
# tune a threshold or a word. `gold` is what the oracle arm shows: exactly the
# past nodes the task needs. A family whose trap is something recall must NOT
# show (private, injection, distractor) keeps the trap in the store and out of
# the gold, so in 34a it measures its fact's headroom, and its `lacks` lines
# wait for 34b's arms.
#
# Versions (a change is a new version; reports name the digest that scored):
# - exam-v1 (sha256:3992df03…8407a30): the headroom run of 2026-09-30.
# - exam-v1.1: preference-1's check no longer fails a reply that names the
#   rule it follows ("a bare name, no `theseus-` prefix"): it fails only a
#   prefixed name. A tuning-half item; no held-out item changed.

version = "exam-v1.1"
utc_offset_min = -420

