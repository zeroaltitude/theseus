[[item]]
id = "episode-4"
family = "episode"
held_out = true
task = "My cleanup script runs `pkill -f theseusd-scratch`, and it kills the script itself. How do I fix it?"
gold = ["a.2", "a.3"]
check = '''
reply has "[t]heseusd"
'''
[[item.session]]
key = "a"
place = "cli"
[[item.session.node]]
at = "2026-09-15 16:30"
who = "eddie"
text = "Clean up the scratch daemons."
[[item.session.node]]
at = "2026-09-15 16:30"
who = "tool"
tool = "proc.run"
input = '{"argv": ["bash", "-c", "pkill -f theseusd-scratch; echo cleaned"]}'
status = "error"
text = "Terminated\n(exit 143)"
[[item.session.node]]
at = "2026-09-15 16:33"
who = "theseus"
text = "pkill -f matched its own shell, whose command line contains the pattern. A bracket fixes it, since the pattern no longer matches its own text: pkill -f '[t]heseusd-scratch'."

