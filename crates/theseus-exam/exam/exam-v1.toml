# ---------------------------------------------------------------- episode

[[item]]
id = "episode-1"
family = "episode"
task = "Starting the scratch daemon right after `theseus shutdown` fails with \"Database already open. Cannot acquire lock.\" What do I do?"
gold = ["a.2", "a.3"]
note = "Other fixes work too; the item asks for the one that worked before."
check = '''
reply has "tail --pid" | "--pid="
'''
[[item.session]]
key = "a"
place = "cli"
[[item.session.node]]
at = "2026-09-17 14:20"
who = "eddie"
text = "Start the scratch daemon again."
[[item.session.node]]
at = "2026-09-17 14:20"
who = "tool"
tool = "proc.run"
input = '{"argv": ["theseusd", "--config", "/tmp/theseus-x/config.toml", "--state-dir", "/tmp/theseus-x/state"]}'
status = "error"
text = "Error: Database already open. Cannot acquire lock.\n(exit 1)"
[[item.session.node]]
at = "2026-09-17 14:22"
who = "theseus"
text = "The old daemon was still closing its store: `theseus shutdown` answers before the process exits. Waiting on its pid first fixed it: `timeout 15 tail --pid=$PID -f /dev/null`, then the start. It's serving."

[[item]]
id = "episode-2"
family = "episode"
task = "My worktree build of theseusd keeps producing a binary without my change. What's going on, and what's the fix?"
gold = ["a.2"]
check = '''
reply has "cargo_target_dir"
'''
[[item.session]]
key = "a"
place = "discord DM"
[[item.session.node]]
at = "2026-09-22 20:15"
who = "eddie"
text = "The worktree build of theseusd still doesn't have my change. strings on the binary shows the old version string."
[[item.session.node]]
at = "2026-09-22 20:31"
who = "theseus"
text = "Found it: the worktree shared target/ with the main tree, and cargo's fingerprint for a workspace member leaves out its path, so the main tree's artifacts looked fresh. Giving the worktree its own CARGO_TARGET_DIR fixed it; the rebuilt binary has your change."

