# ---------------------------------------------------------------- the background
# About two hundred sessions no item owns: the world's daily traffic, from
# March to September. They name the items' subsystems (the gate, the board,
# the Observatory, the scratch daemons, the Discord bot, spend) and never an
# item's value: the exam's load checks every hard item's answer against them.

