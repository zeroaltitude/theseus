# M6's memory exam, version 2 (theseus-zaz.11; design §2.9).
#
# Why: exam-v1 measured memory's headroom (34a: +74 points), but it cannot
# tell plain keyword search from the oracle. BM25 put all the gold in its top
# 6 for 33 of exam-v1's 36 items that need the past, because each task shares
# its past's words. exam-v2 adds items that make retrieval hard, so 34b's arms
# can separate the steps M6 holds (29c vectors, 32c rerank, 32a FSRS, 32b
# activation, 31b synthesis) from BM25 alone.
#
# What it holds:
# - exam-v1.2's ten families, word for word (38 items), with the two items
#   34a flagged replaced: needs-nothing-3 (ambiguous for an agent with tools)
#   by needs-nothing-5, and injection-1 (a fact GLM already knew) by
#   injection-5. Both replacements stay in their halves.
# - Four hard families, eight items each, four held out:
#   - paraphrase: the task names a thing its past described in other words.
#     The task and each gold node share no content word, even stemmed
#     (checked when the exam loads).
#   - scale: the gold is one statement among many near-duplicates: sessions
#     about the same thing that never give the value, and siblings that give
#     other things' values. The near-duplicates come in doses of 8, 16, 32,
#     and 64 sessions, one tuning and one held-out item at each.
#   - time: the same fact stated, restated, and corrected across months. The
#     terse restatements of the old values outnumber the correction, which is
#     phrased as a change. The current value is stated only in the gold.
#   - tool_output: the fact lived only in a tool's result; the agent's reply
#     never restated it.
#   In all four, the answer appears in no node outside the gold, anywhere in
#   the store (checked when the exam loads).
# - A background of about two hundred sessions that no item owns: the daily
#   traffic of the same world (gates, reviews, boards, restarts, costs), from
#   March to September 2026. It names the same subsystems as the items and
#   never their values.
#
# The past spans March to September 2026: hundreds of sessions, generated
# from templates and seeds ([[item.generate]], [[background]]; see
# generate.rs). The expansion is a function of this file alone, so its digest
# covers every generated session.
#
# The world: eddie is the operator; rowan, wren, and marlow are guild members.
# heron is the build host and kestrel the tower that runs the nightly work;
# plover, dunlin, tern, and avocet are other boxes. brindle is another project,
# invented (exam-v1 named a real one until v1.2). Every fact is invented for
# the exam and agrees with exam-v1's. Times are MST.
#
# Halves: the hard families' items were written before the lexical probe ran
# on them, and no held-out item changed after it ran.

version = "exam-v2"
utc_offset_min = -420

