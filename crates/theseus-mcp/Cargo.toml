[package]
name = "theseus-mcp"
description = "The Model Context Protocol, written by hand: a client over stdio and streamable HTTP, a fake server for tests and the simulator, and Theseus's own MCP server on loopback. The protocol alone, with no core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The reader rule (theseus-wjy): the client side's readers are theseus-core's
# MCP board and theseus-sim's fake-mcp (36b), so the crate is no longer
# reserved. The server side (feature `server`) waits for row 72 (41b), M7:
# Theseus's own MCP server on loopback; nothing builds it outside this crate's
# own tests and example until then. The core takes the crate with its default
# features, so the shipped binaries build what the workspace builds (the gate's
# features phase); the sim takes it with `default-features = false`.

[features]
default = ["server"]
# Theseus's own MCP server (`server`, step 41), on axum. The core's client
# side (36b) can leave it out with `default-features = false`.
server = ["dep:axum", "dep:sha2", "dep:rand"]

[[bin]]
name = "theseus-mcp-fake"
path = "src/bin/theseus-mcp-fake.rs"

[[test]]
name = "server"
required-features = ["server"]

[[example]]
name = "server"
required-features = ["server"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
reqwest.workspace = true
tracing.workspace = true
thiserror.workspace = true
libc = "0.2"
axum = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
