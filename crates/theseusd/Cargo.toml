[package]
name = "theseusd"
description = "The Theseus server: the kernel behind the protocol, on stdio or a Unix socket."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "theseusd"
path = "src/main.rs"

[[test]]
name = "jail_stop"
harness = false

[dependencies]
theseus-core.workspace = true
theseus-protocol.workspace = true
theseus-files.workspace = true
theseus-kernel.workspace = true
theseus-sandbox.workspace = true
theseus-discord.workspace = true
theseus-mcp = { path = "../theseus-mcp" }
theseus-store.workspace = true
anyhow.workspace = true
clap.workspace = true
libc = "0.2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
# `deterministic-timestamps`: the embedded files carry no modification time, so two builds of one commit embed the same
# bytes (theseus-goa8; review 2's SC3; scripts/repro.sh).
rust-embed = { version = "8", features = ["include-exclude", "deterministic-timestamps"] }
mime_guess = "2"
# The cockpit is embedded as brotli copies (theseus-rwpbg.5, theseus-o2myi); a client that does not take brotli is sent
# the copy decoded. The same version as theseus-files' PDF reader brings, so the binary links one decoder.
brotli-decompressor = { version = "5", default-features = false, features = ["std"] }
futures-util.workspace = true

[dev-dependencies]
tempfile = "3"
theseus-sim = { path = "../theseus-sim" }
# The fake Jev, for the judge's daemon test (M5 23a).
theseus-judge = { path = "../theseus-judge", features = ["fake"] }

[lints]
workspace = true
