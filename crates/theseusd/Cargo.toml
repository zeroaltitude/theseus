[package]
name = "theseusd"
description = "The Theseus server: the kernel behind the protocol, on stdio or a Unix socket."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "theseusd"
path = "src/main.rs"

[dependencies]
theseus-core.workspace = true
theseus-protocol.workspace = true
theseus-kernel.workspace = true
theseus-discord.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
futures-util.workspace = true

[dev-dependencies]
tempfile = "3"

[features]
# OTLP export (spec §3.20): `cargo build --release -p theseusd --features otel`.
otel = ["theseus-core/otel"]

[lints]
workspace = true
