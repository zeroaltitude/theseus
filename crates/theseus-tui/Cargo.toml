[package]
name = "theseus-tui"
description = "The Theseus terminal UI (design stage2 §2.9): every session's state in one sidebar, the attention queue, inline answers, a session's history and its input line. A protocol client: it links the protocol crate and the CLI's client library, never the core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The reader rule (theseus-wjy): an installed binary of its own, which
# `theseus tui` execs (row 15, 10f), and so a reader of its own.
[package.metadata.theseus]
tool = "installed beside theseus, which execs it as `theseus tui`: the terminal UI"

[[bin]]
name = "theseus-tui"
path = "src/main.rs"

[dependencies]
theseus-protocol.workspace = true
# The CLI's library, `theseus_client`: the connection and the renderers.
theseus = { path = "../theseus" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Only what the TUI draws with: the crossterm backend and the layout cache;
# not the calendar widget, the macros, or underline colors.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
# The same 0.29 that ratatui's backend uses: its events and its terminal modes.
crossterm = "0.29"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
# The paused clock of the `start_paused` tests, so `cargo test -p theseus-tui` builds
# alone, not only through the workspace's feature unification.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
