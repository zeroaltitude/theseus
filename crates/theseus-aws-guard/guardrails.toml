    "iam:CreateOpenIDConnectProvider", "iam:CreateSAMLProvider", "iam:UpdateOpenIDConnectProviderThumbprint",
    "iam:AddClientIDToOpenIDConnectProvider", "iam:UpdateSAMLProvider",
]
scp = "deny-except-deployer"
[[guardrail.template]]
types = ["AWS::IAM::OIDCProvider", "AWS::IAM::SAMLProvider"]

# ---------------------------------------------------------------------------------------------
# The budget

[[guardrail]]
name = "budget-change"
limit = "budget"
summary = "creating, changing, or deleting a budget, its notifications, or its actions"
operations = [
    "budgets:CreateBudget", "budgets:UpdateBudget", "budgets:DeleteBudget", "budgets:CreateNotification",
    "budgets:UpdateNotification", "budgets:DeleteNotification", "budgets:CreateSubscriber",
    "budgets:UpdateSubscriber", "budgets:DeleteSubscriber", "budgets:CreateBudgetAction",
    "budgets:UpdateBudgetAction", "budgets:DeleteBudgetAction",
]
iam = ["budgets:ModifyBudget", "budgets:CreateBudgetAction", "budgets:UpdateBudgetAction", "budgets:DeleteBudgetAction"]
scp = "deny-except-deployer"
note = "The budget lives in the foundation stack. The core's reconcile of the amount is not a model call, and does not ask."
[[guardrail.change]]
types = ["AWS::Budgets::Budget", "AWS::Budgets::BudgetsAction"]

[[guardrail]]
name = "budget-stop-lift"
limit = "budget"
summary = "executing the budget's action, which can reverse the AWS-side stop"
operations = ["budgets:ExecuteBudgetAction"]
direct = true
scp = "deny"
note = "Budgets attached the stop outside any stack, so only a direct call lifts it."

[[guardrail]]
name = "budget-stop-detach"
limit = "budget"
summary = "detaching theseus-deny-spend, the budget's stop"
operations = ["iam:DetachRolePolicy"]
direct = true
scp = "deny"
[guardrail.when]
matches = { PolicyArn = "arn:*:iam::*:policy/theseus-deny-spend" }
[guardrail.iam_condition]
ArnLike = { "iam:PolicyARN" = "arn:aws:iam::*:policy/theseus-deny-spend" }

[[guardrail]]
name = "organizations"
limit = "budget"
summary = "a change to the account's Organization: joining, leaving, creating one, or its policies"
operations = [
    "organizations:AcceptHandshake", "organizations:AttachPolicy", "organizations:CancelHandshake",
    "organizations:CloseAccount", "organizations:CreateAccount", "organizations:CreateGovCloudAccount",
    "organizations:CreateOrganization", "organizations:CreateOrganizationalUnit", "organizations:CreatePolicy",
    "organizations:DeclineHandshake", "organizations:DeleteOrganization", "organizations:DeleteOrganizationalUnit",
    "organizations:DeletePolicy", "organizations:DeleteResourcePolicy", "organizations:DeregisterDelegatedAdministrator",
    "organizations:DetachPolicy", "organizations:DisableAWSServiceAccess", "organizations:DisablePolicyType",
    "organizations:EnableAWSServiceAccess", "organizations:EnableAllFeatures", "organizations:EnablePolicyType",
    "organizations:InviteAccountToOrganization", "organizations:LeaveOrganization", "organizations:MoveAccount",
    "organizations:PutResourcePolicy", "organizations:RegisterDelegatedAdministrator",
    "organizations:RemoveAccountFromOrganization", "organizations:TagResource", "organizations:UntagResource",
    "organizations:UpdateOrganizationalUnit", "organizations:UpdatePolicy",
]
iam = ["organizations:CreateOrganization", "organizations:AcceptHandshake", "organizations:LeaveOrganization"]
direct = true
scp = "deny"
note = "An Organization is Eddie's to hold: Theseus never makes, joins, or leaves one. AWS-side only those three need denying: a member account can make no other change, and without CreateOrganization the account never becomes a management account."

[[guardrail]]
name = "account-contacts"
limit = "budget"
summary = "the account's contacts, where AWS sends billing, operations, and security notices"
operations = ["account:PutAlternateContact", "account:DeleteAlternateContact", "account:PutContactInformation"]
direct = true
scp = "deny"

# ---------------------------------------------------------------------------------------------
# The guards' own integrity

[[guardrail]]
name = "guard-policies"
limit = "guard"
summary = "editing or deleting the guards, the boundary, allow-all, or the budget's stop policy"
operations = ["iam:CreatePolicyVersion", "iam:SetDefaultPolicyVersion", "iam:DeletePolicy", "iam:DeletePolicyVersion"]
resources = [
    "arn:aws:iam::*:policy/theseus-guard-*", "arn:aws:iam::*:policy/theseus-boundary",
    "arn:aws:iam::*:policy/theseus-allow-all", "arn:aws:iam::*:policy/theseus-deny-spend",
]
scp = "deny-except-deployer"
note = "The foundation stack owns them; only its change sets edit them."
[guardrail.when]
matches = { PolicyArn = ["*:policy/theseus-guard-*", "*:policy/theseus-boundary", "*:policy/theseus-allow-all", "*:policy/theseus-deny-spend"] }
[[guardrail.change]]
types = ["AWS::IAM::ManagedPolicy"]
name = "*:policy/theseus-*"

[[guardrail]]
name = "deployer-role"
limit = "guard"
summary = "changing the deployer role, the one principal the SCPs let through"
operations = [
    "iam:UpdateAssumeRolePolicy", "iam:DeleteRole", "iam:UpdateRole", "iam:AttachRolePolicy", "iam:DetachRolePolicy",
    "iam:PutRolePolicy", "iam:DeleteRolePolicy", "iam:PutRolePermissionsBoundary", "iam:DeleteRolePermissionsBoundary",
]
resources = ["arn:aws:iam::*:role/theseus-cfn-deployer"]
scp = "deny-except-deployer"
note = "Whoever could edit its trust policy could become it, and pass every deny-except-deployer."
[guardrail.when]
equals = { RoleName = "theseus-cfn-deployer" }
[[guardrail.change]]
types = ["AWS::IAM::Role"]
name = "theseus-cfn-deployer"

[[guardrail]]
name = "deployer-pass"
limit = "guard"
summary = "passing the deployer role to anything but CloudFormation"
operations = [
    "ecs:RunTask", "ecs:StartTask", "ecs:RegisterTaskDefinition", "batch:RegisterJobDefinition",
    "sagemaker:CreateTrainingJob", "sagemaker:CreateProcessingJob", "codebuild:StartBuild", "ssm:SendCommand",
]
iam = ["iam:PassRole"]
resources = ["arn:aws:iam::*:role/theseus-cfn-deployer"]
scp = "deny"
note = "The design's rule (§3.4): Theseus may pass the deployer to CloudFormation and to nothing else. Its trust policy admits only CloudFormation, so a pass elsewhere fails anyway; this keeps it from being tried. The direct operations here take a role; the IaC-only ones are stacks'. Job sessions and hands may not pass it at all (the stack path, below)."
[guardrail.when]
matches = { "**.taskRoleArn" = ["*/theseus-cfn-deployer", "theseus-cfn-deployer"], "**.executionRoleArn" = ["*/theseus-cfn-deployer", "theseus-cfn-deployer"], "**.jobRoleArn" = ["*/theseus-cfn-deployer", "theseus-cfn-deployer"], RoleArn = ["*/theseus-cfn-deployer", "theseus-cfn-deployer"], serviceRoleOverride = ["*/theseus-cfn-deployer", "theseus-cfn-deployer"], ServiceRoleArn = ["*/theseus-cfn-deployer", "theseus-cfn-deployer"] }
[guardrail.iam_condition]
StringNotEquals = { "iam:PassedToService" = "cloudformation.amazonaws.com" }

[[guardrail]]
name = "hand-boundary"
limit = "guard"
summary = "removing or replacing a hand role's permissions boundary"
operations = ["iam:PutRolePermissionsBoundary", "iam:DeleteRolePermissionsBoundary"]
resources = ["arn:aws:iam::*:role/theseus-hand-*"]
scp = "deny-except-deployer"
[guardrail.when]
matches = { RoleName = "theseus-hand-*" }

# ---------------------------------------------------------------------------------------------
# Another project's resources (the design's §2, its first principle): the account holds a network
# Theseus did not make, and Fargate hands may run in it (theseus-mgw.9). Theseus uses it and never
# changes it. Running a task there is use: ECS's own service-linked role makes the task's network
# interface. A security group of Theseus's own, tagged and with no ingress, may be made in it (the
# hands network's stack does, unless the config names a group): IAM authorizes CreateSecurityGroup
# against the VPC as well, so the AWS side leaves that create out, and the group comes first.

[[guardrail]]
name = "network-not-ours"
limit = "others-resources"
summary = "a change to network plumbing (a VPC, subnet, route table or route, NAT or internet gateway, network ACL, endpoint, flow log, or security group), which may be another project's"
operations = [
    "ec2:DeleteVpc", "ec2:ModifyVpcAttribute", "ec2:DisassociateVpcCidrBlock", "ec2:DeleteSubnet",
    "ec2:ModifySubnetAttribute", "ec2:DisassociateSubnetCidrBlock", "ec2:DeleteRouteTable", "ec2:DeleteRoute",
    "ec2:ReplaceRoute", "ec2:DisassociateRouteTable", "ec2:ReplaceRouteTableAssociation", "ec2:DeleteNatGateway",
    "ec2:DeleteInternetGateway", "ec2:DetachInternetGateway", "ec2:DeleteEgressOnlyInternetGateway",
    "ec2:DeleteNetworkAcl", "ec2:DeleteNetworkAclEntry", "ec2:ReplaceNetworkAclEntry",
    "ec2:ReplaceNetworkAclAssociation", "ec2:DeleteVpcEndpoints", "ec2:ModifyVpcEndpoint", "ec2:DeleteFlowLogs",
    "ec2:DeleteSecurityGroup", "ec2:RevokeSecurityGroupIngress", "ec2:RevokeSecurityGroupEgress",
    "ec2:ModifySecurityGroupRules", "ec2:DeleteVpcPeeringConnection",
]
iam = [
    "ec2:Delete*", "ec2:Disassociate*", "ec2:Detach*", "ec2:Replace*", "ec2:Modify*", "ec2:Associate*",
    "ec2:Attach*", "ec2:Authorize*", "ec2:Revoke*", "ec2:CreateRoute", "ec2:CreateNetworkAclEntry", "ec2:CreateTags",
]
resources = [
    "arn:aws:ec2:*:*:vpc*", "arn:aws:ec2:*:*:subnet/*", "arn:aws:ec2:*:*:route-table/*",
    "arn:aws:ec2:*:*:natgateway/*", "arn:aws:ec2:*:*:internet-gateway/*", "arn:aws:ec2:*:*:network-acl/*",
    "arn:aws:ec2:*:*:security-group/*",
]
direct = true
scp = "deny"
note = "Every call names plumbing that exists (its `when`): a change to it is direct by nature, so the floor, even for an otherwise IaC-only operation. The gate cannot see a resource's tags, so it asks before every direct change to network plumbing, and before a stack resource that names plumbing the stack does not own. AWS refuses the same, to every identity the guards bind, on whatever lacks theseus:owner: a tag Theseus did not put there is not one it may add (ec2:CreateTags outside a create). Making something new in another VPC (a subnet, a route table, an endpoint) stays IaC-only, and in a stack is the template rule's."
[guardrail.when]
present = [
    "VpcId", "SubnetId", "RouteTableId", "AssociationId", "NatGatewayId", "InternetGatewayId",
    "EgressOnlyInternetGatewayId", "NetworkAclId", "VpcEndpointId", "VpcEndpointIds", "FlowLogIds", "GroupId",
    "GroupName", "VpcPeeringConnectionId",
]
[guardrail.iam_condition]
Null = { "aws:ResourceTag/theseus:owner" = "true", "ec2:CreateAction" = "true" }
[[guardrail.template]]
types = [
    "AWS::EC2::Route", "AWS::EC2::SubnetRouteTableAssociation", "AWS::EC2::GatewayRouteTableAssociation",
    "AWS::EC2::Subnet", "AWS::EC2::SubnetCidrBlock", "AWS::EC2::RouteTable", "AWS::EC2::VPCEndpoint",
    "AWS::EC2::NatGateway", "AWS::EC2::FlowLog", "AWS::EC2::VPCGatewayAttachment", "AWS::EC2::EgressOnlyInternetGateway",
    "AWS::EC2::NetworkAcl", "AWS::EC2::NetworkAclEntry", "AWS::EC2::SubnetNetworkAclAssociation",
    "AWS::EC2::SecurityGroupIngress", "AWS::EC2::SecurityGroupEgress", "AWS::EC2::VPCCidrBlock",
    "AWS::EC2::VPCDHCPOptionsAssociation", "AWS::EC2::VPCPeeringConnection", "AWS::EC2::TransitGatewayAttachment",
    "AWS::EC2::TransitGatewayVpcAttachment", "AWS::EC2::VPNGatewayRoutePropagation",
]
[guardrail.template.when]
not_own = [
    "VpcId", "PeerVpcId", "SubnetId", "SubnetIds", "RouteTableId", "RouteTableIds", "NetworkAclId", "GroupId",
    "ResourceId",
]

