# The guardrail list (the AWS design, §3.6 and appendix C): one list, two enforcers.
#
# Theseus's gate reads it before an AWS call or a stack applies, and asks at the floor when an entry
# hits. AWS reads it too, as the deny-only session guards (`theseus-guard-limits`,
# `theseus-guard-iac`) and, once Eddie holds an Organization, as SCPs. Everything AWS-side is
# generated from this file; nothing is written by hand.
#
# An entry:
#   name, limit, summary   what the floor's confirm says. `limit` is the operator limit it serves:
#                          public-ingress, audit-trail, credentials, encryption (the SOC2 stance),
#                          budget, guard (the guards' own integrity), or others-resources (another
#                          project's, which Theseus uses and never changes).
#   operations             API operations, "service:Operation", by the botocore service id.
#   iam                    the IAM actions the AWS side denies, when they differ from `operations`.
#   resources              the IAM resources the AWS side denies them on (default: every resource).
#   direct                 only a direct call can do this, so it is the floor even when the
#                          operation is otherwise IaC-only. Its `when` names the direct case.
#   scp                    the AWS side: "deny" (everyone, the deployer too), "deny-except-deployer"
#                          (a stack may, after the gate's scan asked), or "none" (the gate alone; the
#                          note says what holds AWS-side instead). Every entry but "none" is also in
#                          the session guard.
#   [guardrail.when]       the input condition. Absent: every call hits.
#   [guardrail.iam_condition]  the same condition as IAM sees it, when a condition key exists.
#   [[guardrail.template]] CloudFormation resource types, with their own `when` over properties.
#   [[guardrail.change]]   resource types (and a physical-id glob) whose change in a change set,
#                          a modify or a removal, is a hit.
#
# A `when` table is a set of tests, and it holds when any test holds:
#   public_cidr        a CIDR or address that reaches beyond private space (RFC 1918, shared, loopback,
#                      link-local, and IPv6 ULA and link-local are private; everything else is public)
#   external_principal a policy document (JSON text or a table) that allows a principal outside the
#                      account: "*" unpinned, another account, a federated or canonical user
#   foreign_account    an account id or ARN of another account, or an organization or OU
#   own_account        an account id or ARN of this account
#   not_own            (templates) a resource the template does not make: a literal id or a parameter's
#                      value; an import is a maybe, and a Ref or GetAtt of its own resource is not
#   true, false        a boolean (or "true"/"false")
#   equals, matches    a string equal to one of the values (case-insensitive), or matching a glob
#   present, absent    the member is there, or not
#   any, all, none     nested tests: at least one holds, every one holds, none holds
# Paths are member names joined by dots, matched case-insensitively. Lists are walked through, and a
# leading `**.` matches at any depth.

[deployer]
role = "theseus-cfn-deployer"

# ---------------------------------------------------------------------------------------------
# Public ingress (SOC2)

[[guardrail]]
name = "sg-ingress-public"
limit = "public-ingress"
summary = "a security group rule open to addresses outside private space, or to another account's group"
operations = ["ec2:AuthorizeSecurityGroupIngress", "ec2:ModifySecurityGroupRules"]
scp = "deny-except-deployer"
note = "No condition key sees a rule's CIDR, so AWS denies the action to all but the deployer, and the gate's scan asks first."
[guardrail.when]
public_cidr = ["**.CidrIp", "**.CidrIpv6", "**.CidrIpv4"]
foreign_account = ["**.UserId", "SourceSecurityGroupOwnerId"]
[[guardrail.template]]
types = ["AWS::EC2::SecurityGroup"]
[guardrail.template.when]
public_cidr = ["SecurityGroupIngress.CidrIp", "SecurityGroupIngress.CidrIpv6"]
foreign_account = ["SecurityGroupIngress.SourceSecurityGroupOwnerId"]
[[guardrail.template]]
types = ["AWS::EC2::SecurityGroupIngress"]
[guardrail.template.when]
public_cidr = ["CidrIp", "CidrIpv6"]
foreign_account = ["SourceSecurityGroupOwnerId"]

[[guardrail]]
name = "public-ip"
limit = "public-ingress"
summary = "a public IP address on an instance's network interface"
operations = ["ec2:RunInstances", "ec2:CreateLaunchTemplate", "ec2:CreateLaunchTemplateVersion", "autoscaling:CreateLaunchConfiguration"]
iam = ["ec2:RunInstances"]
scp = "deny-except-deployer"
note = "AWS sees the address at launch, through ec2:AssociatePublicIpAddress; a template or launch configuration is checked by the gate."
[guardrail.when]
true = ["**.AssociatePublicIpAddress"]
[guardrail.iam_condition]
Bool = { "ec2:AssociatePublicIpAddress" = "true" }
[[guardrail.template]]
types = ["AWS::EC2::Instance", "AWS::EC2::LaunchTemplate", "AWS::AutoScaling::LaunchConfiguration"]
[guardrail.template.when]
true = ["**.AssociatePublicIpAddress"]

[[guardrail]]
name = "subnet-public-ip"
limit = "public-ingress"
summary = "a subnet that gives every launch a public IP address"
operations = ["ec2:ModifySubnetAttribute"]
scp = "deny-except-deployer"
[guardrail.when]
true = ["MapPublicIpOnLaunch.Value"]
[[guardrail.template]]
types = ["AWS::EC2::Subnet"]
[guardrail.template.when]
true = ["MapPublicIpOnLaunch"]

[[guardrail]]
name = "task-public-ip"
limit = "public-ingress"
summary = "a public IP address on an ECS task or Batch job"
operations = ["ecs:RunTask", "ecs:StartTask", "ecs:CreateService", "ecs:UpdateService", "ecs:CreateTaskSet", "batch:RegisterJobDefinition"]
scp = "none"
note = "No IAM condition key sees assignPublicIp. The gate asks first; the hands' subnets have no route from the internet, and their security groups no public ingress."
[guardrail.when]
equals = { "**.assignPublicIp" = "ENABLED" }
[[guardrail.template]]
types = ["AWS::ECS::Service", "AWS::ECS::TaskSet", "AWS::Events::Rule", "AWS::Scheduler::Schedule", "AWS::Batch::JobDefinition"]
[guardrail.template.when]
equals = { "**.AssignPublicIp" = "ENABLED" }

[[guardrail]]
name = "elastic-ip"
limit = "public-ingress"
summary = "an Elastic IP address"
operations = ["ec2:AllocateAddress", "ec2:AssociateAddress"]
scp = "deny-except-deployer"
note = "The hands network's NAT gets its address through the stack, as one floor approval at bootstrap."
[[guardrail.template]]
types = ["AWS::EC2::EIP", "AWS::EC2::EIPAssociation"]

[[guardrail]]
name = "internet-gateway"
limit = "public-ingress"
summary = "an internet gateway, the route in from the internet"
operations = ["ec2:CreateInternetGateway", "ec2:AttachInternetGateway"]
scp = "deny-except-deployer"
note = "The NAT's internet gateway comes through the stack, as one floor approval at bootstrap. An egress-only gateway is not a hit."
[[guardrail.template]]
types = ["AWS::EC2::InternetGateway"]
[[guardrail.template]]
types = ["AWS::EC2::VPCGatewayAttachment"]
[guardrail.template.when]
present = ["InternetGatewayId"]

[[guardrail]]
name = "lb-internet-facing"
limit = "public-ingress"
summary = "an internet-facing load balancer"
operations = ["elbv2:CreateLoadBalancer", "elb:CreateLoadBalancer"]
iam = ["elasticloadbalancing:CreateLoadBalancer"]
scp = "deny-except-deployer"
note = "A load balancer is internet-facing unless its scheme says internal. StringNotEquals also denies a request that names no scheme."
[guardrail.when]
equals = { Scheme = "internet-facing" }
all = [{ absent = ["Scheme"] }, { none = [{ equals = { Type = "gateway" } }] }]
[guardrail.iam_condition]
StringNotEquals = { "elasticloadbalancing:Scheme" = "internal" }
[[guardrail.template]]
types = ["AWS::ElasticLoadBalancingV2::LoadBalancer", "AWS::ElasticLoadBalancing::LoadBalancer"]
[guardrail.template.when]
equals = { Scheme = "internet-facing" }
all = [{ absent = ["Scheme"] }, { none = [{ equals = { Type = "gateway" } }] }]

[[guardrail]]
name = "lambda-url-public"
limit = "public-ingress"
summary = "a Lambda function URL anyone can call (AuthType NONE)"
operations = ["lambda:CreateFunctionUrlConfig", "lambda:UpdateFunctionUrlConfig"]
scp = "deny-except-deployer"
[guardrail.when]
equals = { AuthType = "NONE" }
[guardrail.iam_condition]
StringEquals = { "lambda:FunctionUrlAuthType" = "NONE" }
[[guardrail.template]]
types = ["AWS::Lambda::Url"]
[guardrail.template.when]
equals = { AuthType = "NONE" }

[[guardrail]]
name = "api-public"
limit = "public-ingress"
summary = "a public API endpoint (an HTTP or WebSocket API, or a REST API that is not private)"
operations = ["apigateway:CreateRestApi", "apigatewayv2:CreateApi"]
iam = ["apigateway:POST"]
resources = ["arn:aws:apigateway:*::/restapis", "arn:aws:apigateway:*::/apis"]
scp = "deny-except-deployer"
note = "API Gateway's IAM actions are HTTP verbs on paths: this denies creating any API, which stacks do."
[guardrail.when]
absent = ["endpointConfiguration.types"]
equals = { "endpointConfiguration.types" = ["EDGE", "REGIONAL"] }
[[guardrail.template]]
types = ["AWS::ApiGateway::RestApi"]
[guardrail.template.when]
absent = ["EndpointConfiguration.Types"]
equals = { "EndpointConfiguration.Types" = ["EDGE", "REGIONAL"] }
[[guardrail.template]]
types = ["AWS::ApiGatewayV2::Api"]

[[guardrail]]
name = "cloudfront-distribution"
limit = "public-ingress"
summary = "a CloudFront distribution, public by nature"
operations = ["cloudfront:CreateDistribution", "cloudfront:CreateDistributionWithTags", "cloudfront:CopyDistribution"]
iam = ["cloudfront:CreateDistribution", "cloudfront:CopyDistribution"]
scp = "deny-except-deployer"
[[guardrail.template]]
types = ["AWS::CloudFront::Distribution"]

[[guardrail]]
name = "s3-bucket-public-access-block"
limit = "public-ingress"
summary = "a bucket's Block Public Access turned off, in whole or in part"
operations = ["s3:PutPublicAccessBlock", "s3:DeletePublicAccessBlock"]
iam = ["s3:PutBucketPublicAccessBlock"]
scp = "deny-except-deployer"
note = "A flag left out of the configuration is off."
[guardrail.when]
false = ["PublicAccessBlockConfiguration.BlockPublicAcls", "PublicAccessBlockConfiguration.IgnorePublicAcls", "PublicAccessBlockConfiguration.BlockPublicPolicy", "PublicAccessBlockConfiguration.RestrictPublicBuckets"]
absent = ["PublicAccessBlockConfiguration.BlockPublicAcls", "PublicAccessBlockConfiguration.IgnorePublicAcls", "PublicAccessBlockConfiguration.BlockPublicPolicy", "PublicAccessBlockConfiguration.RestrictPublicBuckets"]
[[guardrail.template]]
types = ["AWS::S3::Bucket"]
[guardrail.template.when]
all = [{ present = ["PublicAccessBlockConfiguration"] }, { any = [{ false = ["PublicAccessBlockConfiguration.BlockPublicAcls", "PublicAccessBlockConfiguration.IgnorePublicAcls", "PublicAccessBlockConfiguration.BlockPublicPolicy", "PublicAccessBlockConfiguration.RestrictPublicBuckets"] }, { absent = ["PublicAccessBlockConfiguration.BlockPublicAcls", "PublicAccessBlockConfiguration.IgnorePublicAcls", "PublicAccessBlockConfiguration.BlockPublicPolicy", "PublicAccessBlockConfiguration.RestrictPublicBuckets"] }] }]

[[guardrail]]
name = "s3-account-public-access-block"
limit = "public-ingress"
summary = "the account's S3 Block Public Access changed"
operations = ["s3control:PutPublicAccessBlock", "s3control:DeletePublicAccessBlock"]
iam = ["s3:PutAccountPublicAccessBlock"]
direct = true
scp = "deny"
note = "It has no CloudFormation type: the bootstrap sets it once, under the user key, and nothing changes it after."

[[guardrail]]
name = "s3-acl-public"
limit = "public-ingress"
summary = "an ACL that grants everyone, or every AWS user, access to a bucket or object"
operations = ["s3:PutBucketAcl", "s3:PutObjectAcl", "s3:PutObject", "s3:CopyObject", "s3:CreateMultipartUpload", "s3:CreateBucket"]
scp = "none"
note = "AWS-side, the account's Block Public Access refuses public ACLs, and changing it is s3-account-public-access-block."
[guardrail.when]
equals = { ACL = ["public-read", "public-read-write", "authenticated-read"] }
matches = { GrantRead = ["*AllUsers*", "*AuthenticatedUsers*"], GrantWrite = ["*AllUsers*", "*AuthenticatedUsers*"], GrantReadACP = ["*AllUsers*", "*AuthenticatedUsers*"], GrantWriteACP = ["*AllUsers*", "*AuthenticatedUsers*"], GrantFullControl = ["*AllUsers*", "*AuthenticatedUsers*"], "AccessControlPolicy.Grants.Grantee.URI" = ["*AllUsers*", "*AuthenticatedUsers*"] }
[[guardrail.template]]
types = ["AWS::S3::Bucket"]
[guardrail.template.when]
equals = { AccessControl = ["PublicRead", "PublicReadWrite", "AuthenticatedRead"] }

[[guardrail]]
name = "external-principal"
limit = "public-ingress"
summary = "a trust or resource policy that allows a principal outside the account"
operations = [
    "iam:CreateRole", "iam:UpdateAssumeRolePolicy", "s3:PutBucketPolicy", "kms:CreateKey", "kms:PutKeyPolicy",
    "sqs:CreateQueue", "sqs:SetQueueAttributes", "sns:CreateTopic", "sns:SetTopicAttributes",
    "secretsmanager:PutResourcePolicy", "ecr:SetRepositoryPolicy", "ecr:PutRegistryPolicy", "events:PutPermission",
    "logs:PutResourcePolicy", "logs:PutDestinationPolicy", "efs:PutFileSystemPolicy",
    "backup:PutBackupVaultAccessPolicy", "glacier:SetVaultAccessPolicy", "opensearch:CreateDomain",
    "opensearch:UpdateDomainConfig", "apigateway:CreateRestApi",
]
scp = "none"
note = "An SCP sees the action, not what a policy grants. Under an Organization the AWS-side form is a resource control policy on aws:PrincipalOrgID; until then IAM Access Analyzer reports external access, and the IaC guard keeps these writes in stacks."
[guardrail.when]
external_principal = ["AssumeRolePolicyDocument", "PolicyDocument", "Policy", "Attributes.Policy", "ResourcePolicy", "policyText", "accessPolicy", "policy.Policy", "AccessPolicies"]
all = [{ equals = { AttributeName = "Policy" } }, { external_principal = ["AttributeValue"] }]
[[guardrail.template]]
types = [
    "AWS::IAM::Role", "AWS::S3::BucketPolicy", "AWS::KMS::Key", "AWS::SQS::QueuePolicy", "AWS::SNS::TopicPolicy",
    "AWS::SecretsManager::ResourcePolicy", "AWS::ECR::Repository", "AWS::ECR::RegistryPolicy", "AWS::Events::EventBusPolicy",
    "AWS::Logs::ResourcePolicy", "AWS::Logs::Destination", "AWS::EFS::FileSystem", "AWS::Backup::BackupVault",
    "AWS::OpenSearchService::Domain", "AWS::ApiGateway::RestApi",
]
[guardrail.template.when]
external_principal = [
    "AssumeRolePolicyDocument", "PolicyDocument", "KeyPolicy", "ResourcePolicy", "RepositoryPolicyText", "PolicyText",
    "Statement", "DestinationPolicy", "FileSystemPolicy", "AccessPolicy", "AccessPolicies", "Policy",
]

[[guardrail]]
name = "permission-external"
limit = "public-ingress"
summary = "a permission that lets another account, an organization, or anyone use a function, layer, queue, topic, or event bus"
operations = ["lambda:AddPermission", "lambda:AddLayerVersionPermission", "sqs:AddPermission", "sns:AddPermission", "events:PutPermission"]
scp = "none"
note = "As external-principal: AWS-side, an RCP under an Organization; until then Access Analyzer, and the IaC guard keeps these in stacks."
[guardrail.when]
foreign_account = ["Principal", "AWSAccountIds", "AWSAccountId"]
present = ["PrincipalOrgID", "OrganizationId"]
all = [{ equals = { Principal = "*" } }, { none = [{ own_account = ["SourceAccount", "SourceArn"] }] }]
[[guardrail.template]]
types = ["AWS::Lambda::Permission", "AWS::Lambda::LayerVersionPermission", "AWS::Events::EventBusPolicy"]
[guardrail.template.when]
foreign_account = ["Principal"]
present = ["PrincipalOrgID", "OrganizationId"]
all = [{ equals = { Principal = "*" } }, { none = [{ own_account = ["SourceAccount", "SourceArn"] }] }]

[[guardrail]]
name = "sharing"
limit = "public-ingress"
summary = "sharing a snapshot, an image, or a resource with other accounts or everyone"
operations = ["ec2:ModifySnapshotAttribute", "ec2:ModifyImageAttribute", "rds:ModifyDBSnapshotAttribute", "rds:ModifyDBClusterSnapshotAttribute", "ram:CreateResourceShare", "ram:AssociateResourceShare"]
scp = "deny-except-deployer"
note = "Rare, and a path out of the account: every call asks, removals too."
[[guardrail.template]]
types = ["AWS::RAM::ResourceShare"]
[guardrail.template.when]
foreign_account = ["Principals"]

[[guardrail]]
name = "kms-grant-direct"
limit = "public-ingress"
summary = "a KMS grant made directly, not by an AWS service on Theseus's behalf"
operations = ["kms:CreateGrant"]
scp = "deny"
note = "A direct call is never for an AWS resource, so the gate asks for every one and AWS refuses exactly those; services still make their grants."
[guardrail.iam_condition]
Bool = { "kms:GrantIsForAWSResource" = "false" }

[[guardrail]]
name = "db-public"
limit = "public-ingress"
summary = "a publicly accessible database or broker"
operations = [
    "rds:CreateDBInstance", "rds:ModifyDBInstance", "rds:CreateDBCluster", "rds:CreateDBInstanceReadReplica",
    "rds:RestoreDBInstanceFromDBSnapshot", "rds:RestoreDBInstanceToPointInTime", "rds:RestoreDBInstanceFromS3",
    "redshift:CreateCluster", "redshift:ModifyCluster", "redshift:RestoreFromClusterSnapshot", "mq:CreateBroker",
]
scp = "none"
note = "No condition key sees PubliclyAccessible. A public database is reachable only through a security group, which sg-ingress-public guards."
[guardrail.when]
true = ["PubliclyAccessible"]
[[guardrail.template]]
types = ["AWS::RDS::DBInstance", "AWS::RDS::DBCluster", "AWS::Redshift::Cluster", "AWS::AmazonMQ::Broker", "AWS::DMS::ReplicationInstance"]
[guardrail.template.when]
true = ["PubliclyAccessible"]

[[guardrail]]
name = "db-public-default"
limit = "public-ingress"
summary = "a database that is public by default: no subnet group, so the default VPC, whose internet gateway makes it public"
operations = ["rds:CreateDBInstance", "rds:RestoreDBInstanceFromDBSnapshot", "rds:RestoreDBInstanceToPointInTime", "rds:RestoreDBInstanceFromS3"]
scp = "none"
note = "As db-public."
[guardrail.when]
all = [{ absent = ["PubliclyAccessible"] }, { absent = ["DBSubnetGroupName"] }]
[[guardrail.template]]
types = ["AWS::RDS::DBInstance"]
[guardrail.template.when]
all = [{ absent = ["PubliclyAccessible"] }, { absent = ["DBSubnetGroupName"] }, { absent = ["DBClusterIdentifier"] }]

[[guardrail]]
name = "dms-public"
limit = "public-ingress"
summary = "a DMS replication instance, which is public unless it says otherwise"
operations = ["dms:CreateReplicationInstance"]
scp = "none"
note = "As db-public."
[guardrail.when]
true = ["PubliclyAccessible"]
absent = ["PubliclyAccessible"]
[[guardrail.template]]
types = ["AWS::DMS::ReplicationInstance"]
[guardrail.template.when]
absent = ["PubliclyAccessible"]

[[guardrail]]
name = "search-public"
limit = "public-ingress"
summary = "an OpenSearch domain with a public endpoint (no VPC)"
operations = ["opensearch:CreateDomain", "es:CreateElasticsearchDomain"]
scp = "none"
note = "As db-public: its access policy is external-principal's."
[guardrail.when]
absent = ["VPCOptions"]
[[guardrail.template]]
types = ["AWS::OpenSearchService::Domain", "AWS::Elasticsearch::Domain"]
[guardrail.template.when]
absent = ["VPCOptions"]

[[guardrail]]
name = "build-project-public"
limit = "public-ingress"
summary = "a CodeBuild project whose builds anyone can read"
operations = ["codebuild:UpdateProjectVisibility"]
scp = "none"
note = "Rare; the gate asks, and the IaC guard keeps it in stacks."
[guardrail.when]
equals = { projectVisibility = "PUBLIC_READ" }
[[guardrail.template]]
types = ["AWS::CodeBuild::Project"]
[guardrail.template.when]
equals = { Visibility = "PUBLIC_READ" }

# ---------------------------------------------------------------------------------------------
# The audit trail (SOC2)

[[guardrail]]
name = "trail-stop"
limit = "audit-trail"
summary = "stopping the trail's logging"
operations = ["cloudtrail:StopLogging"]
direct = true
scp = "deny"
note = "Nothing stops the trail: not a stack, not the floor once SCPs hold."
[[guardrail.template]]
types = ["AWS::CloudTrail::Trail"]
[guardrail.template.when]
false = ["IsLogging"]

[[guardrail]]
name = "trail-change"
limit = "audit-trail"
summary = "deleting the trail, or changing what it records"
operations = ["cloudtrail:DeleteTrail", "cloudtrail:UpdateTrail", "cloudtrail:PutEventSelectors"]
scp = "deny-except-deployer"
note = "The posture stack can still change the trail; its change set asks at the floor."
[[guardrail.template]]
types = ["AWS::CloudTrail::Trail"]
[guardrail.template.when]
false = ["IncludeGlobalServiceEvents", "IsMultiRegionTrail", "EnableLogFileValidation", "EventSelectors.IncludeManagementEvents"]
equals = { "EventSelectors.ReadWriteType" = "ReadOnly" }
[[guardrail.change]]
types = ["AWS::CloudTrail::Trail"]

[[guardrail]]
name = "trail-storage"
limit = "audit-trail"
summary = "the trail bucket's policy, lifecycle, versioning, or objects"
operations = [
    "s3:PutBucketPolicy", "s3:DeleteBucketPolicy", "s3:PutBucketLifecycleConfiguration", "s3:DeleteBucketLifecycle",
    "s3:PutBucketVersioning", "s3:DeleteObject", "s3:DeleteObjects", "s3:DeleteBucket",
]
iam = ["s3:PutBucketPolicy", "s3:DeleteBucketPolicy", "s3:PutLifecycleConfiguration", "s3:PutBucketVersioning", "s3:DeleteObject", "s3:DeleteObjectVersion", "s3:DeleteBucket"]
resources = ["arn:aws:s3:::theseus-trail-*"]
scp = "deny-except-deployer"
note = "The trail's bucket is named theseus-trail-*; the posture stack names it so."
[guardrail.when]
matches = { Bucket = "theseus-trail-*" }

[[guardrail]]
name = "trail-key"
limit = "audit-trail"
summary = "disabling, deleting, or re-policying the trail's KMS key"
operations = ["kms:ScheduleKeyDeletion", "kms:DisableKey", "kms:PutKeyPolicy"]
scp = "deny-except-deployer"
note = "The gate sees the key by its alias; by id, the inventory names it (C2). AWS sees it through kms:ResourceAliases."
[guardrail.when]
matches = { KeyId = ["alias/theseus-trail*", "*:alias/theseus-trail*"] }
[guardrail.iam_condition]
"ForAnyValue:StringLike" = { "kms:ResourceAliases" = "alias/theseus-trail*" }

[[guardrail]]
name = "detective-controls"
limit = "audit-trail"
summary = "turning off GuardDuty, Config, Access Analyzer, or Security Hub, or archiving their findings"
operations = [
    "guardduty:DeleteDetector", "guardduty:UpdateDetector", "guardduty:ArchiveFindings", "guardduty:CreateFilter",
    "guardduty:UpdateFilter", "config:StopConfigurationRecorder", "config:DeleteConfigurationRecorder",
    "config:DeleteDeliveryChannel", "accessanalyzer:DeleteAnalyzer", "accessanalyzer:CreateArchiveRule",
    "accessanalyzer:UpdateArchiveRule", "accessanalyzer:UpdateFindings", "securityhub:DisableSecurityHub",
]
iam = [
    "guardduty:DeleteDetector", "guardduty:UpdateDetector", "guardduty:ArchiveFindings", "guardduty:CreateFilter",
    "guardduty:UpdateFilter", "config:StopConfigurationRecorder", "config:DeleteConfigurationRecorder",
    "config:DeleteDeliveryChannel", "access-analyzer:DeleteAnalyzer", "access-analyzer:CreateArchiveRule",
    "access-analyzer:UpdateArchiveRule", "access-analyzer:UpdateFindings", "securityhub:DisableSecurityHub",
]
scp = "deny-except-deployer"
note = "A GuardDuty filter can archive what it matches, and an Access Analyzer finding can be archived by hand: every one asks, unarchiving too."
[[guardrail.template]]
types = ["AWS::GuardDuty::Detector"]
[guardrail.template.when]
false = ["Enable"]
[[guardrail.template]]
types = ["AWS::GuardDuty::Filter"]
[guardrail.template.when]
equals = { Action = "ARCHIVE" }
[[guardrail.template]]
types = ["AWS::AccessAnalyzer::Analyzer"]
[guardrail.template.when]
present = ["ArchiveRules"]
[[guardrail.change]]
types = ["AWS::GuardDuty::Detector", "AWS::AccessAnalyzer::Analyzer", "AWS::Config::ConfigurationRecorder", "AWS::Config::DeliveryChannel"]

[[guardrail]]
name = "alert-tamper"
limit = "audit-trail"
summary = "the posture's alert rules (the CIS checks, the findings, the relay) or the alerts topic"
operations = [
    "events:DeleteRule", "events:DisableRule", "events:PutRule", "events:PutTargets", "events:RemoveTargets",
    "sns:DeleteTopic", "sns:SetTopicAttributes", "sns:Unsubscribe",
]
resources = ["arn:aws:events:*:*:rule/theseus-posture-*", "arn:aws:sns:*:*:theseus-alerts"]
scp = "deny-except-deployer"
note = "The posture stacks name their EventBridge rules theseus-posture-* (the relay in us-east-1 too) and the foundation the topic theseus-alerts (C2's lean posture, theseus-nyzn)."
[guardrail.when]
matches = { Name = "theseus-posture-*", Rule = "theseus-posture-*", TopicArn = "*:theseus-alerts", SubscriptionArn = "*:theseus-alerts:*" }
[[guardrail.change]]
types = ["AWS::Events::Rule"]
name = "theseus-posture-*"
[[guardrail.change]]
types = ["AWS::SNS::Topic"]
name = "*:theseus-alerts"

# ---------------------------------------------------------------------------------------------
# Encryption at rest (SOC2)

[[guardrail]]
name = "ebs-default-encryption-off"
limit = "encryption"
summary = "turning off the account's default EBS encryption"
operations = ["ec2:DisableEbsEncryptionByDefault"]
direct = true
scp = "deny"
note = "It has no CloudFormation type: the bootstrap turns it on once."

[[guardrail]]
name = "storage-unencrypted"
limit = "encryption"
summary = "a database or file system created without encryption at rest"
operations = ["rds:CreateDBInstance", "rds:CreateDBCluster", "efs:CreateFileSystem"]
scp = "none"
note = "Gate and scan only; S3, DynamoDB, SQS, and Logs encrypt by default, and EBS by the account's default."
[guardrail.when]
false = ["StorageEncrypted", "Encrypted"]
all = [{ absent = ["StorageEncrypted"] }, { absent = ["Encrypted"] }, { absent = ["DBClusterIdentifier"] }]
[[guardrail.template]]
types = ["AWS::RDS::DBInstance", "AWS::RDS::DBCluster", "AWS::EFS::FileSystem"]
[guardrail.template.when]
false = ["StorageEncrypted", "Encrypted"]
all = [{ absent = ["StorageEncrypted"] }, { absent = ["Encrypted"] }, { absent = ["DBClusterIdentifier"] }]

# ---------------------------------------------------------------------------------------------
# Long-lived credentials (SOC2: one IAM user, anywhere, ever)

[[guardrail]]
name = "long-lived-credentials"
limit = "credentials"
summary = "a new IAM user, access key, password, service credential, or SSH key"
operations = [
    "iam:CreateUser", "iam:CreateAccessKey", "iam:CreateLoginProfile", "iam:UpdateLoginProfile",
    "iam:CreateServiceSpecificCredential", "iam:UploadSSHPublicKey", "iam:UploadSigningCertificate",
    "ec2:CreateKeyPair", "ec2:ImportKeyPair",
]
scp = "deny"
note = "So rotating the root-of-trust key then needs Eddie's management account, to lift the SCP for the rotation."
[[guardrail.template]]
types = ["AWS::IAM::User", "AWS::IAM::AccessKey", "AWS::EC2::KeyPair"]

[[guardrail]]
name = "root-user-change"
limit = "credentials"
summary = "a change to an IAM user: its keys, policies, groups, or boundary (the account has one, the root of trust)"
operations = [
    "iam:DeleteAccessKey", "iam:UpdateAccessKey", "iam:DeleteUser", "iam:UpdateUser", "iam:AttachUserPolicy",
    "iam:DetachUserPolicy", "iam:PutUserPolicy", "iam:DeleteUserPolicy", "iam:AddUserToGroup",
    "iam:RemoveUserFromGroup", "iam:PutUserPermissionsBoundary", "iam:DeleteUserPermissionsBoundary",
    "iam:DeleteLoginProfile",
]
direct = true
scp = "deny"
note = "The user predates the stacks, so a change can only be direct."

[[guardrail]]
name = "identity-provider"
limit = "credentials"
summary = "trust in an outside identity provider (OIDC or SAML)"
