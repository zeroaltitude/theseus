    "events:CreateEventBus", "events:PutPermission", "scheduler:CreateSchedule", "scheduler:UpdateSchedule",
    "scheduler:CreateScheduleGroup", "application-autoscaling:RegisterScalableTarget",
    "application-autoscaling:PutScalingPolicy", "application-autoscaling:PutScheduledAction",
    "cloudtrail:CreateTrail", "cloudtrail:UpdateTrail", "cloudtrail:PutEventSelectors",
    "config:PutConfigurationRecorder", "config:PutDeliveryChannel", "config:PutConfigRule",
    "guardduty:CreateDetector", "access-analyzer:CreateAnalyzer",
    "budgets:ModifyBudget", "budgets:CreateBudgetAction", "budgets:UpdateBudgetAction",
]

# ---------------------------------------------------------------------------------------------
# The stack path (§3.4). A stack changes only through aws.stack.plan, .apply, and .delete, whose change
# sets the gate scans and shows. A stack's service role is the deployer, which CloudFormation reuses for
# every later update, so a stack write from anywhere else would skip that review and the IaC guard
# with it, and could even edit the guards the foundation stack holds. `aws.call` returns these as
# invalid input that points to the stack tools. `theseus-guard-stacks` denies them, and passing the
# deployer at all, to job sessions, and the boundary does to hands. The work session keeps them: the
# stack tools are the core's own calls in it. Making and reading change sets stays direct.
# CloudFormation's operations are their own IAM actions.

[stacks]
operations = [
    "cloudformation:CreateStack", "cloudformation:UpdateStack", "cloudformation:DeleteStack",
    "cloudformation:ExecuteChangeSet", "cloudformation:ContinueUpdateRollback", "cloudformation:RollbackStack",
    "cloudformation:CancelUpdateStack", "cloudformation:SetStackPolicy", "cloudformation:UpdateTerminationProtection",
    "cloudformation:CreateStackSet", "cloudformation:UpdateStackSet", "cloudformation:DeleteStackSet",
    "cloudformation:CreateStackInstances", "cloudformation:UpdateStackInstances",
    "cloudformation:DeleteStackInstances", "cloudformation:ImportStacksToStackSet",
]

# ---------------------------------------------------------------------------------------------
# Destructive (§3.9's approve step): deleting a stateful resource, or a stack. A change set that
# replaces or removes a stateful resource type waits too. The types follow cfn-lint's list of
# stateful resources (StatefulResources.json), with DNS zones added.

[destructive]
operations = [
    "s3:DeleteBucket", "dynamodb:DeleteTable", "dynamodb:DeleteBackup", "rds:DeleteDBInstance", "rds:DeleteDBCluster",
    "rds:DeleteDBSnapshot", "rds:DeleteDBClusterSnapshot", "efs:DeleteFileSystem", "kms:ScheduleKeyDeletion",
    "kms:DisableKey", "logs:DeleteLogGroup", "ec2:TerminateInstances", "ec2:DeleteVolume", "ec2:DeleteSnapshot",
    "ec2:DeregisterImage", "ecr:DeleteRepository", "ecr:BatchDeleteImage", "secretsmanager:DeleteSecret",
    "sqs:DeleteQueue", "sqs:PurgeQueue", "sns:DeleteTopic", "kinesis:DeleteStream", "firehose:DeleteDeliveryStream",
    "cloudformation:DeleteStack", "elasticache:DeleteCacheCluster", "elasticache:DeleteReplicationGroup",
    "redshift:DeleteCluster", "opensearch:DeleteDomain", "es:DeleteElasticsearchDomain", "backup:DeleteRecoveryPoint",
    "backup:DeleteBackupVault", "glacier:DeleteVault", "glacier:DeleteArchive", "route53:DeleteHostedZone",
    "cognito-idp:DeleteUserPool", "fsx:DeleteFileSystem", "neptune:DeleteDBCluster", "docdb:DeleteDBCluster",
    "emr:TerminateJobFlows",
]
stateful_types = [
    "AWS::Backup::BackupVault", "AWS::CloudFormation::Stack", "AWS::Cognito::UserPool", "AWS::DocDB::DBCluster",
    "AWS::DocDB::DBInstance", "AWS::DynamoDB::GlobalTable", "AWS::DynamoDB::Table", "AWS::EC2::Volume",
    "AWS::EFS::FileSystem", "AWS::EMR::Cluster", "AWS::ElastiCache::CacheCluster", "AWS::ElastiCache::ReplicationGroup",
    "AWS::Elasticsearch::Domain", "AWS::FSx::FileSystem", "AWS::KMS::Key", "AWS::Kinesis::Stream", "AWS::Logs::LogGroup",
    "AWS::Neptune::DBCluster", "AWS::Neptune::DBInstance", "AWS::OpenSearchService::Domain", "AWS::QLDB::Ledger",
    "AWS::RDS::DBCluster", "AWS::RDS::DBInstance", "AWS::Redshift::Cluster", "AWS::S3::Bucket", "AWS::SDB::Domain",
    "AWS::SQS::Queue", "AWS::SecretsManager::Secret", "AWS::Route53::HostedZone", "AWS::ECR::Repository",
]

# ---------------------------------------------------------------------------------------------
# The boundary's compaction. theseus-boundary holds every guard (the limits, IaC, and the stack path)
# in one managed policy (6,144 characters; a role has one boundary), so its unconditional denies are
# compacted: an action a pattern here matches is denied by the pattern. Work and job sessions carry
# the guards themselves, exact.
#
# A pattern starts with a write verb, so it never matches a read. The botocore test lists what else
# each one matches: IaC writes, IAM, and posture, which hands never change. No pattern matches a
# direct operation hands use: data, runs, logs, or the network interfaces a VPC Lambda makes
# (tests/policies.rs holds that list). Pass, Tag, Invoke, Send, Start, and Run never appear.

[boundary]
compact = [
    "iam:Add*", "iam:Attach*", "iam:Create*", "iam:Delete*", "iam:Detach*", "iam:Put*", "iam:Remove*",
    "iam:Set*", "iam:Update*", "iam:Upload*",
    "ec2:CreateVpc*", "ec2:ModifyVpc*", "ec2:CreateRoute*", "ec2:ReplaceRoute*", "ec2:CreateNetworkAcl*",
    "ec2:ReplaceNetworkAcl*", "ec2:AuthorizeSecurityGroup*", "ec2:RevokeSecurityGroup*",
    "ec2:CreateTransitGateway*", "ec2:CreateVpn*", "ec2:CreateLaunchTemplate*", "ec2:Associate*",
    "elasticloadbalancing:Create*", "elasticloadbalancing:Modify*", "elasticloadbalancing:Set*",
    "rds:Create*", "rds:Restore*", "rds:ModifyDB*SnapshotAttribute",
    "lambda:Create*", "lambda:Update*", "lambda:Add*",
    "elasticfilesystem:Create*", "elasticfilesystem:Put*",
    "logs:Put*Policy", "logs:Put*Filter", "logs:PutDestination*",
    "ecs:Create*", "ecs:UpdateCluster*", "application-autoscaling:Put*", "batch:Create*", "batch:Update*",
    "es:Create*", "es:Update*", "account:Put*", "codebuild:UpdateProject*", "scheduler:Create*",
    "autoscaling:Create*", "eks:Create*", "access-analyzer:Create*", "access-analyzer:Update*",
    "guardduty:Create*", "guardduty:Update*",
    "ec2:Create*Gateway", "ec2:Attach*Gateway", "ec2:Modify*Attribute", "s3:PutBucket*", "s3:Put*Configuration",
    "cloudformation:Create*", "cloudformation:Update*", "cloudformation:Delete*",
]
