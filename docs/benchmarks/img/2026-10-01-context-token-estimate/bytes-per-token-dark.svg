<text x="18.0" y="274.0" font-size="11" fill="#c3c2b7">From the differences between the lane check's requests: the schemas (s1 − s4), 6.5 KB of prose (s2 − s1), a tool's result: a</text>
<text x="18.0" y="289.0" font-size="11" fill="#c3c2b7">1.9 KB file read by a tool (s3's second request − its first, less the model's call at its own output count). chars/4 assumes 4</text>
<text x="18.0" y="304.0" font-size="11" fill="#c3c2b7">bytes a token for everything.</text>
