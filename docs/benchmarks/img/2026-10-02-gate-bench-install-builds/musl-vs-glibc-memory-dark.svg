<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" aria-labelledby="t-musl-vs-glibc-memory t-musl-vs-glibc-memory-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t-musl-vs-glibc-memory">Resident memory, static musl against glibc (the install's build), both release-thin</title>
<desc id="t-musl-vs-glibc-memory-d">How much memory would a static musl build save?</desc>
<rect width="720" height="286" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="18.0" y="32.0" font-size="15" fill="#ffffff" font-weight="600">Resident memory, static musl against glibc (the install's build), both release-thin</text>
<circle cx="25.0" cy="50.0" r="5" fill="#2a507f"/>
<text x="40.0" y="54.0" font-size="12" fill="#c3c2b7">static musl (the alternative)</text>
<circle cx="229.6" cy="50.0" r="5" fill="#3987e5"/>
<text x="244.6" y="54.0" font-size="12" fill="#c3c2b7">glibc (the install's build)</text>
<line x1="210.9" y1="76.0" x2="210.9" y2="192.0" stroke="#2c2c2a" stroke-width="1"/>
<line x1="284.3" y1="76.0" x2="284.3" y2="192.0" stroke="#2c2c2a" stroke-width="1"/>
<line x1="357.7" y1="76.0" x2="357.7" y2="192.0" stroke="#2c2c2a" stroke-width="1"/>
<line x1="431.1" y1="76.0" x2="431.1" y2="192.0" stroke="#2c2c2a" stroke-width="1"/>
<line x1="504.6" y1="76.0" x2="504.6" y2="192.0" stroke="#2c2c2a" stroke-width="1"/>
<line x1="578.0" y1="76.0" x2="578.0" y2="192.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="196.9" y="94.0" font-size="12" fill="#ffffff" text-anchor="end">after a start</text>
<g><title>after a start: 14.4 MB → 17.2 MB (median of 3 rounds; every round within 0.3 MB)</title>
<line x1="253.2" y1="90.0" x2="261.4" y2="90.0" stroke="#2a507f" stroke-width="3" stroke-linecap="round"/>
<circle cx="253.2" cy="90.0" r="5" fill="#2a507f" stroke="#1a1a19" stroke-width="2"/>
<circle cx="261.4" cy="90.0" r="12" fill="transparent"/>
<circle cx="261.4" cy="90.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
</g>
<text x="592.0" y="94.0" font-size="11" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">14.4 MB → 17.2 MB</text>
<text x="196.9" y="122.0" font-size="12" fill="#ffffff" text-anchor="end">after a burst of 30 turns</text>
<g><title>after a burst of 30 turns: 17.5 MB → 23.3 MB (median of 3 rounds)</title>
<line x1="262.3" y1="118.0" x2="279.3" y2="118.0" stroke="#2a507f" stroke-width="3" stroke-linecap="round"/>
<circle cx="262.3" cy="118.0" r="5" fill="#2a507f" stroke="#1a1a19" stroke-width="2"/>
<circle cx="279.3" cy="118.0" r="12" fill="transparent"/>
<circle cx="279.3" cy="118.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
</g>
<text x="592.0" y="122.0" font-size="11" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">17.5 MB → 23.3 MB</text>
<text x="196.9" y="150.0" font-size="12" fill="#ffffff" text-anchor="end">idle at 10,000 parked sessions</text>
<g><title>idle at 10,000 parked sessions: 20.8 MB → 47.9 MB (one 20 s window, 60 s after the start)</title>
<line x1="272.0" y1="146.0" x2="351.6" y2="146.0" stroke="#2a507f" stroke-width="3" stroke-linecap="round"/>
<circle cx="272.0" cy="146.0" r="5" fill="#2a507f" stroke="#1a1a19" stroke-width="2"/>
<circle cx="351.6" cy="146.0" r="12" fill="transparent"/>
<circle cx="351.6" cy="146.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
</g>
<text x="592.0" y="150.0" font-size="11" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">20.8 MB → 47.9 MB</text>
<text x="196.9" y="178.0" font-size="12" fill="#ffffff" text-anchor="end">its peak at 10,000 sessions</text>
<g><title>its peak at 10,000 sessions: 87 MB → 104 MB (the start's peak)</title>
<line x1="466.4" y1="174.0" x2="516.0" y2="174.0" stroke="#2a507f" stroke-width="3" stroke-linecap="round"/>
<circle cx="466.4" cy="174.0" r="5" fill="#2a507f" stroke="#1a1a19" stroke-width="2"/>
<circle cx="516.0" cy="174.0" r="12" fill="transparent"/>
<circle cx="516.0" cy="174.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
</g>
<text x="592.0" y="178.0" font-size="11" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">87 MB → 104 MB</text>
<text x="210.9" y="208.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">0</text>
<text x="284.3" y="208.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">25</text>
<text x="357.7" y="208.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">50</text>
<text x="431.1" y="208.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">75</text>
<text x="504.6" y="208.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">100</text>
<text x="578.0" y="208.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">125</text>
<line x1="210.9" y1="192.0" x2="578.0" y2="192.0" stroke="#383835" stroke-width="1"/>
<text x="394.4" y="226.0" font-size="12" fill="#c3c2b7" text-anchor="middle">resident memory, MB</text>
<text x="18.0" y="248.0" font-size="11" fill="#c3c2b7">After a start and after a burst: the phases' figure's three rounds (every round within 0.3 MB of the median). At 10,000</text>
<text x="18.0" y="263.0" font-size="11" fill="#c3c2b7">parked sessions: the idle bench once a build, a 20 s window 60 s after the start.</text>
</svg>
