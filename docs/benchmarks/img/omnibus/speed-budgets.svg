<text x="18.0" y="442.0" font-size="11" fill="#52514e">A dot is the median of the gates' p50s; the bar runs to the median of their p95s (each run's slowest of ten) and the whisker</text>
<text x="18.0" y="457.0" font-size="11" fill="#52514e">to the 90th percentile of those. The limit is the budget plus its September margin. Slow runs: gates whose first run's slowest</text>
<text x="18.0" y="472.0" font-size="11" fill="#52514e">sample crossed the limit (a rerun decides; 8 of 240 gates failed, every one the machine's stall).</text>
