<svg xmlns="http://www.w3.org/2000/svg" width="720" height="325" viewBox="0 0 720 325" role="img" aria-labelledby="t-headline t-headline-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t-headline">Theseus in six numbers, from 36 benchmark reports (Sep 30 to Oct 13, 2026)</title>
<desc id="t-headline-d">What do the benchmark runs say, in a sentence each?</desc>
<rect width="720" height="325" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="18.0" y="32.0" font-size="15" fill="#ffffff" font-weight="600">Theseus in six numbers, from 36 benchmark reports (Sep 30 to Oct 13, 2026)</text>
<rect x="18.0" y="48.0" width="220.0" height="112" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
<rect x="19.0" y="49.0" width="4" height="110" rx="2" fill="#3987e5"/>
<text x="36.0" y="88.0" font-size="30" fill="#ffffff" font-weight="600">75.7%</text>
<text x="36.0" y="110.0" font-size="12.5" fill="#ffffff" font-weight="600">of 445 Terminal-Bench 2.0</text>
<text x="36.0" y="126.0" font-size="12.5" fill="#ffffff" font-weight="600">trials solved</text>
<text x="36.0" y="142.0" font-size="11" fill="#c3c2b7">89 tasks × 5, Oct 13; Claude Code</text>
<text x="36.0" y="156.0" font-size="11" fill="#c3c2b7">71.9% on the same model and</text>
<text x="36.0" y="170.0" font-size="11" fill="#c3c2b7">effort: T1 passes</text>
<rect x="250.0" y="48.0" width="220.0" height="112" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
<rect x="251.0" y="49.0" width="4" height="110" rx="2" fill="#3987e5"/>
<text x="268.0" y="88.0" font-size="30" fill="#ffffff" font-weight="600">$0.12</text>
<text x="268.0" y="110.0" font-size="12.5" fill="#ffffff" font-weight="600">a Terminal-Bench trial,</text>
<text x="268.0" y="126.0" font-size="12.5" fill="#ffffff" font-weight="600">level with Claude Code</text>
<text x="268.0" y="142.0" font-size="11" fill="#c3c2b7">Pi $0.07, OpenCode $0.08: the</text>
<text x="268.0" y="156.0" font-size="11" fill="#c3c2b7">prompt each call carries</text>
<rect x="482.0" y="48.0" width="220.0" height="112" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
<rect x="483.0" y="49.0" width="4" height="110" rx="2" fill="#3987e5"/>
<text x="500.0" y="88.0" font-size="30" fill="#ffffff" font-weight="600">73.6%</text>
<text x="500.0" y="110.0" font-size="12.5" fill="#ffffff" font-weight="600">of recall probes over 600</text>
<text x="500.0" y="126.0" font-size="12.5" fill="#ffffff" font-weight="600">turns</text>
<text x="500.0" y="142.0" font-size="11" fill="#c3c2b7">Pi 56.9%, Claude Code 50.7%; all</text>
<text x="500.0" y="156.0" font-size="11" fill="#c3c2b7">of the lead across sessions</text>
<rect x="18.0" y="172.0" width="220.0" height="112" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
<rect x="19.0" y="173.0" width="4" height="110" rx="2" fill="#3987e5"/>
<text x="36.0" y="212.0" font-size="30" fill="#ffffff" font-weight="600">0 of 11</text>
<text x="36.0" y="234.0" font-size="12.5" fill="#ffffff" font-weight="600">killed mid-task: steps</text>
<text x="36.0" y="250.0" font-size="12.5" fill="#ffffff" font-weight="600">redone or doubled</text>
<text x="36.0" y="266.0" font-size="11" fill="#c3c2b7">Claude Code doubled an effect in</text>
<text x="36.0" y="280.0" font-size="11" fill="#c3c2b7">7 of 12</text>
<rect x="250.0" y="172.0" width="220.0" height="112" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
<rect x="251.0" y="173.0" width="4" height="110" rx="2" fill="#3987e5"/>
<text x="268.0" y="212.0" font-size="30" fill="#ffffff" font-weight="600">18.1 ms</text>
<text x="268.0" y="234.0" font-size="12.5" fill="#ffffff" font-weight="600">a cold start, release build</text>
<text x="268.0" y="250.0" font-size="11" fill="#c3c2b7">budget 50 ms; 18.3 ms at 10,000</text>
<text x="268.0" y="264.0" font-size="11" fill="#c3c2b7">sessions</text>
<rect x="482.0" y="172.0" width="220.0" height="112" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
<rect x="483.0" y="173.0" width="4" height="110" rx="2" fill="#3987e5"/>
<text x="500.0" y="212.0" font-size="30" fill="#ffffff" font-weight="600">$367</text>
<text x="500.0" y="234.0" font-size="12.5" fill="#ffffff" font-weight="600">every model call of every</text>
<text x="500.0" y="250.0" font-size="12.5" fill="#ffffff" font-weight="600">run</text>
<text x="500.0" y="266.0" font-size="11" fill="#c3c2b7">the Terminal-Bench runs are 88%</text>
<text x="500.0" y="280.0" font-size="11" fill="#c3c2b7">of it</text>
<text x="18.0" y="302.0" font-size="11" fill="#c3c2b7">Each number's run is linked from its section of the omnibus review.</text>
</svg>
