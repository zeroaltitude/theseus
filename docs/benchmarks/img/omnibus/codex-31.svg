<text x="18.0" y="318.0" font-size="11" fill="#52514e">Codex ran 1 trial a task, so its interval rests on 31 trials; the v1 arms ran 3 a task, and the same 31 tasks give 93 trials each.</text>
<text x="18.0" y="333.0" font-size="11" fill="#52514e">The 31 are the heaviest of the 89, run first, and a $75 spend line stopped the run, so this is not the 89-task rate. OpenCode</text>
<text x="18.0" y="348.0" font-size="11" fill="#52514e">(61.3%) is in the report and the page's table.</text>
