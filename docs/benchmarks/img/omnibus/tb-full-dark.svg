<text x="294.2" y="306.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">60%</text>
<text x="361.7" y="306.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">70%</text>
<text x="429.2" y="306.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">80%</text>
<text x="496.8" y="306.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">90%</text>
<text x="564.3" y="306.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">100%</text>
<text x="395.5" y="324.0" font-size="12" fill="#c3c2b7" text-anchor="middle">share of trials solved (Wilson 95%)</text>
<text x="18.0" y="346.0" font-size="11" fill="#c3c2b7">Claude Sonnet 5.5 in every arm; $2.00 and 200 model calls a trial. Paired by task, Claude Code did better on 16 tasks and</text>
<text x="18.0" y="361.0" font-size="11" fill="#c3c2b7">Theseus on 5 (p = 0.027). 13 of Theseus's 21 trials that did not end on their own ended on a harness fault; four of the five</text>
<text x="18.0" y="376.0" font-size="11" fill="#c3c2b7">kinds are fixed.</text>
