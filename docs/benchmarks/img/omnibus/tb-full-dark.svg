<svg xmlns="http://www.w3.org/2000/svg" width="720" height="399" viewBox="0 0 720 399" role="img" aria-labelledby="t-tb-full t-tb-full-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t-tb-full">Terminal-Bench 2.0, all 89 tasks, two attempts each, the same model in every arm</title>
<desc id="t-tb-full-d">How often does Theseus solve a real terminal task, against Claude Code?</desc>
