<line x1="564.3" y1="92.0" x2="564.3" y2="290.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="18.0" y="109.0" font-size="12" fill="#ffffff" stroke="#1a1a19" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="600">As measured (Oct 4, 178 trials an arm)</text>
<text x="18.0" y="221.0" font-size="12" fill="#ffffff" stroke="#1a1a19" stroke-width="3" stroke-linejoin="round" paint-order="stroke" font-weight="600">On paper: counts, not measurements</text>
