<text x="18.0" y="480.0" font-size="11" fill="#c3c2b7">Codex ran 1 trial a task, so its interval rests on 89 trials; the v1 arms ran 3 a task, and the same 89 tasks give 267 trials each.</text>
<text x="18.0" y="495.0" font-size="11" fill="#c3c2b7">Two tasks (qemu-alpine-ssh, qemu-startup) cannot install any agent on their images, for every arm. OpenCode (70.8%) is in</text>
<text x="18.0" y="510.0" font-size="11" fill="#c3c2b7">the report and the page's table. Dollars are list prices.</text>
