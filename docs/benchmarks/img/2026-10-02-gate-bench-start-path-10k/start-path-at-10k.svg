<svg xmlns="http://www.w3.org/2000/svg" width="720" height="446" viewBox="0 0 720 446" role="img" aria-labelledby="t-start-path-at-10k t-start-path-at-10k-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t-start-path-at-10k">Each lifecycle phase at 10,000 parked sessions, before and after lane perf1 (p50, release)</title>
