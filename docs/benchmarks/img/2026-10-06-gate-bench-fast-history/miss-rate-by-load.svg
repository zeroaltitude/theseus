</g>
<text x="578.3" y="238.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">40.0%  [11.8%, 76.9%]</text>
<line x1="146.3" y1="252.0" x2="564.3" y2="252.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="146.3" y="268.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">0%</text>
<text x="250.8" y="268.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">20%</text>
<text x="355.3" y="268.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">40%</text>
<text x="459.8" y="268.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">60%</text>
<text x="564.3" y="268.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">80%</text>
<text x="355.3" y="286.0" font-size="12" fill="#52514e" text-anchor="middle">first runs past a limit (Wilson 95% interval)</text>
<text x="18.0" y="308.0" font-size="11" fill="#52514e">The load is the 1-minute load average as the bench ended (16 vCPUs), so it includes the bench's own work.</text>
</svg>
