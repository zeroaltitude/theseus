</g>
<text x="578.3" y="154.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">13.0%  [7.9%, 20.6%]</text>
<text x="132.3" y="182.0" font-size="12" fill="#0b0b0b" text-anchor="end">load 8-12 (n = 46)</text>
