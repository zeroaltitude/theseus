<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" role="img" aria-labelledby="t-first-text-normal-disk t-first-text-normal-disk-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t-first-text-normal-disk">From the model's first token to the reply's first text on Discord, normal disk</title>
<desc id="t-first-text-normal-disk-d">How long did a greeting's first words wait after the model had them, before and after the fix?</desc>
<rect width="720" height="342" rx="8" fill="#fcfcfb" stroke="#e6e5df"/>
<text x="18.0" y="32.0" font-size="15" fill="#0b0b0b" font-weight="600">From the model's first token to the reply's first text on Discord, normal disk</text>
<circle cx="25.0" cy="50.0" r="5" fill="#88b3e7"/>
<text x="40.0" y="54.0" font-size="12" fill="#52514e">before (e6f90af3)</text>
<circle cx="173.7" cy="50.0" r="5" fill="#2a78d6"/>
<text x="188.7" y="54.0" font-size="12" fill="#52514e">after (lane speed)</text>
<line x1="265.5" y1="76.0" x2="265.5" y2="248.0" stroke="#e1e0d9" stroke-width="1"/>
<line x1="376.2" y1="76.0" x2="376.2" y2="248.0" stroke="#e1e0d9" stroke-width="1"/>
<line x1="486.8" y1="76.0" x2="486.8" y2="248.0" stroke="#e1e0d9" stroke-width="1"/>
<line x1="597.4" y1="76.0" x2="597.4" y2="248.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="251.5" y="94.0" font-size="12" fill="#0b0b0b" text-anchor="end">hey, good evening (first after the start)</text>
<g><title>hey, good evening (first after the start): 514 ms → 11 ms (route detour (trivial 0.96), waited 276 then detour (trivial 0.98), waited 131)</title>
<line x1="565.4" y1="90.0" x2="380.7" y2="90.0" stroke="#88b3e7" stroke-width="3" stroke-linecap="round"/>
<circle cx="565.4" cy="90.0" r="5" fill="#88b3e7" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="380.7" cy="90.0" r="12" fill="transparent"/>
<circle cx="380.7" cy="90.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="611.4" y="94.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">514 ms → 11 ms</text>
<text x="251.5" y="122.0" font-size="12" fill="#0b0b0b" text-anchor="end">hi again</text>
<g><title>hi again: 329 ms → 4 ms (route unsure (trivial 0.56), waited 369 then detour (trivial 0.56), waited 120)</title>
<line x1="544.0" y1="118.0" x2="332.1" y2="118.0" stroke="#88b3e7" stroke-width="3" stroke-linecap="round"/>
<circle cx="544.0" cy="118.0" r="5" fill="#88b3e7" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="332.1" cy="118.0" r="12" fill="transparent"/>
<circle cx="332.1" cy="118.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="611.4" y="122.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">329 ms → 4 ms</text>
<text x="251.5" y="150.0" font-size="12" fill="#0b0b0b" text-anchor="end">good evening, Theseus</text>
<g><title>good evening, Theseus: 482 ms → 2 ms (route unsure (chat 0.43), waited 141 then detour (trivial 0.44), waited 111)</title>
<line x1="562.4" y1="146.0" x2="298.8" y2="146.0" stroke="#88b3e7" stroke-width="3" stroke-linecap="round"/>
<circle cx="562.4" cy="146.0" r="5" fill="#88b3e7" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="298.8" cy="146.0" r="12" fill="transparent"/>
<circle cx="298.8" cy="146.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="611.4" y="150.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">482 ms → 2 ms</text>
<text x="251.5" y="178.0" font-size="12" fill="#0b0b0b" text-anchor="end">hey there</text>
<g><title>hey there: 267 ms → 3 ms (route unsure (trivial 0.57), waited 142 then detour (trivial 0.55), waited 102)</title>
<line x1="534.0" y1="174.0" x2="318.3" y2="174.0" stroke="#88b3e7" stroke-width="3" stroke-linecap="round"/>
<circle cx="534.0" cy="174.0" r="5" fill="#88b3e7" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="318.3" cy="174.0" r="12" fill="transparent"/>
<circle cx="318.3" cy="174.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="611.4" y="178.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">267 ms → 3 ms</text>
<text x="251.5" y="206.0" font-size="12" fill="#0b0b0b" text-anchor="end">hello!</text>
<g><title>hello!: 255 ms → 2 ms (route detour (trivial 0.7), waited 129 then detour (trivial 0.67), waited 100)</title>
<line x1="531.8" y1="202.0" x2="298.8" y2="202.0" stroke="#88b3e7" stroke-width="3" stroke-linecap="round"/>
<circle cx="531.8" cy="202.0" r="5" fill="#88b3e7" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="298.8" cy="202.0" r="12" fill="transparent"/>
<circle cx="298.8" cy="202.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="611.4" y="206.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">255 ms → 2 ms</text>
<text x="251.5" y="234.0" font-size="12" fill="#0b0b0b" text-anchor="end">hey, I'm back (100 s idle)</text>
<g><title>hey, I'm back (100 s idle): 424 ms → 2 ms (route unsure (trivial 0.51), waited 252 then detour (trivial 0.51), waited 103)</title>
<line x1="556.2" y1="230.0" x2="298.8" y2="230.0" stroke="#88b3e7" stroke-width="3" stroke-linecap="round"/>
<circle cx="556.2" cy="230.0" r="5" fill="#88b3e7" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="298.8" cy="230.0" r="12" fill="transparent"/>
<circle cx="298.8" cy="230.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="611.4" y="234.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">424 ms → 2 ms</text>
<text x="265.5" y="264.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">1</text>
<text x="376.2" y="264.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">10</text>
<text x="486.8" y="264.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">100</text>
<text x="597.4" y="264.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">1,000</text>
<line x1="265.5" y1="248.0" x2="597.4" y2="248.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="431.5" y="282.0" font-size="12" fill="#52514e" text-anchor="middle">ms after the model's first token (log scale)</text>
<text x="18.0" y="304.0" font-size="11" fill="#52514e">Six greetings typed through the stand-in Discord, the same config file for both builds; the model is a paced stand-in (first</text>
<text x="18.0" y="319.0" font-size="11" fill="#52514e">text 800 ms after the request). Before, the text waited for the place's 1.2 s edit tick.</text>
</svg>
