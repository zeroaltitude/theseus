<svg xmlns="http://www.w3.org/2000/svg" width="720" height="286" viewBox="0 0 720 286" role="img" aria-labelledby="t-stalled-disk t-stalled-disk-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t-stalled-disk">The same two greetings on a disk whose every flush stalls 1.4 s</title>
<desc id="t-stalled-disk-d">On a disk that stalls every sync, how long after the model did the reply's text reach Discord?</desc>
<rect width="720" height="286" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="18.0" y="32.0" font-size="15" fill="#ffffff" font-weight="600">The same two greetings on a disk whose every flush stalls 1.4 s</text>
<circle cx="25.0" cy="50.0" r="5" fill="#2a507f"/>
<text x="40.0" y="54.0" font-size="12" fill="#c3c2b7">before (e6f90af3)</text>
<circle cx="173.7" cy="50.0" r="5" fill="#3987e5"/>
<text x="188.7" y="54.0" font-size="12" fill="#c3c2b7">after (the final build)</text>
<line x1="203.4" y1="76.0" x2="203.4" y2="192.0" stroke="#2c2c2a" stroke-width="1"/>
<line x1="301.2" y1="76.0" x2="301.2" y2="192.0" stroke="#2c2c2a" stroke-width="1"/>
<line x1="398.9" y1="76.0" x2="398.9" y2="192.0" stroke="#2c2c2a" stroke-width="1"/>
<line x1="496.7" y1="76.0" x2="496.7" y2="192.0" stroke="#2c2c2a" stroke-width="1"/>
<line x1="594.5" y1="76.0" x2="594.5" y2="192.0" stroke="#2c2c2a" stroke-width="1"/>
<text x="189.4" y="94.0" font-size="12" fill="#ffffff" text-anchor="end">the first greeting: first text</text>
<g><title>the first greeting: first text: 263 ms → 2 ms (ms after the model's first token)</title>
<line x1="440.0" y1="90.0" x2="232.8" y2="90.0" stroke="#2a507f" stroke-width="3" stroke-linecap="round"/>
<circle cx="440.0" cy="90.0" r="5" fill="#2a507f" stroke="#1a1a19" stroke-width="2"/>
<circle cx="232.8" cy="90.0" r="12" fill="transparent"/>
<circle cx="232.8" cy="90.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
</g>
<text x="608.5" y="94.0" font-size="11" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">263 ms → 2 ms</text>
<text x="189.4" y="122.0" font-size="12" fill="#ffffff" text-anchor="end">the first greeting: whole text</text>
<g><title>the first greeting: whole text: 5,403 ms → 2 ms (ms after the model's stream ended)</title>
<line x1="568.3" y1="118.0" x2="232.8" y2="118.0" stroke="#2a507f" stroke-width="3" stroke-linecap="round"/>
<circle cx="568.3" cy="118.0" r="5" fill="#2a507f" stroke="#1a1a19" stroke-width="2"/>
<circle cx="232.8" cy="118.0" r="12" fill="transparent"/>
<circle cx="232.8" cy="118.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
</g>
<text x="608.5" y="122.0" font-size="11" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">5,403 ms → 2 ms</text>
<text x="189.4" y="150.0" font-size="12" fill="#ffffff" text-anchor="end">the second: first text</text>
<g><title>the second: first text: 948 ms → 2 ms (ms after the model's first token)</title>
<line x1="494.4" y1="146.0" x2="232.8" y2="146.0" stroke="#2a507f" stroke-width="3" stroke-linecap="round"/>
<circle cx="494.4" cy="146.0" r="5" fill="#2a507f" stroke="#1a1a19" stroke-width="2"/>
<circle cx="232.8" cy="146.0" r="12" fill="transparent"/>
<circle cx="232.8" cy="146.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
</g>
<text x="608.5" y="150.0" font-size="11" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">948 ms → 2 ms</text>
<text x="189.4" y="178.0" font-size="12" fill="#ffffff" text-anchor="end">the second: whole text</text>
<g><title>the second: whole text: 486 ms → 3 ms (ms after the model's stream ended)</title>
<line x1="466.1" y1="174.0" x2="250.1" y2="174.0" stroke="#2a507f" stroke-width="3" stroke-linecap="round"/>
<circle cx="466.1" cy="174.0" r="5" fill="#2a507f" stroke="#1a1a19" stroke-width="2"/>
<circle cx="250.1" cy="174.0" r="12" fill="transparent"/>
<circle cx="250.1" cy="174.0" r="5" fill="#3987e5" stroke="#1a1a19" stroke-width="2"/>
</g>
<text x="608.5" y="178.0" font-size="11" fill="#c3c2b7" style="font-variant-numeric: tabular-nums">486 ms → 3 ms</text>
<text x="203.4" y="208.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">1</text>
<text x="301.2" y="208.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">10</text>
<text x="398.9" y="208.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">100</text>
<text x="496.7" y="208.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">1,000</text>
<text x="594.5" y="208.0" font-size="11" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric: tabular-nums">10,000</text>
<line x1="203.4" y1="192.0" x2="594.5" y2="192.0" stroke="#383835" stroke-width="1"/>
<text x="398.9" y="226.0" font-size="12" fill="#c3c2b7" text-anchor="middle">ms (log scale)</text>
<text x="18.0" y="248.0" font-size="11" fill="#c3c2b7">First text: ms after the model's first token; whole text: ms after its stream ended. The disk: device-mapper's delay target</text>
<text x="18.0" y="263.0" font-size="11" fill="#c3c2b7">over a loop device, ext4, for the scratch state dir only; an fdatasync on it measured 1.42 to 1.52 s.</text>
</svg>
