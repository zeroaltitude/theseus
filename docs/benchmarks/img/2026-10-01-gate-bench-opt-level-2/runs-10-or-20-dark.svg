<title id="t-runs-10-or-20">How often a phase's judged number passed its limit: the gate's statistic against a p95 of 20</title>
<desc id="t-runs-10-or-20-d">On the A/B's own samples, would a p95 of twenty runs stop one stall from deciding a phase?</desc>
