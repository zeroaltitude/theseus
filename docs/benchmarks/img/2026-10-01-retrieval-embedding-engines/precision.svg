<circle cx="634.0" cy="167.1" r="12" fill="transparent"/>
<circle cx="634.0" cy="167.1" r="6" fill="#898781" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="617.5" y="95.3" font-size="11" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">candle f32</text>
<text x="331.7" y="256.1" font-size="11" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">candle f16</text>
<text x="222.1" y="228.0" font-size="11" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">candle Q8_0, x86-64-v3</text>
<text x="222.1" y="357.6" font-size="11" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">candle Q8_0, portable</text>
<text x="634.0" y="153.1" font-size="11" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">tract f32</text>
<text x="18.0" y="440.0" font-size="11" fill="#52514e">128-token chunks, one thread, static musl builds. Up and to the left is better. Only f32 and f16 keep the 0.999 agreement</text>
<text x="18.0" y="455.0" font-size="11" fill="#52514e">bar; Q8_0 misses it (0.998).</text>
