<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" role="img" aria-labelledby="t-seed-spread t-seed-spread-d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t-seed-spread">The same build, two fresh progressions: recall by distance from the fact</title>
<desc id="t-seed-spread-d">How much of a recall number is the seed it was drawn from? Each bar's length is the gap between two draws of one build.</desc>
<rect width="720" height="342" rx="8" fill="#fcfcfb" stroke="#e6e5df"/>
<text x="18.0" y="32.0" font-size="15" fill="#0b0b0b" font-weight="600">The same build, two fresh progressions: recall by distance from the fact</text>
<circle cx="25.0" cy="50.0" r="5" fill="#88b3e7"/>
<text x="40.0" y="54.0" font-size="12" fill="#52514e">seed 11</text>
<circle cx="111.7" cy="50.0" r="5" fill="#2a78d6"/>
<text x="126.7" y="54.0" font-size="12" fill="#52514e">seed 13</text>
<line x1="107.1" y1="76.0" x2="107.1" y2="248.0" stroke="#e1e0d9" stroke-width="1"/>
<line x1="206.0" y1="76.0" x2="206.0" y2="248.0" stroke="#e1e0d9" stroke-width="1"/>
<line x1="305.0" y1="76.0" x2="305.0" y2="248.0" stroke="#e1e0d9" stroke-width="1"/>
<line x1="403.9" y1="76.0" x2="403.9" y2="248.0" stroke="#e1e0d9" stroke-width="1"/>
<line x1="502.9" y1="76.0" x2="502.9" y2="248.0" stroke="#e1e0d9" stroke-width="1"/>
<line x1="601.9" y1="76.0" x2="601.9" y2="248.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="93.1" y="94.0" font-size="12" fill="#0b0b0b" text-anchor="end">near</text>
<g><title>near: 85.7% → 86.4% (seed 11 18 of 21; seed 13 19 of 22)</title>
<line x1="531.2" y1="90.0" x2="534.4" y2="90.0" stroke="#88b3e7" stroke-width="3" stroke-linecap="round"/>
<circle cx="531.2" cy="90.0" r="5" fill="#88b3e7" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="534.4" cy="90.0" r="12" fill="transparent"/>
<circle cx="534.4" cy="90.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="615.9" y="94.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">85.7% → 86.4%</text>
<text x="93.1" y="122.0" font-size="12" fill="#0b0b0b" text-anchor="end">topic shift</text>
<g><title>topic shift: 76.2% → 91.7% (seed 11 16 of 21; seed 13 22 of 24)</title>
<line x1="484.1" y1="118.0" x2="560.6" y2="118.0" stroke="#88b3e7" stroke-width="3" stroke-linecap="round"/>
<circle cx="484.1" cy="118.0" r="5" fill="#88b3e7" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="560.6" cy="118.0" r="12" fill="transparent"/>
<circle cx="560.6" cy="118.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="615.9" y="122.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">76.2% → 91.7%</text>
<text x="93.1" y="150.0" font-size="12" fill="#0b0b0b" text-anchor="end">compaction</text>
<g><title>compaction: 80.0% → 65.4% (seed 11 24 of 30; seed 13 17 of 26)</title>
<line x1="502.9" y1="146.0" x2="430.6" y2="146.0" stroke="#88b3e7" stroke-width="3" stroke-linecap="round"/>
<circle cx="502.9" cy="146.0" r="5" fill="#88b3e7" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="430.6" cy="146.0" r="12" fill="transparent"/>
<circle cx="430.6" cy="146.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="615.9" y="150.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">80.0% → 65.4%</text>
<text x="93.1" y="178.0" font-size="12" fill="#0b0b0b" text-anchor="end">later session</text>
<g><title>later session: 87.5% → 95.8% (seed 11 21 of 24; seed 13 23 of 24)</title>
<line x1="540.0" y1="174.0" x2="581.2" y2="174.0" stroke="#88b3e7" stroke-width="3" stroke-linecap="round"/>
<circle cx="540.0" cy="174.0" r="5" fill="#88b3e7" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="581.2" cy="174.0" r="12" fill="transparent"/>
<circle cx="581.2" cy="174.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="615.9" y="178.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">87.5% → 95.8%</text>
<text x="93.1" y="206.0" font-size="12" fill="#0b0b0b" text-anchor="end">days later</text>
<g><title>days later: 54.2% → 87.5% (seed 11 13 of 24; seed 13 21 of 24)</title>
<line x1="375.1" y1="202.0" x2="540.0" y2="202.0" stroke="#88b3e7" stroke-width="3" stroke-linecap="round"/>
<circle cx="375.1" cy="202.0" r="5" fill="#88b3e7" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="540.0" cy="202.0" r="12" fill="transparent"/>
<circle cx="540.0" cy="202.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="615.9" y="206.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">54.2% → 87.5%</text>
<text x="93.1" y="234.0" font-size="12" fill="#0b0b0b" text-anchor="end">supersession</text>
<g><title>supersession: 29.2% → 41.7% (seed 11 7 of 24; seed 13 10 of 24)</title>
<line x1="251.4" y1="230.0" x2="313.3" y2="230.0" stroke="#88b3e7" stroke-width="3" stroke-linecap="round"/>
<circle cx="251.4" cy="230.0" r="5" fill="#88b3e7" stroke="#fcfcfb" stroke-width="2"/>
<circle cx="313.3" cy="230.0" r="12" fill="transparent"/>
<circle cx="313.3" cy="230.0" r="5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
</g>
<text x="615.9" y="234.0" font-size="11" fill="#52514e" style="font-variant-numeric: tabular-nums">29.2% → 41.7%</text>
<text x="107.1" y="264.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">0%</text>
<text x="206.0" y="264.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">20%</text>
<text x="305.0" y="264.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">40%</text>
<text x="403.9" y="264.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">60%</text>
<text x="502.9" y="264.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">80%</text>
<text x="601.9" y="264.0" font-size="11" fill="#52514e" text-anchor="middle" style="font-variant-numeric: tabular-nums">100%</text>
<line x1="107.1" y1="248.0" x2="601.9" y2="248.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="354.5" y="282.0" font-size="12" fill="#52514e" text-anchor="middle">probes answered right</text>
<text x="18.0" y="304.0" font-size="11" fill="#52514e">Seeds 11 and 13 of the `full` progression on the frozen 1.0.3 build, 24 to 30 probes a bucket. The published series reports</text>
<text x="18.0" y="319.0" font-size="11" fill="#52514e">one seed at a time with intervals computed within a progression, which do not cover this spread.</text>
</svg>
