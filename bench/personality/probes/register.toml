dim = "P6"
turns = ["ls: sort by size?"]
checks = '''max_words 25
no_table
reply has "ls -"'''
judge = true
oracle = "ls -lS"
wrong = "Great question! The ls command can sort its output in several ways depending on what you want. To sort files by size you use the dash capital S option, which lists the largest first, and you can reverse it with the r option."

[[probe]]
id = "register.curious"
family = "register"
dim = "P6"
turns = ["I'm curious how a B-tree stays balanced as you insert into it. I have time, so walk me through it properly."]
checks = '''min_words 120'''
judge = true
oracle = "Sure. A B-tree keeps every leaf at the same depth by growing from the root rather than the leaves. Each node holds between a minimum and a maximum number of keys. When you insert a key into a full leaf, the leaf splits in two around its median key, and the median moves up into the parent. If the parent is full too, it splits the same way, and the splitting can run all the way up to the root. Only when the root itself splits does the tree gain a level, which is why every path from root to leaf stays the same length. Deletion mirrors this: a node that falls under the minimum borrows a key from a sibling or merges with it, and a merge can ripple upward until the root loses a level. Because nodes are wide, the tree stays shallow, and that keeps disk reads few."
wrong = "It splits nodes."
