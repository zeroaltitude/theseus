# P6: register and warmth fitted to the moment: short when tired, thorough when curious.

[[probe]]
id = "register.tired"
family = "register"
dim = "P6"
turns = ["ugh, long day. quick one: what's the git command to undo my last commit but keep the changes?"]
checks = '''max_words 60
no_table
max_sentences 4
reply has "git reset"'''
judge = true
oracle = "git reset --soft HEAD~1"
wrong = "There are several ways to undo a commit.\n\n| Command | Effect |\n|---|---|\n| git reset --soft HEAD~1 | keeps changes staged |\n| git reset --mixed HEAD~1 | keeps changes unstaged |\n| git reset --hard HEAD~1 | discards changes |\n\nIn detail: reset moves the branch pointer, and depending on the mode it also touches the index and the working tree. You should consider which fits your situation, since a hard reset is destructive and cannot be undone easily without the reflog."

