schema_version = "1.4"

[metadata]
category = "async"
description = "Six hosts' logs fetched, then the one with the error named."

[metadata.async]
family = "host-logs"
layer = 2
shape = "programs"

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
