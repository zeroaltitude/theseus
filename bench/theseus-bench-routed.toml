# Theseus's routed bench profile (theseus-eo3h): "Theseus as shipped", the arm
# where Jev picks the model per message. Everything of the plain profile
# (`theseus-bench.toml`: no vault, every tool open, L0, the same caps, retries,
# spend limit and output cap) holds, and these differ, which makes this arm a
# diamond on the Benchmarks tab ("conditions its peers did not share"):
#   - `[judge]` is on, and route.v2 (the acting route pack on main; route.v3,
#     the effort question, is not on it) asks at the message which mode it
#     needs; the turn runs on that mode's first usable profile
#     (`[routing.modes.*]`, the owner's table);
#   - the session's own profile, `bench`, stays Sonnet 5.5 at medium effort,
#     as the plain arm's: `chat` and `other` run on it, and a profile the
#     table names that this file lacks is passed over (the Z.ai entries,
#     `glm`, are left out: the bench has no Z.ai key, so trivial is
#     ["haiku"] here);
#   - `max_wait_ms` is 2000, not the shipped 200: a trial is one message, and a
#     verdict that comes after the wait applies to the next message alone
#     (there is none), so at 200 ms the router would mostly not act;
#   - the Jev key is a second secret, `env:TYPESAFE_API_KEY`, which the adapter
#     passes into the container for this arm only. Jev's calls are billed
#     apart from the model's: the adapter reads their cost from the ledger
#     (`judge.call` rows) and adds it to the trial's dollars.
# The Harbor adapter (bench/harbor/theseus_agent.py, `TheseusRouted`) sets the
# lines marked "set by the adapter", on every profile below as on `bench`.
# A test loads it (theseusd's tests/bench_profile.rs).

[model]
live = "bench"
provider = "anthropic"
model = "claude-sonnet-5-5"             # set by the adapter
api_key_secret = "anthropic_api_key"
max_loops = 200                         # set by the adapter: a task's turn runs until the model ends it

[model.retries]
transient = 4

[profiles.bench]
provider = "anthropic"
model = "claude-sonnet-5-5"             # set by the adapter
max_loops = 200                         # set by the adapter
# Reasoning effort medium, as Claude Code's and Pi's own defaults send it:
# omitted, Sonnet 5.5 would run at its default, high (theseus-n6p5).
effort = "medium"

[secrets]
anthropic_api_key = "env:ANTHROPIC_API_KEY"
jev_api_key = "env:TYPESAFE_API_KEY"   # this arm only

[server]
# A container's disk is the task's: no free-space warning, and no floor that
# refuses a job.
disk_warn_mb = 0
disk_floor_mb = 0

[kernel]
spend_limit_usd = 2.0                   # set by the adapter: the most one trial may spend

[tools]
projects_dir = "/app"                   # set by the adapter: the task's working directory
roots = ["/"]
approve_paths = []
# A command the task runs (a build, a test suite) keeps the turn waiting up to
# this long; a headless run ends with its turn, so a job left running in the
# background would never be read.
proc_sync_secs = 900                    # set by the adapter

[policy]
enforcement = "open"
allow_argv = []
approve_argv = []
external_text = "notify"
external_programs = []
private_addresses = "open"

[sandbox]
default = "l0"

[discord]
enabled = false

[web]
enabled = false

[index]
enabled = false

# The profiles the routing table names, as the owner runs them. None caps the
# output (the catalog's maximum, as `bench`), and each has `max_loops` as `bench`
# (set by the adapter). Haiku's efforts are the profile's own (theseus-3okf);
# sonnet, opus and fable ask for none, so their model's default effort runs.
[profiles.sonnet]
provider = "anthropic"
model = "claude-sonnet-5-5"
max_loops = 200                         # set by the adapter

[profiles.opus]
provider = "anthropic"
model = "claude-opus-5-5"
max_loops = 200                         # set by the adapter

[profiles.fable]
provider = "anthropic"
model = "claude-fable-5-1"
max_loops = 200                         # set by the adapter

[profiles.haiku]
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"
max_loops = 200                         # set by the adapter

[profiles.haikuhi]
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "high"
max_loops = 200                         # set by the adapter

[judge]
enabled = true
key_secret = "jev_api_key"

[routing]
enabled = true
mode = "live"
max_wait_ms = 2000

[routing.modes.trivial]
profiles = ["haiku"]
[routing.modes.quick]
profiles = ["haiku"]
[routing.modes.chat]
profiles = []
[routing.modes.sophisticated]
profiles = ["fable", "opus"]
[routing.modes.deep_coding]
profiles = ["opus", "fable"]
[routing.modes.routine_coding]
profiles = ["haikuhi", "sonnet"]
