# nextest's settings for the gate (theseus-qa0). Serve-first tests run a
# vault that never answers on purpose, so a test that hangs is killed at two
# minutes and fails, instead of stalling the gate.
[profile.default]
# Half the cores, as cargo's own cap (~/.cargo/config.toml, 2026-09-28).
test-threads = 8
slow-timeout = { period = "60s", terminate-after = 2 }
# A test's leftover child processes (a daemon, an `op`) get this long to exit.
leak-timeout = "500ms"

# The flaky list (theseus-goa8; review 2's C7). A test that fails under load by
# construction, and has an issue that fixes it, retries here, so a gate does not
# fail for it and does not hide that it flaked: nextest names each test that passed
# on a retry (`FLAKY 2/3`), and the gate prints and logs it (scripts/AGENTS.md,
# "The flaky list"). Retries are for named tests only: a blanket retry would hide
# a real race. A test goes on this list in the commit that files its issue, with
# the issue's id in a comment; it comes off in the commit that fixes it.
#
# theseus-a2ec: it asserts that a start from the config copy answers in under 500 ms, the fake
# vault's delay, so a start slowed by a loaded machine (508 ms at load 25 to 34) fails it.
[[profile.default.overrides]]
filter = 'package(theseusd) & test(=the_copy_serves_the_next_start_and_a_changed_note_restarts_the_daemon_in_place)'
retries = 2
#
# theseus-6a7o: a duration in the transcript's text has a digit more or less with the load, so
# the output golden's request size for the parent's turn that reads a report moves by a byte
# (17,219 run alone, 17,220 in a full suite; security3's join, 2026-10-02 12:08).
[[profile.default.overrides]]
filter = 'package(theseus-core) & test(=tests_output::the_cores_output_matches_its_golden)'
retries = 2
#
# theseus-tphr: health's refused_records is compared with total - shown from an earlier ledger.tail,
# two reads that are not one snapshot, so a row written after serving between them counts once more
# (5 against 6; spine gh7s's fourth gate, 2026-10-03 00:53, load 3.6).
[[profile.default.overrides]]
filter = 'package(theseusd) & test(=the_history_check_after_serving_finds_a_corrupt_frame_and_says_so)'
retries = 2
