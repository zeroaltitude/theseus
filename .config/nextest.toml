# nextest's settings for the gate (theseus-qa0). Serve-first tests run a
# vault that never answers on purpose, so a test that hangs is killed at two
# minutes and fails, instead of stalling the gate.
[profile.default]
# Half the cores, as cargo's own cap (~/.cargo/config.toml, 2026-09-28).
test-threads = 8
slow-timeout = { period = "60s", terminate-after = 2 }
# A test's leftover child processes (a daemon, an `op`) get this long to exit.
leak-timeout = "500ms"

# A gate writes a JUnit report, so a flake becomes a row with its attempts recorded: nextest puts each retried
# test's attempts in the file (a `flakyFailure` or `rerunFailure` element per failed try) and the timing of
# each. It lands at target/nextest/default/junit.xml, inside the ignored target directory. scripts/gate.sh
# does not read it (the FLAKY lines on stdout are what it parses); a person or a later phase may.
[profile.default.junit]
path = "junit.xml"

# The flaky list (theseus-goa8; review 2's C7). A test that fails under load by
# construction, and has an issue that fixes it, retries here, so a gate does not
# fail for it and does not hide that it flaked: nextest names each test that passed
# on a retry (`FLAKY 2/3`), and the gate prints and logs it (scripts/AGENTS.md,
# "The flaky list"). Retries are for named tests only: a blanket retry would hide
# a real race. A test goes on this list in the commit that files its issue, with
# the issue's id in a comment; it comes off in the commit that fixes it.


# theseus-75t4q (the owner, 2026-11-03 00:03): tests_onto_names' two-nights chain test hangs to the 120 s
# slow-timeout kill under load and passes alone in under a second. Measured alone on plain main it was 8 of 11
# passed with 3 timing out at 120 s, the passing runs spreading from 1.6 s to 58 s: the bimodal-wait shape of
# the theseus-70qg1 family, not a wrong answer. INSTANCE COUNT: 3 timeouts in 11 runs alone on plain main and
# 3 in 10 on a five-lane tree (2026-10-25), and 120 s timeouts in the 1.0.4 wave's loaded gates (ev3ir attempt 3,
# kn9or row 6); this is the list's first entry. Remove it in the commit that fixes the family. slow-timeout
# is untouched: a hang still ends at 120 s, and is retried.
[[profile.default.overrides]]
filter = 'package(theseus-core) & test(=tests_onto_names::a_chain_asked_over_two_nights_clusters)'
retries = 2
