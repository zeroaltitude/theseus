AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  theseus-posture: the detective controls (Theseus's AWS design, theseus-mgw.1, section 3.6), in
  the lean posture of C2 (theseus-nyzn). The trail, with its own bucket (SSE-S3; a customer KMS
  key when TrailKey is customer); the CIS checks, as EventBridge rules on CloudTrail's management
  events, to the alerts topic; IAM Access Analyzer; GuardDuty (question 11's default); and EBS
  snapshots' public-sharing block. It needs theseus-foundation's alerts topic. The global
  services' events arrive in us-east-1, and theseus-posture-relay brings them to this region's
  default bus, where these rules see them.

Parameters:
  FoundationStack:
    Type: String
    Default: theseus-foundation
    Description: The foundation stack, whose alerts topic the checks and findings go to.
  OwnerUserName:
    Type: String
    Description: >-
      The IAM user whose key is Theseus's root of trust. A check fires when the key signs anything
      but sts:GetCallerIdentity, or sts:AssumeRole into theseus-owner (design section 3.5).
    AllowedPattern: "[A-Za-z0-9+=,.@_-]+"
    MinLength: 1
    MaxLength: 64
  TrailKey:
    Type: String
    Default: aws-managed
    AllowedValues: [aws-managed, customer]
    Description: >-
      How the trail's log files are encrypted at rest: aws-managed is SSE-S3 (AES-256, keys AWS
      holds, free); customer makes the trail its own KMS key, about $1 a month plus $1 for each
      of its first two rotations.
  GuardDuty:
    Type: String
    Default: enabled
    AllowedValues: [enabled, disabled]
    Description: >-
      GuardDuty's detector. An account has one per region, so disable this if one already exists.
  AccessAnalyzer:
    Type: String
    Default: enabled
    AllowedValues: [enabled, disabled]
    Description: The account's external-access analyzer, which is free.
  SnapshotPublicSharing:
    Type: String
    Default: block-all-sharing
    AllowedValues: [block-all-sharing, block-new-sharing, unmanaged]
    Description: >-
      The region's EBS snapshot block-public-access state; unmanaged leaves it alone. It is an
      account setting, so it covers every snapshot in the region, Theseus's or not.

Conditions:
  CustomerTrailKey: !Equals [!Ref TrailKey, customer]
  GuardDutyEnabled: !Equals [!Ref GuardDuty, enabled]
  AccessAnalyzerEnabled: !Equals [!Ref AccessAnalyzer, enabled]
  SnapshotSharingManaged: !Not [!Equals [!Ref SnapshotPublicSharing, unmanaged]]

Resources:
  # ---------------------------------------------------------------------------------------------
  # The trail, its bucket, and its key when TrailKey is customer. The stack policy in
  # stack-policies/theseus-posture.json forbids replacing or deleting the trail, the bucket, and
  # the key, and theseus-guard-limits keeps Theseus's sessions off all of them.
  # ---------------------------------------------------------------------------------------------

  TrailKmsKey:
    Type: AWS::KMS::Key
    Condition: CustomerTrailKey
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: The trail's own key; CloudTrail encrypts its log files with it.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: TheAccountAdministersThroughIam
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"
          - Sid: CloudTrailEncryptsThisTrailsLogs
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/theseus-trail"
              StringLike:
                kms:EncryptionContext:aws:cloudtrail:arn: !Sub "arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/*"
          - Sid: CloudTrailDescribesTheKey
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/theseus-trail"
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  TrailKmsKeyAlias:
    Type: AWS::KMS::Alias
    Condition: CustomerTrailKey
    Properties:
      AliasName: alias/theseus-trail
      TargetKeyId: !Ref TrailKmsKey

  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "theseus-trail-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - !If
            - CustomerTrailKey
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: aws:kms
                KMSMasterKeyID: !GetAtt TrailKmsKey.Arn
              BucketKeyEnabled: true
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudTrailChecksTheAcl
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/theseus-trail"
          - Sid: CloudTrailWritesThisTrailsLogs
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/theseus-trail"
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt TrailBucket.Arn
              - !Sub "${TrailBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: TheLogsAreNeverDeleted
            Effect: Deny
            Principal: "*"
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource: !Sub "${TrailBucket.Arn}/*"
          - Sid: VersioningStaysOn
            Effect: Deny
            Principal: "*"
            Action: s3:PutBucketVersioning
            Resource: !GetAtt TrailBucket.Arn

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: theseus-trail
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      KMSKeyId: !If [CustomerTrailKey, !GetAtt TrailKmsKey.Arn, !Ref AWS::NoValue]
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  # ---------------------------------------------------------------------------------------------
  # The CIS checks (the CIS AWS Foundations Benchmark's monitoring section), and two of Theseus's
  # own: the root-of-trust key signing anything but its two STS calls, and any change to the
  # budget or its stop. Each is an EventBridge rule on CloudTrail's management events, to the
  # alerts topic, which emails the operator and feeds the completion queue. A rule costs nothing,
  # and AWS's events to the default bus are free, so a quiet account's checks cost nothing. Each
  # alert names its rule: {"check": <rule name>, "event": <the CloudTrail event>}.
  #
  # Rules are regional. These see this region's events, and theseus-posture-relay brings
  # us-east-1's here, where the global services (IAM, Organizations, Budgets, the console's
  # sign-in) record theirs. The three checks that read-only calls can trip (a refused call, the
  # root user, the root-of-trust key) take every management event, reads included.
  # ---------------------------------------------------------------------------------------------

  UnauthorizedApiCallsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-unauthorized-api-calls
      Description: An API call was refused, including by Theseus's guards.
      State: ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          errorCode:
            - suffix: UnauthorizedOperation
            - prefix: AccessDenied
          sourceIPAddress:
            - anything-but: delivery.logs.amazonaws.com
          eventName:
            - anything-but: HeadBucket
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  ConsoleSignInWithoutMfaRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-console-sign-in-without-mfa
      Description: An IAM user signed in to the console without MFA.
      State: ENABLED
      EventPattern:
        detail-type:
          - AWS Console Sign In via CloudTrail
        detail:
          eventName:
            - ConsoleLogin
          userIdentity:
            type:
              - IAMUser
          responseElements:
            ConsoleLogin:
              - Success
          additionalEventData:
            MFAUsed:
              - anything-but: "Yes"
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  RootUsageRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-root-usage
      Description: The account's root user was used.
      State: ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
          - AWS Console Sign In via CloudTrail
        detail:
          userIdentity:
            type:
              - Root
            invokedBy:
              - exists: false
          eventType:
            - anything-but: AwsServiceEvent
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  IamPolicyChangesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-iam-policy-changes
      Description: An IAM policy was created, changed, attached, or removed.
      State: ENABLED
      EventPattern:
        source:
          - aws.iam
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - DeleteGroupPolicy
            - DeleteRolePolicy
            - DeleteUserPolicy
            - PutGroupPolicy
            - PutRolePolicy
            - PutUserPolicy
            - CreatePolicy
            - DeletePolicy
            - CreatePolicyVersion
            - DeletePolicyVersion
            - SetDefaultPolicyVersion
            - AttachRolePolicy
            - DetachRolePolicy
            - AttachUserPolicy
            - DetachUserPolicy
            - AttachGroupPolicy
            - DetachGroupPolicy
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  TrailChangesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-trail-changes
      Description: A CloudTrail trail was created, changed, stopped, or deleted.
      State: ENABLED
      EventPattern:
        source:
          - aws.cloudtrail
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - CreateTrail
            - UpdateTrail
            - DeleteTrail
            - StartLogging
            - StopLogging
            - PutEventSelectors
            - PutInsightSelectors
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  ConsoleAuthFailuresRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-console-auth-failures
      Description: A console sign-in failed authentication.
      State: ENABLED
      EventPattern:
        detail-type:
          - AWS Console Sign In via CloudTrail
        detail:
          eventName:
            - ConsoleLogin
          errorMessage:
            - Failed authentication
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  KeyDisableOrDeletionRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-key-disable-or-deletion
      Description: A KMS key was disabled or scheduled for deletion.
      State: ENABLED
      EventPattern:
        source:
          - aws.kms
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - DisableKey
            - ScheduleKeyDeletion
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  S3BucketPolicyChangesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-s3-bucket-policy-changes
      Description: >-
        A bucket's policy, ACL, CORS, lifecycle, replication, or public access block changed, or the
        account's.
      State: ENABLED
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - PutBucketAcl
            - PutBucketPolicy
            - PutBucketCors
            - PutBucketLifecycle
            - PutBucketReplication
            - DeleteBucketPolicy
            - DeleteBucketCors
            - DeleteBucketLifecycle
            - DeleteBucketReplication
            - PutBucketPublicAccessBlock
            - DeleteBucketPublicAccessBlock
            - PutAccountPublicAccessBlock
            - DeleteAccountPublicAccessBlock
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  ConfigChangesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-config-changes
      Description: AWS Config's recorder or delivery channel changed.
      State: ENABLED
      EventPattern:
        source:
          - aws.config
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - StopConfigurationRecorder
            - DeleteDeliveryChannel
            - PutDeliveryChannel
            - PutConfigurationRecorder
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  SecurityGroupChangesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-security-group-changes
      Description: A security group or one of its rules changed.
      State: ENABLED
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - AuthorizeSecurityGroupIngress
            - AuthorizeSecurityGroupEgress
            - RevokeSecurityGroupIngress
            - RevokeSecurityGroupEgress
            - CreateSecurityGroup
            - DeleteSecurityGroup
            - ModifySecurityGroupRules
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  NaclChangesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-nacl-changes
      Description: A network ACL or one of its entries changed.
      State: ENABLED
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - CreateNetworkAcl
            - CreateNetworkAclEntry
            - DeleteNetworkAcl
            - DeleteNetworkAclEntry
            - ReplaceNetworkAclEntry
            - ReplaceNetworkAclAssociation
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  NetworkGatewayChangesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-network-gateway-changes
      Description: >-
        A network gateway changed. The hands network's NAT toggle trips this, once per toggle.
      State: ENABLED
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - CreateCustomerGateway
            - DeleteCustomerGateway
            - AttachInternetGateway
            - CreateInternetGateway
            - DeleteInternetGateway
            - DetachInternetGateway
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  RouteTableChangesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-route-table-changes
      Description: >-
        A route or route table changed. The hands network's NAT toggle trips this, once per toggle.
      State: ENABLED
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - CreateRoute
            - CreateRouteTable
            - ReplaceRoute
            - ReplaceRouteTableAssociation
            - DeleteRouteTable
            - DeleteRoute
            - DisassociateRouteTable
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  VpcChangesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-vpc-changes
      Description: A VPC or a peering connection changed.
      State: ENABLED
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - CreateVpc
            - DeleteVpc
            - ModifyVpcAttribute
            - AcceptVpcPeeringConnection
            - CreateVpcPeeringConnection
            - DeleteVpcPeeringConnection
            - RejectVpcPeeringConnection
            - AttachClassicLinkVpc
            - DetachClassicLinkVpc
            - DisableVpcClassicLink
            - EnableVpcClassicLink
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  OrganizationsChangesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-organizations-changes
      Description: The account's AWS Organizations membership or policies changed.
      State: ENABLED
      EventPattern:
        source:
          - aws.organizations
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - AcceptHandshake
            - AttachPolicy
            - CreateAccount
            - CreateOrganizationalUnit
            - CreatePolicy
            - DeclineHandshake
            - DeleteOrganization
            - DeleteOrganizationalUnit
            - DeletePolicy
            - DetachPolicy
            - DisablePolicyType
            - EnablePolicyType
            - InviteAccountToOrganization
            - LeaveOrganization
            - MoveAccount
            - RemoveAccountFromOrganization
            - UpdatePolicy
            - UpdateOrganizationalUnit
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  # The root of trust (design section 3.5): once the foundation exists, the vault's key signs only
  # sts:GetCallerIdentity, and sts:AssumeRole into theseus-owner. Anything else it signs, reads
  # included, and an AssumeRole into any other role, is an alert.
  RootOfTrustKeyRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-root-of-trust-key-use
      Description: >-
        The root-of-trust user's key signed something other than sts:GetCallerIdentity, or
        sts:AssumeRole into theseus-owner (design section 3.5).
      State: ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
          - AWS Console Sign In via CloudTrail
        detail:
          userIdentity:
            type:
              - IAMUser
            userName:
              - !Ref OwnerUserName
          $or:
            - eventName:
                - anything-but:
                    - AssumeRole
                    - GetCallerIdentity
            - eventName:
                - AssumeRole
              requestParameters:
                roleArn:
                  - anything-but: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/theseus-owner"
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  BudgetChangesRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theseus-posture-budget-changes
      Description: >-
        A budget or a budget action changed or ran, or theseus-deny-spend was detached or rewritten.
        The budget's reconcile trips this when it changes the amount.
      State: ENABLED
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
        $or:
          - source:
              - aws.budgets
            detail:
              eventName:
                - UpdateBudget
                - DeleteBudget
                - UpdateBudgetAction
                - DeleteBudgetAction
                - ExecuteBudgetAction
          - source:
              - aws.iam
            detail:
              eventName:
                - DetachRolePolicy
                - CreatePolicyVersion
                - SetDefaultPolicyVersion
                - DeletePolicy
              requestParameters:
                policyArn:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/theseus-deny-spend"
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  # ---------------------------------------------------------------------------------------------
  # Access Analyzer, GuardDuty, and their findings to the alerts topic. GuardDuty bills by the
  # events it analyzes; the core reads its usage weekly (GetUsageStatistics, free), and health
  # warns when the month's projection passes $1.
  # ---------------------------------------------------------------------------------------------

  ExternalAccessAnalyzer:
    Type: AWS::AccessAnalyzer::Analyzer
    Condition: AccessAnalyzerEnabled
    Properties:
      AnalyzerName: theseus-external-access
      Type: ACCOUNT
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Condition: GuardDutyEnabled
    Properties:
      Enable: true
      FindingPublishingFrequency: FIFTEEN_MINUTES
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  GuardDutyFindingsRule:
    Type: AWS::Events::Rule
    Condition: GuardDutyEnabled
    Properties:
      Name: theseus-posture-guardduty-findings
      Description: GuardDuty findings of medium severity and up, to the alerts topic.
      State: ENABLED
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Finding
        detail:
          severity:
            - numeric: [">=", 4]
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  AccessAnalyzerFindingsRule:
    Type: AWS::Events::Rule
    Condition: AccessAnalyzerEnabled
    Properties:
      Name: theseus-posture-access-analyzer-findings
      Description: Active external-access findings, to the alerts topic.
      State: ENABLED
      EventPattern:
        source:
          - aws.access-analyzer
        detail-type:
          - Access Analyzer Finding
        detail:
          status:
            - ACTIVE
      Targets:
        - Id: alerts
          Arn:
            Fn::ImportValue: !Sub "${FoundationStack}-AlertsTopicArn"
          InputTransformer:
            InputTemplate: '{"check": "<aws.events.rule-name>", "event": <aws.events.event.json>}'
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  # ---------------------------------------------------------------------------------------------
  # Account settings that have a CloudFormation type. S3's account-level Block Public Access and
  # EBS encryption by default have none; infra/aws/bootstrap.md sets them once.
  # ---------------------------------------------------------------------------------------------

  SnapshotBlockPublicAccess:
    Type: AWS::EC2::SnapshotBlockPublicAccess
    Condition: SnapshotSharingManaged
    Properties:
      State: !Ref SnapshotPublicSharing

Outputs:
  TrailArn:
    Value: !GetAtt Trail.Arn
  TrailBucketName:
    Value: !Ref TrailBucket
  TrailKeyArn:
    Condition: CustomerTrailKey
    Value: !GetAtt TrailKmsKey.Arn
