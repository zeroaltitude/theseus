organizations:CreateOrganization","organizations:AcceptHandshake","organizations:LeaveOrganization","account:PutAlternateContact","account:DeleteAlternateContact","account:PutContactInformation"],"Resource":"*"},{"Sid":"PublicIp","Effect":"Deny","Action":"ec2:RunInstances","Resource":"*","Condition":{"Bool":{"ec2:AssociatePublicIpAddress":"true"}}},{"Sid":"LbInternetFacing","Effect":"Deny","Action":"elasticloadbalancing:CreateLoadBalancer","Resource":"*","Condition":{"StringNotEquals":{"elasticloadbalancing:Scheme":"internal"}}},{"Sid":"LambdaUrlPublic","Effect":"Deny","Action":["lambda:CreateFunctionUrlConfig","lambda:UpdateFunctionUrlConfig"],"Resource":"*","Condition":{"StringEquals":{"lambda:FunctionUrlAuthType":"NONE"}}},{"Sid":"ApiPublic","Effect":"Deny","Action":"apigateway:POST","Resource":["arn:aws:apigateway:*::/restapis","arn:aws:apigateway:*::/apis"]},{"Sid":"KmsGrantDirect","Effect":"Deny","Action":"kms:CreateGrant","Resource":"*","Condition":{"Bool":{"kms:GrantIsForAWSResource":"false"}}},{"Sid":"TrailStorage","Effect":"Deny","Action":["s3:PutBucketPolicy","s3:DeleteBucketPolicy","s3:PutLifecycleConfiguration","s3:PutBucketVersioning","s3:DeleteObject","s3:DeleteObjectVersion","s3:DeleteBucket"],"Resource":"arn:aws:s3:::theseus-trail-*"},{"Sid":"TrailKey","Effect":"Deny","Action":["kms:ScheduleKeyDeletion","kms:DisableKey","kms:PutKeyPolicy"],"Resource":"*","Condition":{"ForAnyValue:StringLike":{"kms:ResourceAliases":"alias/theseus-trail*"}}},{"Sid":"AlertTamper","Effect":"Deny","Action":["events:DeleteRule","events:DisableRule","events:PutRule","events:PutTargets","events:RemoveTargets","sns:DeleteTopic","sns:SetTopicAttributes","sns:Unsubscribe"],"Resource":["arn:aws:events:*:*:rule/theseus-posture-*","arn:aws:sns:*:*:theseus-alerts"]},{"Sid":"BudgetStopDetach","Effect":"Deny","Action":"iam:DetachRolePolicy","Resource":"*","Condition":{"ArnLike":{"iam:PolicyARN":"arn:aws:iam::*:policy/theseus-deny-spend"}}},{"Sid":"GuardPolicies","Effect":"Deny","Act