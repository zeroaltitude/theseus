    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: theseus-guard-limits
      Description: >-
        Deny-only: the operator's two hard limits, the budget and the SOC2 stance (public ingress,
        the audit trail, encryption, long-lived credentials), and the guards' own integrity, as far as
        IAM can see them (design section 3.6). On every work and job session.
