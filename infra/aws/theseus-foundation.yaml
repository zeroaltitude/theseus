AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  theseus-foundation: the owner and deployer roles, the guards, the Theseus bucket and
  durability table, the completion queue and its dead-letter queue, the alerts topic, and the
  monthly budget with its AWS-side stop. Theseus's AWS design (theseus-mgw.1), sections 3.4-3.7;
  built by P4 (theseus-mgw.4), lean since C2 (theseus-nyzn): no customer key. The bootstrap
  creates it once with the user key; the deployer role applies every later change set.

Parameters:
  OwnerUserName:
    Type: String
    Description: >-
      The IAM user whose key is Theseus's root of trust, and the only principal that may assume
      theseus-owner. The bootstrap fills it from GetCallerIdentity.
    AllowedPattern: "[A-Za-z0-9+=,.@_-]+"
    MinLength: 1
    MaxLength: 64
  MonthlyBudgetUsd:
    Type: Number
    Default: 50
    MinValue: 1
    Description: >-
      The month's budget in USD. The budget's reconcile keeps it equal to monthly_budget_usd in the
      config (design section 3.7).
  DailyBudgetUsd:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      The day's budget in USD, which only alerts (step 40 part 2); 0 makes none. The budget's
      reconcile keeps it equal to daily_budget_usd in the config. AWS Budgets may charge for a
      budget past an account's first two.
  AlertEmail:
    Type: String
    Default: ""
    Description: >-
      The operator's address on the alerts topic. Empty means no email subscription. SNS mails a
      confirmation link once, which the operator must open.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  HasDailyBudget: !Not [!Equals [!Ref DailyBudgetUsd, "0"]]

Resources:
  # ---------------------------------------------------------------------------------------------
  # Roles (design section 3.5, appendix B)
  # ---------------------------------------------------------------------------------------------

  OwnerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: theseus-owner
      Description: >-
        The owner's own hat: administrator, assumed only by the root-of-trust user, with a source
        identity, so every session carries its execution's name. Not a limited identity.
      MaxSessionDuration: 43200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TheRootOfTrustOnlyWithASourceIdentity
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${OwnerUserName}"
            Action:
              - sts:AssumeRole
              - sts:SetSourceIdentity
            Condition:
              "Null":
                sts:SourceIdentity: "false"
          # Session tags are authorized as their own action, whose request context has no
          # sts:SourceIdentity: under the statement above, the Null condition refused every tagged
          # session (found at the first bootstrap, 2026-10-03). The source identity is still required,
          # by sts:AssumeRole above; this statement only lets the sessions carry Theseus's own tags.
          - Sid: TheRootOfTrustTagsItsSessions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:user/${OwnerUserName}"
            Action: sts:TagSession
            Condition:
              ForAllValues:StringLike:
                aws:TagKeys: "theseus:*"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  DeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: theseus-cfn-deployer
      Description: >-
        CloudFormation's service role: administrator, assumable only by CloudFormation. Theseus's
        sessions may pass it to CloudFormation and nothing else (theseus-guard-iac).
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFormationOnly
            Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"
        - !Ref GuardDeployerPolicy
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  BudgetActionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: theseus-budget-action
      Description: >-
        Runs the budget's actions: it may attach theseus-deny-spend to Theseus's roles, and detach
        it when an action is reversed, and nothing else.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BudgetsOnly
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: attach-deny-spend
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenySpendOnTheseusRolesOnly
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/theseus-*"
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Ref DenySpendPolicy
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  # ---------------------------------------------------------------------------------------------
  # The guards, allow-all, and the boundary (design sections 3.4-3.6, appendix C).
  #
  # The guards' and the boundary's documents are generated from
  # crates/theseus-aws-guard/guardrails.toml, the one list both enforcers read, and never edited by
  # hand: the guard crate's test the_policies_on_disk_are_what_the_list_generates fails when a line
  # here is out of step with the list, and THESEUS_GUARD_WRITE=1 rewrites them. Each is minified
  # JSON on one line, inside IAM's 6,144 characters.
  #
  # A work session carries theseus-guard-limits, the theseus-guard-iac parts, and theseus-allow-all;
  # a job session adds theseus-guard-stacks. A session's allows come from exactly one allow policy
  # (theseus-allow-all, or a job's narrowing), so the guards hold however AWS combines the session
  # policies.
  # ---------------------------------------------------------------------------------------------

