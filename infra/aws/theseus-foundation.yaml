              - route53domains:TransferDomain
              - aws-marketplace:Subscribe
            Resource: "*"

  # ---------------------------------------------------------------------------------------------
  # The Theseus key, bucket, and durability table (design sections 3.3, steps 15-16; appendix B)
  # ---------------------------------------------------------------------------------------------

  TheseusKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: >-
        Theseus's key: the Theseus bucket, the durability table, and the alerts topic.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: TheAccountAdministersThroughIam
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"
          - Sid: ServicesPublishToTheAlertsTopic
            Effect: Allow
            Principal:
              Service:
                - budgets.amazonaws.com
                - cloudwatch.amazonaws.com
                - events.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:EncryptionContext:aws:sns:topicArn: !Sub "arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:theseus-alerts"
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  TheseusKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/theseus
      TargetKeyId: !Ref TheseusKey

  TheseusBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "theseus-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt TheseusKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: expire-hand-results
            Status: Enabled
            Prefix: hands/
            ExpirationInDays: 30
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  TheseusBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TheseusBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt TheseusBucket.Arn
              - !Sub "${TheseusBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  DurabilityTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: theseus-durability
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt TheseusKey.Arn
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  # ---------------------------------------------------------------------------------------------
  # The completion queue and the alerts topic (design sections 3.3, 3.7)
  # ---------------------------------------------------------------------------------------------

  # The queues are deleted with the stack, on purpose: a completion lost with them is settled by
  # the reconciler, which asks the service about every overdue record (design section 3.3).
  CompletionQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: theseus-completions
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CompletionDeadLetterQueue.Arn
        maxReceiveCount: 5
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  CompletionDeadLetterQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      QueueName: theseus-completions-dlq
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:theseus-completions"
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  CompletionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CompletionQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TheseusEventRules
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CompletionQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/theseus-*"
          - Sid: TheAlertsTopic
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CompletionQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref AlertsTopic

  CompletionDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CompletionDeadLetterQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TheseusEventRulesUndelivered
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt CompletionDeadLetterQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/theseus-*"

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: theseus-alerts
      DisplayName: Theseus alerts
      KmsMasterKeyId: !GetAtt TheseusKey.Arn
      Tags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TheAccountThroughIam
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - sns:Publish
              - sns:Subscribe
              - sns:GetTopicAttributes
              - sns:ListSubscriptionsByTopic
            Resource: !Ref AlertsTopic
          - Sid: TheBudget
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:budgets::${AWS::AccountId}:*"
          - Sid: TheAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: TheseusEventRules
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/theseus-*"

  AlertsToCompletionQueue:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: sqs
      Endpoint: !GetAtt CompletionQueue.Arn

  AlertsToOperatorEmail:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ---------------------------------------------------------------------------------------------
  # The monthly budget and its AWS-side stop (design section 3.7)
  # ---------------------------------------------------------------------------------------------

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: theseus-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertsTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertsTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertsTopic
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref AlertsTopic
      ResourceTags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

  BudgetStopAction:
    Type: AWS::Budgets::BudgetsAction
    Properties:
      BudgetName: !Ref MonthlyBudget
      NotificationType: ACTUAL
      ActionType: APPLY_IAM_POLICY
      ActionThreshold:
        Type: PERCENTAGE
        Value: 100
      ApprovalModel: AUTOMATIC
      ExecutionRoleArn: !GetAtt BudgetActionRole.Arn
      Definition:
        IamActionDefinition:
          PolicyArn: !Ref DenySpendPolicy
          Roles:
            - !Ref OwnerRole
            - !Ref DeployerRole
      Subscribers:
        - Type: SNS
          Address: !Ref AlertsTopic
      ResourceTags:
        - Key: "theseus:owner"
          Value: theseus
        - Key: "theseus:stack"
          Value: !Ref AWS::StackName

Outputs:
  OwnerRoleArn:
    Value: !GetAtt OwnerRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-OwnerRoleArn"
  DeployerRoleArn:
    Value: !GetAtt DeployerRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DeployerRoleArn"
  BudgetActionRoleArn:
    Value: !GetAtt BudgetActionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BudgetActionRoleArn"
  GuardIacArn:
    Value: !Ref GuardIacPolicy
    Export:
      Name: !Sub "${AWS::StackName}-GuardIacArn"
  GuardLimitsArn:
    Value: !Ref GuardLimitsPolicy
    Export:
      Name: !Sub "${AWS::StackName}-GuardLimitsArn"
  AllowAllArn:
    Value: !Ref AllowAllPolicy
    Export:
      Name: !Sub "${AWS::StackName}-AllowAllArn"
  BoundaryArn:
    Value: !Ref BoundaryPolicy
    Export:
      Name: !Sub "${AWS::StackName}-BoundaryArn"
  DenySpendArn:
    Value: !Ref DenySpendPolicy
    Export:
      Name: !Sub "${AWS::StackName}-DenySpendArn"
  KeyArn:
    Value: !GetAtt TheseusKey.Arn
    Export:
      Name: !Sub "${AWS::StackName}-KeyArn"
  BucketName:
    Value: !Ref TheseusBucket
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"
  BucketArn:
    Value: !GetAtt TheseusBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BucketArn"
  DurabilityTableName:
    Value: !Ref DurabilityTable
    Export:
      Name: !Sub "${AWS::StackName}-DurabilityTableName"
  DurabilityTableArn:
    Value: !GetAtt DurabilityTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DurabilityTableArn"
  CompletionQueueUrl:
    Value: !Ref CompletionQueue
    Export:
      Name: !Sub "${AWS::StackName}-CompletionQueueUrl"
  CompletionQueueArn:
    Value: !GetAtt CompletionQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CompletionQueueArn"
  CompletionDeadLetterQueueArn:
    Value: !GetAtt CompletionDeadLetterQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CompletionDeadLetterQueueArn"
  AlertsTopicArn:
    Value: !Ref AlertsTopic
    Export:
      Name: !Sub "${AWS::StackName}-AlertsTopicArn"
  BudgetName:
    Value: !Ref MonthlyBudget
    Export:
      Name: !Sub "${AWS::StackName}-BudgetName"
