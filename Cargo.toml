[workspace]
resolver = "2"
members = [
    "crates/theseus-protocol",
    "crates/theseus-memory",
    "crates/theseus-store",
    "crates/theseus-kernel",
    "crates/theseus-tools",
    "crates/theseus-sandbox",
    "crates/theseus-judge",
    "crates/theseus-sim",
    "crates/theseus-core",
    "crates/theseus-discord",
    "crates/theseus-ontology",
    "crates/theseusd",
    "crates/theseus",
    "crates/theseus-exam",
    "crates/theseus-mcp",
    "crates/theseus-lsp",
    "crates/theseus-follow",
    "crates/theseus-index",
    "crates/theseus-aws-guard",
    "crates/theseus-aws-catalog",
    "crates/theseus-aws",
    "crates/theseus-voice",
    "crates/theseus-tui",
    "crates/theseus-files",
]

# Beyond clippy's defaults, held by the gate's `-D warnings` (theseus-0g4).
[workspace.lints.clippy]
unused_async = "warn"
unused_self = "warn"
redundant_clone = "warn"
# The shape budget (theseus-goa8; review 2's C1): a function over 100 lines of code, or over 25 in cognitive
# complexity (thresholds in clippy.toml), fails the gate's `clippy -D warnings`. Today's offenders carry
# `#[expect(.., reason = "..")]`, so nothing was rewritten and the list can only get shorter: once a function is
# under the limit its `expect` is unfulfilled, and fails the gate until it is deleted. scripts/AGENTS.md, "The
# shape budget", says more, and `scripts/shape.sh` holds the file ceiling.
too_many_lines = "warn"
cognitive_complexity = "warn"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeroaltitude/theseus"
rust-version = "1.98"

[workspace.dependencies]
theseus-protocol = { path = "crates/theseus-protocol" }
theseus-core = { path = "crates/theseus-core" }
theseus-store = { path = "crates/theseus-store" }
theseus-kernel = { path = "crates/theseus-kernel" }
theseus-tools = { path = "crates/theseus-tools" }
theseus-sandbox = { path = "crates/theseus-sandbox" }
theseus-discord = { path = "crates/theseus-discord" }
theseus-files = { path = "crates/theseus-files" }

anyhow = "1"
base64 = "0.22"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a stored float reads as the value it was written from, so a
# record decodes and encodes again byte for byte (theseus-k52m).
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = { version = "1", features = ["derive"] }
redb = "4"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v7"] }
# Property tests over the readers of outside text (theseus-s68). Tests only;
# no forking runner, so each case runs in the test's own process.
proptest = { version = "1.11", default-features = false, features = ["std"] }

# Debug builds keep line tables for the workspace (backtraces still name file and line) and no debug info
# for dependencies. With full debug info, each test binary was about 400 MB, and the spine's target reached
# 84 GB (theseus-x10i). Debug assertions are unchanged: they come from the profile, not from debug info.
[profile.dev]
debug = "line-tables-only"

# Dependencies are optimized in debug builds too (theseus-1hk): the gate's lifecycle bench then times the start
# path more than unoptimized serde, sha2, and redb (a debug cold start's p50 went from 25.6 to 21.7 ms), and test
# binaries are a quarter smaller. A cold build takes about 3x the CPU, once. The workspace's crates stay at
# opt-level 0, so their debug assertions still run. Being outside the workspace, the dependencies' build scripts
# and proc macros take this section too, ahead of `build-override`.
[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# The install profile (theseus-goa8; review 2's S7), for an install by the chain or by anyone building for themselves:
# the release profile without fat LTO and its single codegen unit, so a build after a change takes minutes less.
# Cargo reserves the name `install`, hence this one. `scripts/build.sh --profile release-thin` builds it; a tagged
# release keeps `release`. The measurements, and what the bench says of the binary's speed, are in scripts/AGENTS.md.
[profile.release-thin]
inherits = "release"
lto = "thin"
codegen-units = 16
