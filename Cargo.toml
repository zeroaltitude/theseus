[workspace]
resolver = "2"
members = [
    "crates/theseus-protocol",
    "crates/theseus-memory",
    "crates/theseus-store",
    "crates/theseus-kernel",
    "crates/theseus-tools",
    "crates/theseus-sandbox",
    "crates/theseus-judge",
    "crates/theseus-sim",
    "crates/theseus-core",
    "crates/theseus-discord",
    "crates/theseus-ontology",
    "crates/theseusd",
    "crates/theseus",
    "crates/theseus-exam",
    "crates/theseus-mcp",
    "crates/theseus-lsp",
    "crates/theseus-follow",
    "crates/theseus-index",
    "crates/theseus-aws-guard",
    "crates/theseus-aws-catalog",
    "crates/theseus-aws",
    "crates/theseus-voice",
    "crates/theseus-tui",
    "crates/theseus-files",
    "crates/theseus-google",
]

# Beyond clippy's defaults, held by the gate's `-D warnings` (theseus-0g4).
[workspace.lints.clippy]
unused_async = "warn"
unused_self = "warn"
redundant_clone = "warn"
# The shape budget (theseus-goa8; review 2's C1): a function over 100 lines of code, or over 25 in cognitive
# complexity (thresholds in clippy.toml), fails the gate's `clippy -D warnings`. Today's offenders carry
# `#[expect(.., reason = "..")]`, so nothing was rewritten and the list can only get shorter: once a function is
# under the limit its `expect` is unfulfilled, and fails the gate until it is deleted. scripts/AGENTS.md, "The
# shape budget", says more, and `scripts/shape.sh` holds the file ceiling.
too_many_lines = "warn"
cognitive_complexity = "warn"

[workspace.package]
version = "1.0.3"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeroaltitude/theseus"
rust-version = "1.98"

[workspace.dependencies]
theseus-protocol = { path = "crates/theseus-protocol" }
theseus-core = { path = "crates/theseus-core" }
theseus-store = { path = "crates/theseus-store" }
theseus-kernel = { path = "crates/theseus-kernel" }
theseus-tools = { path = "crates/theseus-tools" }
theseus-sandbox = { path = "crates/theseus-sandbox" }
theseus-discord = { path = "crates/theseus-discord" }
theseus-files = { path = "crates/theseus-files" }

anyhow = "1"
# The public suffix list is compiled into the release: a new suffix reaches mail_auth only with a bump.
psl = "2"
base64 = "0.22"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a stored float reads as the value it was written from, so a
# record decodes and encodes again byte for byte (theseus-k52m).
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = { version = "1", features = ["derive"] }
redb = "4"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v7"] }
# Property tests over the readers of outside text (theseus-s68). Tests only;
# no forking runner, so each case runs in the test's own process.
proptest = { version = "1.11", default-features = false, features = ["std"] }

# Debug builds keep line tables for the workspace (backtraces still name file and line) and no debug info
# for dependencies. With full debug info, each test binary was about 400 MB, and the spine's target reached
# 84 GB (theseus-x10i). Debug assertions are unchanged: they come from the profile, not from debug info.
[profile.dev]
debug = "line-tables-only"

# Dependencies are optimized in debug builds too (theseus-1hk): the gate's lifecycle bench then times the start
# path more than unoptimized serde, sha2, and redb (a debug cold start's p50 went from 25.6 to 21.7 ms), and test
# binaries are a quarter smaller. A cold build takes about 3x the CPU, once. The workspace's crates stay at
# opt-level 0, so their debug assertions still run. Being outside the workspace, the dependencies' build scripts
# and proc macros take this section too, ahead of `build-override`.
[profile.dev.package."*"]
debug = false
opt-level = 2

# The install profile, and a tagged release's (theseus-o2myi): fat LTO and one codegen unit, the smallest and the
# quickest binary, for the cost of one slow link. `scripts/build.sh --profile release` builds it, and an install copies
# it (scripts/AGENTS.md has the measurements).
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# The cold crates (theseus-o2myi): code that runs when a tool is called or a file is read, once in a while and waiting
# on a network, a child, or a disk, never on a turn's path, the store, the kernel, the index, the sandbox, voice's audio
# loop, or the TUI's draw loop. Built for size, about a fifth less code each. The owner may veto a crate, and one that
# lands on a hot path comes out of this list.
# AWS: its whole model, one call per tool use, parsed on first use.
[profile.release.package.theseus-aws]
opt-level = "s"
[profile.release.package.theseus-aws-catalog]
opt-level = "s"
[profile.release.package.theseus-aws-guard]
opt-level = "s"
# Google Workspace: JSON REST, one request per tool call.
[profile.release.package.theseus-google]
opt-level = "s"
# A document read for the model (PDF, Office, archives, OCR): only when a file is read, in a capped child process.
[profile.release.package.theseus-files]
opt-level = "s"
# MCP and LSP: a protocol over a child's pipes or a socket, one round trip per call.
[profile.release.package.theseus-mcp]
opt-level = "s"
[profile.release.package.theseus-lsp]
opt-level = "s"

# The quick build (theseus-goa8; review 2's S7): the release profile without fat LTO and its single codegen unit, so a
# build after a change takes minutes less, for a bench, the AWS hand, or a try-out. Never an install: since
# theseus-o2myi an install is `release`. It inherits the release profile's package sections above. Cargo reserves the
# name `install`, hence this one. `scripts/build.sh --profile release-thin` builds it.
[profile.release-thin]
inherits = "release"
lto = "thin"
codegen-units = 16

# songbird, vendored (theseus-voice-dave): 0.6.1 as published, with one fix to its receive path. A DAVE-decrypted
# Opus frame is shorter than the frame it replaced, and 0.6.1 stored the packet with the old length, so the Opus
# decoder was handed the frame followed by DAVE's leftover trailer, and voice heard nothing. vendor/songbird/VENDORED.md
# says what changed; drop this once a songbird release carries the fix.
[patch.crates-io]
songbird = { path = "vendor/songbird" }
