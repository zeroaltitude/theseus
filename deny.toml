# cargo-deny configuration. Permissive-only dependency licences, enforced from the first commit.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-musl" },
]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.8
# MPL-2.0 is off the list (review 2's consideration 5: `shellexpand`, which brought it in, is gone). The voice
# engine's songbird brings it back by these seven crates alone, by name (rows 77 and 78, theseus-drrs; the licence is
# the owner's call, theseus-yl5w): symphonia's decoding and DAVE's HPKE. An MPL-2.0 crate anywhere else fails the gate.
exceptions = [
    { allow = ["MPL-2.0"], crate = "symphonia" },
    { allow = ["MPL-2.0"], crate = "symphonia-core" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
    { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
    { allow = ["MPL-2.0"], crate = "hpke-rs" },
    { allow = ["MPL-2.0"], crate = "hpke-rs-crypto" },
    { allow = ["MPL-2.0"], crate = "hpke-rs-rust-crypto" },
]

[bans]
# Two versions of one crate are a cost (compile time, binary size, a second copy to audit), so a duplicate must be
# named here with who pulls the older one; a new one fails the gate. Each entry's reason lists the crates that pull
# that older version. Some of those are our own (base64 0.22, rand 0.9, sha2 0.10 and hmac 0.12 are asked for by
# theseus-* crates while a dependency has moved to the next one), so part of this list is ours to remove by moving
# our own requirement; the rest is another stack's: the proc-macro crates (three copies of syn, and darling and
# derive_builder in hls_m3u8 and davey), the RustCrypto 0.10 generation (digest, cipher, crypto-common, block-buffer)
# under DAVE's stack, and the old tungstenite and rustls under serenity where they are in this graph. A reason names the
# crates that pull the version in the three targets' graphs as `cargo metadata` reads them, which includes
# development and build dependencies. Drop an entry when the crates it names move (theseus-tcdl).
multiple-versions = "deny"
skip = [
    { crate = "aes@0.8.4", reason = "pulled by aes-gcm, davey" },
    { crate = "base64@0.13.1", reason = "pulled by spm_precompiled" },
    { crate = "base64@0.22.1", reason = "pulled by axum, opentelemetry-proto, reqwest, serenity, tantivy, theseus, theseus-aws, theseus-core, theseus-files, theseus-google, theseus-judge, tokio-websockets" },
    { crate = "bitflags@1.3.2", reason = "pulled by defmt, symphonia-core" },
    { crate = "block-buffer@0.10.4", reason = "pulled by digest" },
    { crate = "chacha20@0.9.1", reason = "pulled by chacha20poly1305" },
    { crate = "cipher@0.4.4", reason = "pulled by aes, aes-gcm, chacha20, chacha20poly1305, ctr, davey, salsa20" },
    { crate = "const-oid@0.9.6", reason = "pulled by der, digest" },
    { crate = "convert_case@0.4.0", reason = "pulled by derive_more" },
    { crate = "cpufeatures@0.2.17", reason = "pulled by aes, chacha20, const-hex, curve25519-dalek, poly1305, polyval, sha1, sha2" },
    { crate = "crypto-common@0.1.7", reason = "pulled by aead, cipher, digest, songbird, universal-hash" },
    { crate = "darling@0.10.2", reason = "pulled by derive_builder, derive_builder_core" },
    { crate = "darling@0.20.11", reason = "pulled by derive_builder_core" },
    { crate = "darling_core@0.10.2", reason = "pulled by darling, darling_macro" },
    { crate = "darling_core@0.20.11", reason = "pulled by darling, darling_macro" },
    { crate = "darling_macro@0.10.2", reason = "pulled by darling" },
    { crate = "darling_macro@0.20.11", reason = "pulled by darling" },
    { crate = "derive_builder@0.9.0", reason = "pulled by hls_m3u8" },
    { crate = "derive_builder_core@0.9.0", reason = "pulled by derive_builder" },
    { crate = "derive_more@0.99.20", reason = "pulled by hls_m3u8" },
    { crate = "digest@0.10.7", reason = "pulled by curve25519-dalek, ecdsa, elliptic-curve, hmac, pbkdf2, sha1, sha2, signature" },
    { crate = "getrandom@0.2.17", reason = "pulled by nanorand, rand_core, ring" },
    { crate = "getrandom@0.3.4", reason = "pulled by ahash, openmls, rand_core, tokenizers" },
    { crate = "hashbrown@0.14.5", reason = "pulled by dashmap" },
    { crate = "hashbrown@0.16.1", reason = "pulled by clru, kasuari, lru, safetensors, twilight-http-ratelimiting" },
    { crate = "heck@0.3.3", reason = "pulled by strum_macros" },
    { crate = "hmac@0.12.1", reason = "pulled by davey, hkdf, openmls_rust_crypto, pbkdf2, rfc6979, theseus-core" },
    { crate = "inout@0.1.4", reason = "pulled by cipher" },
    { crate = "lru@0.16.4", reason = "pulled by tantivy" },
    { crate = "miniz_oxide@0.8.9", reason = "pulled by png" },
    { crate = "nom@7.1.3", reason = "pulled by spm_precompiled, tantivy-query-grammar" },
    { crate = "ordered-float@2.10.1", reason = "pulled by serde-value" },
    { crate = "parking_lot@0.11.2", reason = "pulled by fluvio-wasm-timer" },
    { crate = "parking_lot_core@0.8.6", reason = "pulled by parking_lot" },
    { crate = "rand@0.8.8", reason = "pulled by davey, hpke-rs-rust-crypto, openmls_basic_credential, openmls_rust_crypto, tungstenite" },
    { crate = "rand@0.9.5", reason = "pulled by candle-core, float8, half, libcrux-ecdh, libcrux-kem, libcrux-ml-kem, libcrux-traits, opentelemetry_sdk, proptest, rand_distr, songbird, theseus-google, theseus-mcp, theseus-sim, theseus-store, tokenizers, tungstenite" },
    { crate = "rand_chacha@0.3.1", reason = "pulled by hpke-rs-rust-crypto, openmls_rust_crypto, rand" },
    { crate = "rand_chacha@0.9.0", reason = "pulled by proptest, rand" },
    { crate = "rand_core@0.6.4", reason = "pulled by crypto-bigint, crypto-common, ed25519-dalek, elliptic-curve, ff, group, hpke-rs-rust-crypto, rand, rand_chacha, signature, x25519-dalek" },
    { crate = "rand_core@0.9.5", reason = "pulled by hpke-rs, hpke-rs-crypto, rand, rand_chacha, rand_xorshift" },
    { crate = "sha2@0.10.9", reason = "pulled by davey, ed25519-dalek, hpke-rs-rust-crypto, openmls_rust_crypto, p256, scrypt, theseus, theseus-core, theseus-discord, theseus-exam, theseus-google, theseus-index, theseus-judge, theseus-kernel, theseus-mcp, theseus-ontology, theseus-store" },
    { crate = "socket2@0.5.10", reason = "pulled by songbird" },
    { crate = "strsim@0.9.3", reason = "pulled by darling_core" },
    { crate = "strum@0.17.1", reason = "pulled by hls_m3u8" },
    { crate = "strum_macros@0.17.1", reason = "pulled by strum" },
    { crate = "syn@1.0.109", reason = "pulled by darling_core, darling_macro, derivative, derive_builder, derive_builder_core, hashmap_derive, shorthand, strum_macros" },
    { crate = "syn@2.0.119", reason = "pulled by aws-smithy-runtime-api-macros, curve25519-dalek-derive, darling_core, darling_macro, defmt-macros, derive_builder_core, derive_builder_macro, derive_more, derive_more-impl, enum-map-derive, gix-macros, hax-lib-macros, jiff-static, libcrux-macros, monostate-impl, num-derive, palette_derive, pin-project-internal, pnet_macros, prost-derive, rust-embed-impl, strum_macros, thiserror-impl, tls_codec_derive, tracing-attributes, ts-rs-macros, zerocopy-derive, zeroize_derive" },
    { crate = "thiserror@1.0.69", reason = "pulled by hls_m3u8, tungstenite" },
    { crate = "thiserror-impl@1.0.69", reason = "pulled by thiserror" },
    { crate = "tokio-tungstenite@0.26.2", reason = "pulled by songbird, theseus-voice" },
    { crate = "tokio-websockets@0.11.4", reason = "pulled by songbird" },
    { crate = "tungstenite@0.26.2", reason = "pulled by tokio-tungstenite" },
    { crate = "webpki-roots@0.26.11", reason = "pulled by theseus-voice, tokio-tungstenite" },
    { crate = "winnow@0.7.15", reason = "pulled by toml" },
    { crate = "zip@8.6.0", reason = "pulled by candle-core" },
]
# Path dependencies inside this workspace are not wildcards; the action's
# bundled cargo-deny cannot resolve `dep.workspace = true` and flags them.
wildcards = "allow"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Each ignore names its reason and the step that took it; drop each when its upstream releases a fix.
ignore = [
    # 29c (lane vectors, theseus-nz8): candle's matmul engine, gemm, needs this build-time proc-macro.
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, not vulnerable; a proc-macro gemm (candle) needs" },
    # 44a (lane voice, theseus-3xn), back with voice at rows 77 and 78 (theseus-drrs): songbird 0.6.0 and DAVE
    # (davey, openmls, hpke-rs). None is fixable by `cargo update`. The three libcrux lines rest on 44a's trace,
    # checked at its review: hpke-rs calls SHA-3 only to derive X-Wing or ML-KEM keys, openmls's RustCrypto provider
    # maps only the DH KEMs, and DAVE's one ciphersuite is DH P-256 with SHA-256.
    { id = "RUSTSEC-2024-0388", reason = "derivative: unmaintained, not vulnerable; a proc-macro songbird uses at build time" },
    { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained, not vulnerable; std's Instant off wasm, via openmls's parking_lot 0.11" },
    { id = "RUSTSEC-2026-0207", reason = "libcrux-sha3 SHAKE: only hpke-rs's X-Wing/ML-KEM key derivation calls it; DAVE's P-256 KEM never does (44a's trace)" },
    { id = "RUSTSEC-2026-0208", reason = "libcrux-sha3 AVX2 SHAKE-256: unreachable from DAVE, as RUSTSEC-2026-0207 (44a's trace)" },
    { id = "RUSTSEC-2026-0212", reason = "libcrux-secrets: reached only through libcrux-sha3, unreachable from DAVE (44a's trace)" },
    { id = "RUSTSEC-2026-0293", reason = "ringbuf: songbird's only ring is of u8, which has no Drop to panic, for HTTP/HLS inputs voice never makes" },
    # theseus-ux1gl (patch2 release, 2026-10-23): crypto-bigint 0.5.5 comes only through DAVE's P-256 (elliptic-curve
    # 0.13 under p256, p384, k256, hpke-rs and openmls, from davey in songbird); the fix is 0.7.6, which needs
    # elliptic-curve 0.14, and davey 0.1.5 does not move. A timing side channel needs an observer on this machine
    # during a voice session's key work. Drop when the DAVE stack moves to elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing: DAVE's P-256 only, local observer needed, no 0.5 fix (ux1gl)" },
    # theseus-n402p: theseus-files reads archives through zip 9 (patched); zip 8.6 stays only for candle-core 0.11.0
    # (the latest, which pins ^8.6). All three are in ZipArchive::extract / ZipStreamReader::extract, which neither
    # candle (npy/pickle: ZipArchive::by_name and ZipWriter) nor this workspace ever calls. Drop with candle's bump.
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6 SUID bits on extract: candle-core reads and writes .npz/.pth in memory and never extracts (n402p)" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6 symlink targets on extract: unreachable, as RUSTSEC-2026-0367 (n402p)" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6 permissions through symlinks on extract: unreachable, as RUSTSEC-2026-0367 (n402p)" },
    # theseus-4vsrz (the owner, 2026-11-09): the two that held the daily deny job red with no branch in flight.
    # zip 8.6.0 is pulled only by candle-core 0.11.0 (the latest, which pins ^8.6); theseus-files uses zip 9.0.5, the
    # patched one. The defect is `ZipArchive::extract()` sizing a symlink target's buffer from the declared size, so a
    # symlink entry declaring a huge size aborts the process. candle-core only opens an archive (`ZipArchive::new` and
    # `by_name`, in pickle.rs) and never extracts one, and the models it loads come from sources we trust. Drop with
    # candle's bump to zip 9.
    { id = "RUSTSEC-2026-0429", reason = "zip 8.6.0 extract() aborts on a symlink entry with a huge declared size: candle-core 0.11.0 is its only user, never extracts, and loads models from trusted sources; theseus-files has zip 9.0.5 (4vsrz)" },
    # pin-utils 0.1.1 is unmaintained, with no patched release. aws-smithy-http and aws-smithy-types pull it, so it is
    # the AWS SDK's dependency to replace, not ours; fluvio-wasm-timer pulls it too, under openmls under songbird, the
    # voice stack's. Drop when they stop using it.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils 0.1.1 unmaintained, no patch: pulled by aws-smithy-http and aws-smithy-types (the SDK's dependency to replace) and fluvio-wasm-timer (songbird's openmls), not ours (4vsrz)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
