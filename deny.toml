# cargo-deny configuration. Permissive-only dependency licences, enforced from the first commit.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-musl" },
]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.8
# MPL-2.0 is off the list (review 2's consideration 5: `shellexpand`, which brought it in, is gone). The voice
# engine's songbird brings it back by these seven crates alone, by name (rows 77 and 78, theseus-drrs; the licence is
# the owner's call, theseus-yl5w): symphonia's decoding and DAVE's HPKE. An MPL-2.0 crate anywhere else fails the gate.
exceptions = [
    { allow = ["MPL-2.0"], crate = "symphonia" },
    { allow = ["MPL-2.0"], crate = "symphonia-core" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
    { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
    { allow = ["MPL-2.0"], crate = "hpke-rs" },
    { allow = ["MPL-2.0"], crate = "hpke-rs-crypto" },
    { allow = ["MPL-2.0"], crate = "hpke-rs-rust-crypto" },
]

[bans]
multiple-versions = "allow"
# Path dependencies inside this workspace are not wildcards; the action's
# bundled cargo-deny cannot resolve `dep.workspace = true` and flags them.
wildcards = "allow"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Each ignore names its reason and the step that took it; drop each when its upstream releases a fix.
ignore = [
    # 29c (lane vectors, theseus-nz8): candle's matmul engine, gemm, needs this build-time proc-macro.
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, not vulnerable; a proc-macro gemm (candle) needs" },
    # 44a (lane voice, theseus-3xn), back with voice at rows 77 and 78 (theseus-drrs): songbird 0.6.0 and DAVE
    # (davey, openmls, hpke-rs). None is fixable by `cargo update`. The three libcrux lines rest on 44a's trace,
    # checked at its review: hpke-rs calls SHA-3 only to derive X-Wing or ML-KEM keys, openmls's RustCrypto provider
    # maps only the DH KEMs, and DAVE's one ciphersuite is DH P-256 with SHA-256.
    { id = "RUSTSEC-2024-0388", reason = "derivative: unmaintained, not vulnerable; a proc-macro songbird uses at build time" },
    { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained, not vulnerable; std's Instant off wasm, via openmls's parking_lot 0.11" },
    { id = "RUSTSEC-2026-0207", reason = "libcrux-sha3 SHAKE: only hpke-rs's X-Wing/ML-KEM key derivation calls it; DAVE's P-256 KEM never does (44a's trace)" },
    { id = "RUSTSEC-2026-0208", reason = "libcrux-sha3 AVX2 SHAKE-256: unreachable from DAVE, as RUSTSEC-2026-0207 (44a's trace)" },
    { id = "RUSTSEC-2026-0212", reason = "libcrux-secrets: reached only through libcrux-sha3, unreachable from DAVE (44a's trace)" },
    { id = "RUSTSEC-2026-0293", reason = "ringbuf: songbird's only ring is of u8, which has no Drop to panic, for HTTP/HLS inputs voice never makes" },
    # theseus-ux1gl (patch2 release, 2026-10-23): crypto-bigint 0.5.5 comes only through DAVE's P-256 (elliptic-curve
    # 0.13 under p256, p384, k256, hpke-rs and openmls, from davey in songbird); the fix is 0.7.6, which needs
    # elliptic-curve 0.14, and davey 0.1.5 does not move. A timing side channel needs an observer on this machine
    # during a voice session's key work. Drop when the DAVE stack moves to elliptic-curve 0.14.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing: DAVE's P-256 only, local observer needed, no 0.5 fix (ux1gl)" },
    # theseus-n402p: theseus-files reads archives through zip 9 (patched); zip 8.6 stays only for candle-core 0.11.0
    # (the latest, which pins ^8.6). All three are in ZipArchive::extract / ZipStreamReader::extract, which neither
    # candle (npy/pickle: ZipArchive::by_name and ZipWriter) nor this workspace ever calls. Drop with candle's bump.
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6 SUID bits on extract: candle-core reads and writes .npz/.pth in memory and never extracts (n402p)" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6 symlink targets on extract: unreachable, as RUSTSEC-2026-0367 (n402p)" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6 permissions through symlinks on extract: unreachable, as RUSTSEC-2026-0367 (n402p)" },
    # theseus-4vsrz (the owner, 2026-11-09): the two that held the daily deny job red with no branch in flight.
    # zip 8.6.0 is pulled only by candle-core 0.11.0 (the latest, which pins ^8.6); theseus-files uses zip 9.0.5, the
    # patched one. The defect is `ZipArchive::extract()` sizing a symlink target's buffer from the declared size, so a
    # symlink entry declaring a huge size aborts the process. candle-core only opens an archive (`ZipArchive::new` and
    # `by_name`, in pickle.rs) and never extracts one, and the models it loads come from sources we trust. Drop with
    # candle's bump to zip 9.
    { id = "RUSTSEC-2026-0429", reason = "zip 8.6.0 extract() aborts on a symlink entry with a huge declared size: candle-core 0.11.0 is its only user, never extracts, and loads models from trusted sources; theseus-files has zip 9.0.5 (4vsrz)" },
    # pin-utils 0.1.1 is unmaintained, with no patched release. aws-smithy-http and aws-smithy-types pull it, so it is
    # the AWS SDK's dependency to replace, not ours; fluvio-wasm-timer pulls it too, under openmls under songbird, the
    # voice stack's. Drop when they stop using it.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils 0.1.1 unmaintained, no patch: pulled by aws-smithy-http and aws-smithy-types (the SDK's dependency to replace) and fluvio-wasm-timer (songbird's openmls), not ours (4vsrz)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
