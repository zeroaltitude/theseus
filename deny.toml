# cargo-deny configuration. Permissive-only dependency licences, enforced from the first commit.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-musl" },
]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.8
# MPL-2.0 is off the list (review 2's consideration 5: `shellexpand`, which brought it in, is gone). The voice
# engine's songbird still brings it, by these crates alone, until the licence is decided (theseus-yl5w); an
# MPL-2.0 crate anywhere else fails the gate.
exceptions = [
    { allow = ["MPL-2.0"], crate = "symphonia" },
    { allow = ["MPL-2.0"], crate = "symphonia-core" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
    { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
    { allow = ["MPL-2.0"], crate = "hpke-rs" },
    { allow = ["MPL-2.0"], crate = "hpke-rs-crypto" },
    { allow = ["MPL-2.0"], crate = "hpke-rs-rust-crypto" },
]

[bans]
multiple-versions = "allow"
# Path dependencies inside this workspace are not wildcards; the action's
# bundled cargo-deny cannot resolve `dep.workspace = true` and flags them.
wildcards = "allow"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Each ignore names its reason and the step that took it; drop each when its upstream releases a fix.
ignore = [
    # 29c (lane vectors, theseus-nz8): candle's matmul engine, gemm, needs this build-time proc-macro.
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, not vulnerable; a proc-macro gemm (candle) needs" },
    # 44a (lane voice, theseus-3xn): songbird 0.6.0 and DAVE (davey, openmls, hpke-rs). None is fixable by
    # `cargo update`. The three libcrux lines rest on 44a's trace, checked at its review: hpke-rs calls
    # SHA-3 only to derive X-Wing or ML-KEM keys, openmls's RustCrypto provider maps only the DH KEMs, and
    # DAVE's one ciphersuite is DH P-256 with SHA-256.
    { id = "RUSTSEC-2024-0388", reason = "derivative: unmaintained, not vulnerable; a proc-macro songbird uses at build time" },
    { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained, not vulnerable; std's Instant off wasm, via openmls's parking_lot 0.11" },
    { id = "RUSTSEC-2026-0207", reason = "libcrux-sha3 SHAKE: only hpke-rs's X-Wing/ML-KEM key derivation calls it; DAVE's P-256 KEM never does (44a's trace)" },
    { id = "RUSTSEC-2026-0208", reason = "libcrux-sha3 AVX2 SHAKE-256: unreachable from DAVE, as RUSTSEC-2026-0207 (44a's trace)" },
    { id = "RUSTSEC-2026-0212", reason = "libcrux-secrets: reached only through libcrux-sha3, unreachable from DAVE (44a's trace)" },
    { id = "RUSTSEC-2026-0293", reason = "ringbuf: songbird's only ring is of u8, which has no Drop to panic, for HTTP/HLS inputs voice never makes" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
