# cargo-deny configuration. Permissive-only dependency licences, enforced from the first commit.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-musl" },
]
all-features = false

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.8
# MPL-2.0 is off the list (review 2's consideration 5: `shellexpand`, which brought it in, is gone), with no
# exceptions: the seven MPL-2.0 crates under the voice engine's songbird left the workspace with it (theseus-o8nk),
# and their licence is decided before row 77 brings it back (theseus-yl5w).

[bans]
multiple-versions = "allow"
# Path dependencies inside this workspace are not wildcards; the action's
# bundled cargo-deny cannot resolve `dep.workspace = true` and flags them.
wildcards = "allow"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Each ignore names its reason and the step that took it; drop each when its upstream releases a fix.
ignore = [
    # 29c (lane vectors, theseus-nz8): candle's matmul engine, gemm, needs this build-time proc-macro.
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, not vulnerable; a proc-macro gemm (candle) needs" },
    # The six ignores 44a took for songbird 0.6.0 and DAVE (derivative, instant, libcrux-sha3 twice, libcrux-secrets,
    # ringbuf) left with the voice engine (theseus-o8nk); commit 3a0a567 has them, with 44a's trace, for row 77.
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
