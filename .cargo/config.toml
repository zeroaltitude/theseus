# Static musl target. ring (via rustls) compiles a little C; musl-gcc from
# musl-tools is the right compiler for it. CI installs musl-tools too, and builds
# it on every push as the portable artifact; an install is the host's glibc build
# (scripts/AGENTS.md, "glibc or static musl").
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[env]
CC_x86_64_unknown_linux_musl = { value = "musl-gcc", force = false }
AR_x86_64_unknown_linux_musl = { value = "ar", force = false }
