name: ci
on:
  push:
    branches: [main]
  pull_request:
# Only what passes on a stock runner (theseus-o8nk): formatting, clippy as the gate runs it, the Observatory's
# committed build, and cargo-deny's licences, bans, and sources. The suite needs this machine (user namespaces,
# cgroups, a fake `op`), so it runs in the commit gate, scripts/gate.sh, and not here: 190 of the 200 runs before
# this change failed at `cargo test`, and never reached a later step.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain is the one rust-toolchain.toml pins, with its components (theseus-goa8; review 2's SC1):
      # a bare `rustup toolchain install` reads that file.
      - name: the pinned toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web UI builds and the committed dist is current
        run: |
          cd web && npm ci && npm run build
          cd .. && git diff --exit-code --stat crates/theseusd/web/dist
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -q -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans
          rust-version: stable
