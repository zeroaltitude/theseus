name: ci
on:
  push:
    branches: [main]
  pull_request:
# Only what passes on a stock runner (theseus-o8nk): formatting, clippy as the gate runs it, the cockpit's lint,
# tests, and build, and cargo-deny's licences, bans, and sources. The suite needs this machine (user namespaces,
# cgroups, a fake `op`), so it runs in the commit gate, scripts/gate.sh, and not here: 190 of the 200 runs before
# this change failed at `cargo test`, and never reached a later step.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain is the one rust-toolchain.toml pins, with its components (theseus-goa8; review 2's SC1):
      # a bare `rustup toolchain install` reads that file.
      - name: the pinned toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cockpit/package-lock.json
      # The web UI, the cockpit (theseus-vm3n.6): its build is not committed, so this checks that it builds.
      - name: the cockpit lints, passes its tests, and builds
        run: cd cockpit && npm ci && npm run lint && npm test && npm run build
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -q -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans
          rust-version: stable
