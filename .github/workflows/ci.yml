name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web UI builds and the committed dist is current
        run: |
          cd web && npm ci && npm run build
          cd .. && git diff --exit-code --stat crates/theseusd/web/dist
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y -q musl-tools
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources bans
          rust-version: stable
      - name: static musl release build
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: verify static
        run: |
          file target/x86_64-unknown-linux-musl/release/theseusd
          ! ldd target/x86_64-unknown-linux-musl/release/theseusd 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: theseus-x86_64-musl
          path: |
            target/x86_64-unknown-linux-musl/release/theseusd
            target/x86_64-unknown-linux-musl/release/theseus
